<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IA aplicada en procesos administrativos, jurídicos, laborales y de gestión documental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sena:#39A900; --sena2:#007832; --navy:#00304D; --sena-soft:#E8F5DF;
  --bg:#F4F7F5; --panel:#FFFFFF; --panel2:#F8FAF9; --ink:#14212B; --muted:#5B6B76; --line:#E1E8E4;
  --accent:#00304D; --chip:#EEF4F0; --shadow:0 1px 2px rgba(0,48,77,.06),0 6px 20px rgba(0,48,77,.06);
  --ok:#2E8B16; --bad:#C62828; --warn:#C77700; --link:#007832; --nv:#00304D;
}
:root:not([data-theme="light"]){color-scheme:light}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1620; --panel:#112230; --panel2:#0E1D29; --ink:#E7EEF2; --muted:#9DB0BC; --line:#1F3546;
    --accent:#7FD45A; --chip:#173042; --sena-soft:#16331F; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --ok:#6BCB45; --bad:#FF6B6B; --warn:#F2B44A; --link:#7FD45A; --nv:#1F6A99; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1620; --panel:#112230; --panel2:#0E1D29; --ink:#E7EEF2; --muted:#9DB0BC; --line:#1F3546;
  --accent:#7FD45A; --chip:#173042; --sena-soft:#16331F; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --ok:#6BCB45; --bad:#FF6B6B; --warn:#F2B44A; --link:#7FD45A; --nv:#1F6A99; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Work Sans",Calibri,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15.5px;line-height:1.55}
a{color:var(--link);font-weight:500}
svg{width:1.05em;height:1.05em;vertical-align:-.15em;flex:none}
svg.inf{width:100%;height:auto}
button{font-family:inherit}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--navy);color:#fff;position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;gap:12px;align-items:center;padding:4px 6px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand img{width:46px;height:46px;border-radius:10px;flex:none}
.brand b{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#A9E58A}
.brand span{font-size:13px;opacity:.85;line-height:1.3;display:block}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#D6E3EA;padding:9px 10px;border-radius:9px;font-size:14px;cursor:pointer}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:var(--sena);color:#fff;font-weight:600}
.nav button .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:transparent}
.nav button.seen .dot{background:#A9E58A}
.nav button.on .dot{background:#fff}
.nav svg{width:18px;height:18px;flex:none}
.side .foot{margin-top:auto;font-size:12px;opacity:.7;line-height:1.4;padding:8px 6px}
/* main */
.main{min-width:0}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 28px}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.prog{width:160px;flex:none}
.prog .bar{height:7px;background:var(--line);border-radius:9px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--sena);width:0;transition:width .4s}
.prog small{font-size:11.5px;color:var(--muted)}
.tog{display:flex;gap:6px;flex:none}
.tog button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.tog button:hover{border-color:var(--sena)}
.tog svg{width:16px;height:16px}
.content{padding:26px 28px 60px;max-width:1240px}
section.pane{display:none;animation:fade .35s ease}
section.pane.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2.sec{font-size:26px;margin:0 0 4px;letter-spacing:-.02em;font-weight:700}
p.lead{color:var(--muted);margin:0 0 22px;max-width:820px}
h3{font-size:18px;margin:0 0 8px;font-weight:700}
h4{font-size:15px;margin:14px 0 6px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mt{margin-top:16px}.mt2{margin-top:26px}
.hero{background:linear-gradient(120deg,var(--navy) 0%,#00476F 55%,var(--sena2) 100%);color:#fff;border-radius:20px;padding:28px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;overflow:hidden;position:relative}
.hero h2{font-size:30px;margin:4px 0 8px;letter-spacing:-.02em;line-height:1.15}
.hero p{margin:0;opacity:.9;max-width:640px}
.hero .tag{display:inline-block;background:var(--sena);padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.hero svg.av{width:150px;height:150px}
.kpi{display:flex;gap:14px;align-items:center}
.kpi .ic{width:46px;height:46px;border-radius:12px;background:var(--sena-soft);color:var(--sena2);display:grid;place-items:center;flex:none}
:root[data-theme="dark"] .kpi .ic{color:#7FD45A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kpi .ic{color:#7FD45A}}
.kpi .ic svg{width:24px;height:24px}
.kpi b{font-size:24px;display:block;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--ink)}
.chip.g{background:var(--sena);color:#fff}
.chip.n{background:var(--navy);color:#fff}
.list{margin:0;padding-left:20px}.list li{margin:4px 0}
/* subtopic */
.sub{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.sub .num{font-size:12px;font-weight:700;color:var(--sena);letter-spacing:.08em;text-transform:uppercase}
.ex{border-left:4px solid var(--sena);background:var(--panel2);border-radius:0 12px 12px 0;padding:12px 14px;margin-top:12px;font-size:14.5px}
.ex b{color:var(--sena2)}
:root[data-theme="dark"] .ex b{color:#7FD45A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ex b{color:#7FD45A}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:7px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.tabs button.on{background:var(--nv);border-color:var(--nv);color:#fff}
/* infographics */
.info{background:var(--panel2);border:1px dashed var(--line);border-radius:14px;padding:14px}
.info .cap{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.flow .st{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;position:relative}
.flow .st b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sena);color:#fff;margin:0 auto 6px;font-size:14px}
.flow .st:nth-child(even) b{background:var(--navy)}
.flow .st span{font-size:13px;font-weight:600;display:block;line-height:1.3}
.flow .st small{font-size:12px;color:var(--muted);display:block;margin-top:3px;line-height:1.3}
.igrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.igrid div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.igrid b{font-size:22px;color:var(--sena);display:block;line-height:1}
.igrid span{font-weight:700;font-size:13.5px;display:block;margin-top:4px}
.igrid small{font-size:12px;color:var(--muted);line-height:1.3;display:block}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp>div{border-radius:12px;padding:12px;background:var(--panel);border:1px solid var(--line)}
.cmp>div:first-child{border-top:4px solid var(--navy)}.cmp>div:last-child{border-top:4px solid var(--sena)}
.cmp ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}
svg.inf{width:100%;height:auto;display:block}
svg.inf text{font-family:"Work Sans",sans-serif}
/* avatar tip */
.tip{display:flex;gap:12px;align-items:flex-start;margin-top:14px}
.tip svg{width:54px;height:54px;flex:none}
.tip .bub{background:var(--sena-soft);border-radius:4px 14px 14px 14px;padding:10px 13px;font-size:14px}
.tip .bub b{display:block;font-size:12px;color:var(--sena2);letter-spacing:.04em}
:root[data-theme="dark"] .tip .bub b{color:#7FD45A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tip .bub b{color:#7FD45A}}
/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--panel)}
th{background:var(--navy);color:#fff;text-align:left;padding:10px 12px;font-weight:600;font-size:13px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:var(--panel2)}
/* forms */
label.f{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input[type=text],textarea,select{width:100%;font-family:inherit;font-size:14.5px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;padding:9px 11px}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--sena);border-color:transparent}
.btn{border:0;background:var(--sena);color:#fff;font-weight:700;border-radius:10px;padding:9px 16px;cursor:pointer;font-size:14px;display:inline-flex;gap:7px;align-items:center}
.btn.alt{background:var(--nv)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.07)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.meter{height:12px;background:var(--line);border-radius:9px;overflow:hidden}
.meter i{display:block;height:100%;transition:width .35s,background .35s}
.out{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;white-space:pre-wrap;min-height:60px}
.okc{color:var(--ok);font-weight:700}.badc{color:var(--bad);font-weight:700}.warnc{color:var(--warn);font-weight:700}
.bars .b{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bars .b div{height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.bars .b i{display:block;height:100%;background:var(--sena)}
.opt{display:block;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:6px 0;cursor:pointer;background:var(--panel)}
.opt:hover{border-color:var(--sena)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--panel))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel))}
.fb{font-size:13.5px;margin-top:6px}
.vid{display:block;text-decoration:none;color:inherit;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);transition:transform .2s}
.vid:hover{transform:translateY(-3px)}
.vid .th{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,var(--navy),var(--sena2));display:grid;place-items:center;color:#fff}
.vid .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid .th .pl{position:relative;width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center}
.vid .th .pl svg{width:24px;height:24px;margin-left:3px}
.vid .th .lg{position:absolute;top:8px;left:8px;background:var(--sena);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
.vid .bd{padding:10px 12px}
.vid .bd b{font-size:14px;display:block;line-height:1.3}
.vid .bd small{color:var(--muted);font-size:12.5px}
.step{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .n{width:40px;height:40px;border-radius:12px;background:var(--nv);color:#fff;display:grid;place-items:center;font-weight:800}
.step.done .n{background:var(--sena)}
.step .tm{font-size:12px;font-weight:700;color:var(--sena2);text-transform:uppercase;letter-spacing:.05em}
:root[data-theme="dark"] .step .tm{color:#7FD45A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .step .tm{color:#7FD45A}}
.step ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.timeline{display:flex;height:16px;border-radius:9px;overflow:hidden;margin:10px 0 4px}
.timeline i{display:block;height:100%}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.gl div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.gl b{color:var(--sena2)}
:root[data-theme="dark"] .gl b{color:#7FD45A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gl b{color:#7FD45A}}
.gl p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.res{display:flex;gap:12px;align-items:flex-start}
.res .ic{width:38px;height:38px;border-radius:10px;background:var(--nv);color:#fff;display:grid;place-items:center;flex:none}
.res .ic svg{width:20px;height:20px}
code{background:var(--chip);padding:1px 6px;border-radius:6px;font-size:.88em;font-family:Consolas,monospace}
mark{background:#FFE58F;color:#000;border-radius:4px;padding:0 3px}
.score{font-size:40px;font-weight:800;color:var(--sena)}
.small{font-size:13px;color:var(--muted)}
.hide{display:none!important}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:column}
  .nav{flex-direction:row;overflow:auto;gap:4px;padding-bottom:4px}
  .nav button{white-space:nowrap;width:auto}
  .side .foot{display:none}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sub{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}.hero svg.av{display:none}
}
@media (max-width:620px){
  .content{padding:18px 16px 50px}.top{padding:10px 16px;flex-wrap:wrap}
  .prog{order:3;width:100%}
  .g2,.g3,.g4,.cmp{grid-template-columns:1fr}
  .hero h2{font-size:24px}
}
</style>
</head>

<script>
const D = {"meta": {"id": "ova2", "code": {"es": "OVA 2 · Tema 2", "en": "OVA 2 · Topic 2"}, "short": {"es": "IA en procesos administrativos, jurídicos, laborales y documentales", "en": "AI in administrative, legal, HR and records processes"}, "title": {"es": "IA aplicada en procesos administrativos, jurídicos, laborales y de gestión documental", "en": "AI applied to administrative, legal, labour and records-management processes"}, "event": {"es": "EDT Transformación Digital, IA e Innovación Tecnológica", "en": "TDE Digital Transformation, AI and Technological Innovation"}, "when": {"es": "Día 1 · Martes 3 de noviembre de 2026 · 1:15 – 5:30 p.m.", "en": "Day 1 · Tuesday, November 3, 2026 · 1:15 – 5:30 p.m."}, "intro": {"es": "Lleve la IA a su trabajo diario: redacte y resuma documentos, analice contratos, apoye la gestión del talento humano y organice archivos, siempre con seguridad, verificación y protección de datos.", "en": "Bring AI into your daily work: draft and summarise documents, analyse contracts, support HR management and organise records, always with security, verification and data protection."}, "hours": {"es": "4 horas · Taller de 1 h 45 min", "en": "4 hours · 1 h 45 min workshop"}, "instructor": {"es": "Instructor: José Andrés Zambrano", "en": "Instructor: José Andrés Zambrano"}, "center": {"es": "Centro de Diseño y Metrología – SENA", "en": "Centro de Diseño y Metrología – SENA"}}, "kpis": [{"icon": "layers", "v": "5", "l": {"es": "subtemas por proceso", "en": "subtopics by process"}}, {"icon": "cpu", "v": "4", "l": {"es": "simuladores de IA", "en": "AI simulators"}}, {"icon": "wrench", "v": "1 h 45", "l": {"es": "taller con 4 casos", "en": "workshop with 4 cases"}}, {"icon": "quiz", "v": "10", "l": {"es": "preguntas de autoevaluación", "en": "self-assessment questions"}}], "route": {"type": "flow", "title": {"es": "cuatro procesos, un mismo método", "en": "four processes, one method"}, "items": [{"t": {"es": "Administrativo", "en": "Administrative"}, "d": {"es": "Oficios, actas, PQRS", "en": "Letters, minutes, requests"}}, {"t": {"es": "Jurídico", "en": "Legal"}, "d": {"es": "Contratos y normas", "en": "Contracts and rules"}}, {"t": {"es": "Laboral", "en": "Labour/HR"}, "d": {"es": "Perfiles y clima", "en": "Profiles and climate"}}, {"t": {"es": "Documental", "en": "Records"}, "d": {"es": "TRD, metadatos, OCR", "en": "Schedules, metadata, OCR"}}, {"t": {"es": "Verificar", "en": "Verify"}, "d": {"es": "Humano en el circuito", "en": "Human in the loop"}}]}, "howto": [{"es": "Revise primero la explicación por proceso y luego practique con los simuladores.", "en": "First review the explanation by process, then practise with the simulators."}, {"es": "Use el modo oscuro o el cambio de idioma desde la barra superior.", "en": "Use dark mode or switch language from the top bar."}, {"es": "Todos los casos y documentos de práctica son ficticios.", "en": "All practice cases and documents are fictitious."}, {"es": "La regla de oro: la IA propone, usted verifica, decide y responde.", "en": "The golden rule: AI proposes, you verify, decide and are accountable."}], "homeTip": {"es": "Con la IA redacto el borrador del acta en minutos; mi trabajo ahora es revisar que cada decisión quede bien escrita.", "en": "With AI I draft the minutes in minutes; my job now is to check that every decision is correctly written."}, "objective": {"es": "Aplicar herramientas de inteligencia artificial en tareas propias de los procesos administrativos, jurídicos, laborales y de gestión documental del SENA, con criterios de seguridad, verificación y protección de datos.", "en": "Apply artificial intelligence tools to tasks of SENA's administrative, legal, labour and records-management processes, with security, verification and data-protection criteria."}, "objTip": {"es": "Esta tarde trabajarán como un equipo de «clínica»: diagnostican el caso, aplican la IA y verifican el resultado.", "en": "This afternoon you will work as a “clinic” team: diagnose the case, apply AI and verify the result."}, "outcomes": [{"es": "Usar IA para redactar, resumir y responder PQRS en lenguaje claro.", "en": "Use AI to draft, summarise and answer requests in plain language."}, {"es": "Extraer obligaciones, plazos y riesgos de un contrato como apoyo, no como concepto jurídico.", "en": "Extract obligations, deadlines and risks from a contract as support, not as a legal opinion."}, {"es": "Apoyar procesos de talento humano cuidando sesgos y equidad.", "en": "Support HR processes while watching for bias and fairness."}, {"es": "Clasificar documentos según la TRD y proponer metadatos.", "en": "Classify documents according to the records schedule and propose metadata."}, {"es": "Anonimizar información y aplicar el principio de humano en el circuito.", "en": "Anonymise information and apply the human-in-the-loop principle."}], "subtopics": [{"n": "2.1", "t": {"es": "Procesos administrativos", "en": "Administrative processes"}, "av": "laura", "body": {"es": "<p>La IA generativa acelera las tareas de escritura y síntesis que ocupan buena parte del tiempo administrativo:<\/p><p><b>Redacción<\/b> de oficios, memorandos, circulares y actas a partir de notas o de la transcripción de una reunión.<\/p><p><b>Resumen<\/b> de informes extensos, hilos de correo y normas, destacando decisiones, plazos y responsables.<\/p><p><b>Respuesta a PQRS en lenguaje claro<\/b>: oraciones cortas, voz activa, sin tecnicismos innecesarios y con los pasos que debe seguir el ciudadano. El plazo general de respuesta a peticiones es de 15 días hábiles (Ley 1755 de 2015), lo cual debe verificarse para cada tipo de solicitud.<\/p><p><b>Consolidación de informes<\/b> de gestión a partir de tablas, con hallazgos y recomendaciones.<\/p>", "en": "<p>Generative AI speeds up the writing and synthesis tasks that take up much administrative time:<\/p><p><b>Drafting<\/b> letters, memos, circulars and minutes from notes or a meeting transcript.<\/p><p><b>Summarising<\/b> long reports, email threads and regulations, highlighting decisions, deadlines and owners.<\/p><p><b>Answering citizen requests in plain language<\/b>: short sentences, active voice, no unnecessary jargon and the steps the citizen must follow. The general response time for petitions in Colombia is 15 working days (Law 1755 of 2015), which must be checked for each request type.<\/p><p><b>Consolidating management reports<\/b> from tables, with findings and recommendations.<\/p>"}, "ex": {"es": "Con la transcripción de Teams del comité, Copilot propone el acta con decisiones, responsables y fechas; la secretaria técnica la revisa y ajusta antes de circularla.", "en": "From the Teams transcript of the committee, Copilot proposes the minutes with decisions, owners and dates; the technical secretary reviews and adjusts them before circulating."}, "tip": {"es": "Pida siempre el resultado en el formato institucional: «usa la estructura de oficio del SENA: asunto, saludo, cuerpo, cierre y firma».", "en": "Always ask for the institutional format: “use SENA's letter structure: subject, greeting, body, closing and signature”."}, "g": {"type": "flow", "title": {"es": "respuesta a una PQRS con IA", "en": "answering a request with AI"}, "items": [{"t": {"es": "Anonimizar", "en": "Anonymise"}, "d": {"es": "Quitar datos personales", "en": "Remove personal data"}}, {"t": {"es": "Instruir", "en": "Instruct"}, "d": {"es": "Rol, contexto, tono, plazo", "en": "Role, context, tone, deadline"}}, {"t": {"es": "Generar", "en": "Generate"}, "d": {"es": "Borrador de respuesta", "en": "Draft reply"}}, {"t": {"es": "Verificar", "en": "Verify"}, "d": {"es": "Datos, norma, lenguaje claro", "en": "Data, rules, plain language"}}, {"t": {"es": "Firmar", "en": "Sign"}, "d": {"es": "El funcionario responde", "en": "The officer is accountable"}}]}, "g2": {"type": "grid", "title": {"es": "tiempo estimado", "en": "estimated time"}, "items": [{"k": "−50%", "t": {"es": "Borrador de acta", "en": "Minutes draft"}, "d": {"es": "estimación ilustrativa", "en": "illustrative estimate"}}, {"k": "−40%", "t": {"es": "Resumen de informe", "en": "Report summary"}, "d": {"es": "estimación ilustrativa", "en": "illustrative estimate"}}, {"k": "100%", "t": {"es": "Revisión humana", "en": "Human review"}, "d": {"es": "siempre necesaria", "en": "always required"}}]}}, {"n": "2.2", "t": {"es": "Procesos jurídicos", "en": "Legal processes"}, "av": "andres", "body": {"es": "<p>En lo jurídico, la IA es un <b>asistente de lectura y organización<\/b>, no un abogado:<\/p><p><b>Análisis preliminar de contratos<\/b>: extraer partes, objeto, valor, plazo, obligaciones, garantías y cláusulas de riesgo en una matriz.<\/p><p><b>Comparación de versiones<\/b> de un documento para identificar cambios.<\/p><p><b>Apoyo en búsqueda normativa<\/b>: orientar sobre qué normas revisar. <b>Toda norma debe verificarse<\/b> en fuentes oficiales (Secretaría del Senado, Gestor Normativo de Función Pública, SUIN-Juriscol), porque los modelos pueden citar artículos inexistentes o derogados.<\/p><p><b>Límites<\/b>: la IA no emite conceptos jurídicos, no reemplaza al abogado ni asume responsabilidad. Los documentos contractuales con datos reservados no deben cargarse en herramientas no autorizadas.<\/p>", "en": "<p>In legal work, AI is a <b>reading and organising assistant<\/b>, not a lawyer:<\/p><p><b>Preliminary contract analysis<\/b>: extract parties, purpose, value, term, obligations, guarantees and risk clauses into a matrix.<\/p><p><b>Comparing versions<\/b> of a document to spot changes.<\/p><p><b>Support in legal research<\/b>: pointing to which rules to review. <b>Every rule must be verified<\/b> in official sources (Senate, Función Pública, SUIN-Juriscol), because models may cite non-existent or repealed articles.<\/p><p><b>Limits<\/b>: AI does not issue legal opinions, does not replace the lawyer and is not accountable. Contract documents with confidential data must not be uploaded to unauthorised tools.<\/p>"}, "ex": {"es": "Para supervisar un contrato de prestación de servicios, la IA genera la matriz de obligaciones y fechas de informes; el supervisor la contrasta con el contrato firmado.", "en": "To supervise a service contract, AI generates the matrix of obligations and report dates; the supervisor checks it against the signed contract."}, "tip": {"es": "Pida a la IA que cite la cláusula exacta de donde extrae cada obligación: así la verificación es inmediata.", "en": "Ask the AI to quote the exact clause each obligation comes from: verification becomes immediate."}, "g": {"type": "compare", "title": {"es": "lo que sí y lo que no", "en": "dos and don'ts"}, "cols": [{"t": {"es": "La IA SÍ puede", "en": "AI CAN"}, "items": [{"es": "Extraer obligaciones y plazos", "en": "Extract obligations and deadlines"}, {"es": "Resumir y comparar versiones", "en": "Summarise and compare versions"}, {"es": "Sugerir normas para revisar", "en": "Suggest rules to review"}]}, {"t": {"es": "La IA NO debe", "en": "AI MUST NOT"}, "items": [{"es": "Emitir conceptos jurídicos", "en": "Issue legal opinions"}, {"es": "Citar normas sin verificación", "en": "Cite unverified rules"}, {"es": "Recibir datos reservados", "en": "Receive confidential data"}]}]}, "g2": {"type": "grid", "title": {"es": "matriz contractual", "en": "contract matrix"}, "items": [{"k": "1", "t": {"es": "Partes y objeto", "en": "Parties & purpose"}, "d": ""}, {"k": "2", "t": {"es": "Valor y plazo", "en": "Value & term"}, "d": ""}, {"k": "3", "t": {"es": "Obligaciones", "en": "Obligations"}, "d": ""}, {"k": "4", "t": {"es": "Garantías", "en": "Guarantees"}, "d": ""}, {"k": "5", "t": {"es": "Riesgos", "en": "Risks"}, "d": ""}]}}, {"n": "2.3", "t": {"es": "Procesos laborales y de talento humano", "en": "Labour and HR processes"}, "av": "laura", "body": {"es": "<p>En talento humano, la IA ayuda a estructurar información, pero las decisiones sobre personas exigen especial cuidado:<\/p><p><b>Perfiles y manuales de funciones<\/b>: proponer propósito, funciones, competencias y requisitos a partir de insumos del área, ajustándolos al manual vigente de la entidad.<\/p><p><b>Planes de bienestar y capacitación<\/b>: organizar necesidades identificadas en un plan con objetivos, actividades e indicadores.<\/p><p><b>Análisis de encuestas de clima laboral<\/b>: agrupar comentarios abiertos por temas y detectar tendencias, con datos anonimizados.<\/p><p><b>Sesgos y equidad<\/b>: revise lenguaje excluyente o requisitos que discriminen por edad, género u origen. La IA nunca debe tomar decisiones de selección, evaluación o retiro.<\/p>", "en": "<p>In HR, AI helps structure information, but decisions about people require special care:<\/p><p><b>Job profiles and role manuals<\/b>: propose purpose, duties, competencies and requirements from the unit's inputs, adjusting them to the entity's current manual.<\/p><p><b>Well-being and training plans<\/b>: organise identified needs into a plan with goals, activities and indicators.<\/p><p><b>Analysing work-climate surveys<\/b>: group open comments by theme and spot trends, with anonymised data.<\/p><p><b>Bias and fairness<\/b>: check for exclusionary language or requirements that discriminate by age, gender or origin. AI must never make hiring, evaluation or dismissal decisions.<\/p>"}, "ex": {"es": "A partir de 300 comentarios anonimizados de la encuesta de clima, la IA identifica cinco temas recurrentes; el equipo de bienestar valida los temas leyendo una muestra de comentarios.", "en": "From 300 anonymised climate-survey comments, AI identifies five recurring themes; the well-being team validates them by reading a sample of comments."}, "tip": {"es": "Pídale a la IA: «revisa este perfil y señala requisitos o expresiones que puedan ser discriminatorios».", "en": "Ask the AI: “review this profile and flag requirements or wording that could be discriminatory”."}, "g": {"type": "grid", "title": {"es": "usos en talento humano", "en": "HR uses"}, "items": [{"k": "✓", "t": {"es": "Perfiles de cargo", "en": "Job profiles"}, "d": {"es": "Borrador para ajustar", "en": "Draft to adjust"}}, {"k": "✓", "t": {"es": "Plan de capacitación", "en": "Training plan"}, "d": {"es": "Estructura e indicadores", "en": "Structure and indicators"}}, {"k": "✓", "t": {"es": "Clima laboral", "en": "Work climate"}, "d": {"es": "Temas en comentarios", "en": "Themes in comments"}}, {"k": "✗", "t": {"es": "Decidir sobre personas", "en": "Deciding about people"}, "d": {"es": "Nunca delegar en la IA", "en": "Never delegate to AI"}}]}}, {"n": "2.4", "t": {"es": "Gestión documental", "en": "Records management"}, "av": "andres", "body": {"es": "<p>La gestión documental se apoya en la <b>Ley 594 de 2000<\/b> (Ley General de Archivos) y en instrumentos como las <b>Tablas de Retención Documental (TRD)<\/b>. La IA puede ayudar a:<\/p><p><b>Clasificar<\/b> documentos en series y subseries según la TRD, a partir de su asunto y contenido.<\/p><p><b>Extraer metadatos<\/b>: fecha, remitente, destinatario, asunto, número de radicado, dependencia y nivel de acceso.<\/p><p><b>Reconocimiento óptico de caracteres (OCR)<\/b>: convertir documentos escaneados en texto buscable.<\/p><p><b>Búsqueda semántica<\/b>: encontrar documentos por su significado y no solo por palabras exactas.<\/p><p><b>Expediente electrónico<\/b>: organizar documentos con su índice y metadatos. La clasificación final la valida el responsable de archivo.<\/p>", "en": "<p>Records management relies on <b>Law 594 of 2000<\/b> (General Archives Law) and instruments such as <b>records retention schedules (TRD)<\/b>. AI can help to:<\/p><p><b>Classify<\/b> documents into series and subseries according to the TRD, based on subject and content.<\/p><p><b>Extract metadata<\/b>: date, sender, recipient, subject, filing number, unit and access level.<\/p><p><b>Optical character recognition (OCR)<\/b>: turn scanned documents into searchable text.<\/p><p><b>Semantic search<\/b>: find documents by meaning, not just exact words.<\/p><p><b>Electronic file<\/b>: organise documents with their index and metadata. The records officer validates the final classification.<\/p>"}, "ex": {"es": "Un lote de 40 documentos escaneados pasa por OCR; la IA propone serie, subserie y metadatos de cada uno, y el auxiliar de archivo aprueba o corrige antes de cargarlos.", "en": "A batch of 40 scanned documents goes through OCR; AI proposes series, subseries and metadata for each, and the records assistant approves or corrects before uploading."}, "tip": {"es": "Pruebe el simulador «Clasificador TRD» con asuntos reales de su dependencia (sin datos personales).", "en": "Try the “Records classifier” simulator with real subjects from your unit (no personal data)."}, "g": {"type": "flow", "title": {"es": "flujo documental asistido", "en": "assisted records flow"}, "items": [{"t": {"es": "Captura", "en": "Capture"}, "d": {"es": "Escaneo + OCR", "en": "Scan + OCR"}}, {"t": {"es": "Clasificación", "en": "Classification"}, "d": {"es": "Serie según TRD", "en": "Series per TRD"}}, {"t": {"es": "Metadatos", "en": "Metadata"}, "d": {"es": "Extracción automática", "en": "Automatic extraction"}}, {"t": {"es": "Validación", "en": "Validation"}, "d": {"es": "Responsable de archivo", "en": "Records officer"}}, {"t": {"es": "Expediente", "en": "File"}, "d": {"es": "Índice electrónico", "en": "Electronic index"}}]}}, {"n": "2.5", "t": {"es": "Seguridad, verificación y trazabilidad", "en": "Security, verification and traceability"}, "av": "andres", "body": {"es": "<p>Cuatro prácticas obligatorias al usar IA en procesos institucionales:<\/p><p><b>1. Proteger los datos:<\/b> no cargue datos personales, sensibles o reservados en herramientas no autorizadas. Anonimice: reemplace nombres, documentos, correos, teléfonos y direcciones por etiquetas.<\/p><p><b>2. Humano en el circuito:<\/b> toda salida de la IA es un borrador. Una persona revisa contenido, cifras, normas y tono, y responde por el resultado.<\/p><p><b>3. Verificar:<\/b> contraste con la fuente original y con normas oficiales; desconfíe de cifras muy precisas sin referencia.<\/p><p><b>4. Trazabilidad:<\/b> registre qué herramienta usó, para qué tarea, qué ajustes hizo y quién aprobó. Así podrá explicar el resultado si se lo piden.<\/p>", "en": "<p>Four mandatory practices when using AI in institutional processes:<\/p><p><b>1. Protect data:<\/b> do not upload personal, sensitive or confidential data to unauthorised tools. Anonymise: replace names, IDs, emails, phones and addresses with tags.<\/p><p><b>2. Human in the loop:<\/b> every AI output is a draft. A person reviews content, figures, rules and tone, and is accountable for the result.<\/p><p><b>3. Verify:<\/b> check against the original source and official rules; distrust very precise figures without references.<\/p><p><b>4. Traceability:<\/b> record which tool you used, for what task, what you adjusted and who approved. Then you can explain the result if asked.<\/p>"}, "ex": {"es": "La ficha de verificación del taller registra: herramienta, prompt usado, fuente consultada, ajustes y riesgos detectados.", "en": "The workshop verification sheet records: tool, prompt used, source checked, adjustments and risks detected."}, "tip": {"es": "Si el resultado va a salir de la entidad (a un ciudadano, juez u otra entidad), la revisión debe ser aún más rigurosa.", "en": "If the output will leave the entity (to a citizen, judge or another entity), the review must be even more rigorous."}, "g": {"type": "cycle", "title": {"es": "humano en el circuito", "en": "human in the loop"}, "center": {"es": "Usted", "en": "You"}, "center2": {"es": "decide", "en": "decide"}, "items": [{"t": {"es": "Anonimizar", "en": "Anonymise"}, "d": {"es": "datos", "en": "data"}}, {"t": {"es": "Generar", "en": "Generate"}, "d": {"es": "borrador", "en": "draft"}}, {"t": {"es": "Verificar", "en": "Verify"}, "d": {"es": "fuentes", "en": "sources"}}, {"t": {"es": "Ajustar", "en": "Adjust"}, "d": {"es": "contenido", "en": "content"}}, {"t": {"es": "Registrar", "en": "Record"}, "d": {"es": "trazabilidad", "en": "traceability"}}]}}], "sims": [{"k": "anon", "t": {"es": "Anonimizador de textos", "en": "Text anonymiser"}, "d": {"es": "Detecta y reemplaza documentos de identidad, correos, teléfonos, direcciones y nombres antes de usar un texto con IA.", "en": "Detects and replaces IDs, emails, phones, addresses and names before using a text with AI."}, "tip": {"es": "Revise el resultado: los nombres sin un título previo (señor, aprendiz…) pueden escaparse.", "en": "Review the result: names without a preceding title (Mr, trainee…) may slip through."}}, {"k": "trd", "t": {"es": "Clasificador TRD", "en": "Records classifier"}, "d": {"es": "Propone serie documental, tiempos de retención y metadatos a partir del asunto de un documento.", "en": "Proposes the records series, retention periods and metadata from a document's subject."}, "tip": {"es": "Si no hay coincidencias claras, la clasificación debe hacerla una persona.", "en": "If there is no clear match, a person must classify it."}}, {"k": "clear", "t": {"es": "Verificador de lenguaje claro", "en": "Plain-language checker"}, "d": {"es": "Analiza la longitud de las oraciones y detecta expresiones rebuscadas en respuestas y oficios.", "en": "Analyses sentence length and detects convoluted expressions in replies and letters."}, "tip": {"es": "Apunte a oraciones de menos de 20 palabras y a un índice superior a 75.", "en": "Aim for sentences under 20 words and an index above 75."}}, {"k": "risk", "t": {"es": "Semáforo de riesgo de uso de IA", "en": "AI use risk light"}, "d": {"es": "Marque las condiciones de su caso y obtenga el nivel de riesgo y los controles requeridos.", "en": "Tick the conditions of your case and get the risk level and required controls."}, "tip": {"es": "Use este semáforo antes de cada caso del taller.", "en": "Use this light before each workshop case."}}], "anonSample": {"es": "Señora Marta Lucía Rodríguez Pérez, identificada con C.C. 52.345.678, residente en la Calle 45 # 12 - 30 de Bogotá, celular 310 456 7890 y correo marta.rodriguez@correo.com, solicita copia del certificado del aprendiz Juan Camilo Gómez, documento 1023456789.", "en": "Ms Marta Lucía Rodríguez Pérez, ID C.C. 52.345.678, living at Calle 45 # 12 - 30 in Bogotá, mobile 310 456 7890 and email marta.rodriguez@correo.com, requests a copy of the certificate of trainee Juan Camilo Gómez, ID 1023456789."}, "trd": {"samples": [{"es": "Contrato de prestación de servicios profesionales No. 245 de 2026", "en": "Professional services contract No. 245 of 2026"}, {"es": "Acta de reunión del comité de seguimiento académico", "en": "Minutes of the academic follow-up committee meeting"}, {"es": "Derecho de petición de un ciudadano solicitando información", "en": "Citizen petition requesting information"}, {"es": "Historia laboral: evaluación de desempeño del funcionario", "en": "Employee record: staff performance evaluation"}, {"es": "Informe de gestión trimestral del centro de formación", "en": "Quarterly management report of the training centre"}], "series": [{"c": "100.2.10", "n": {"es": "CONTRATOS – Prestación de servicios", "en": "CONTRACTS – Services"}, "ag": "2", "ac": "18", "disp": {"es": "Selección", "en": "Selection"}, "kw": ["contrato", "prestacion de servicios", "contratista", "supervision", "otrosi", "contract", "services"]}, {"c": "100.1.05", "n": {"es": "ACTAS – Comités", "en": "MINUTES – Committees"}, "ag": "2", "ac": "8", "disp": {"es": "Conservación total", "en": "Permanent retention"}, "kw": ["acta", "comite", "reunion", "minutes", "committee", "meeting"]}, {"c": "100.3.20", "n": {"es": "DERECHOS DE PETICIÓN / PQRS", "en": "PETITIONS / REQUESTS"}, "ag": "2", "ac": "3", "disp": {"es": "Eliminación", "en": "Destruction"}, "kw": ["peticion", "pqrs", "queja", "reclamo", "sugerencia", "solicitud", "petition", "complaint", "request"]}, {"c": "100.4.15", "n": {"es": "HISTORIAS LABORALES", "en": "EMPLOYEE RECORDS"}, "ag": "3", "ac": "77", "disp": {"es": "Conservación total", "en": "Permanent retention"}, "kw": ["historia laboral", "hoja de vida", "evaluacion de desempeno", "nomina", "vinculacion", "employee", "performance", "payroll"]}, {"c": "100.1.12", "n": {"es": "INFORMES – Gestión", "en": "REPORTS – Management"}, "ag": "2", "ac": "8", "disp": {"es": "Selección", "en": "Selection"}, "kw": ["informe", "gestion", "trimestral", "indicadores", "report", "management", "quarterly"]}, {"c": "100.2.30", "n": {"es": "RESOLUCIONES", "en": "RESOLUTIONS"}, "ag": "2", "ac": "18", "disp": {"es": "Conservación total", "en": "Permanent retention"}, "kw": ["resolucion", "resuelve", "acto administrativo", "resolution"]}]}, "clearSample": {"es": "Por medio de la presente y en aras de dar respuesta a su solicitud, me permito informarle que toda vez que la documentación allegada no cumple con la totalidad de los requisitos establecidos en la normatividad vigente, se hace necesario que sírvase allegar nuevamente los soportes so pena de que su solicitud sea archivada.", "en": "By means of the present and with a view to responding to your request, I hereby inform you that inasmuch as the documentation submitted does not comply with the totality of the requirements set forth in the regulations in force, it is necessary that you kindly resubmit the supporting documents, under penalty of your request being archived."}, "jargon": [{"f": "por medio de la presente", "r": {"es": "(eliminar)", "en": "(delete)"}}, {"f": "en aras de", "r": {"es": "para", "en": "to"}}, {"f": "me permito informarle", "r": {"es": "le informamos", "en": "we inform you"}}, {"f": "toda vez que", "r": {"es": "porque", "en": "because"}}, {"f": "allegar", "r": {"es": "enviar / entregar", "en": "send / submit"}}, {"f": "allegada", "r": {"es": "enviada", "en": "sent"}}, {"f": "sírvase", "r": {"es": "por favor", "en": "please"}}, {"f": "so pena de", "r": {"es": "de lo contrario", "en": "otherwise"}}, {"f": "normatividad vigente" /* ---------- infographics ---------- */
function infographic(g){
  if(!g) return '';
  let h='';
  if(g.type==='flow') h = `<div class="flow">${g.items.map((s,i)=>`<div class="st"><b>${i+1}</b><span>${T(s.t)}</span><small>${T(s.d)}</small></div>`).join('')}</div>`;
  if(g.type==='grid') h = `<div class="igrid">${g.items.map(s=>`<div><b>${T(s.k)}</b><span>${T(s.t)}</span><small>${T(s.d)}</small></div>`).join('')}</div>`;
  if(g.type==='compare') h = `<div class="cmp">${g.cols.map(c=>`<div><b>${T(c.t)}</b><ul>${c.items.map(x=>`<li>${T(x)}</li>`).join('')}</ul></div>`).join('')}</div>`;
  if(g.type==='nested'){
    const n=g.items.length, cols=['#00304D','#007832','#39A900','#9BDB78','#C9EEB4'];
    let s=`<svg class="inf" viewBox="0 0 420 290" role="img">`;
    g.items.forEach((it,i)=>{ s+=`<ellipse cx="210" cy="${150+i*18}" rx="${205-i*42}" ry="${138-i*30}" fill="${cols[i%5]}"/>`; });
    g.items.forEach((it,i)=>{ const y = i==n-1 ? 150+i*18-2 : 150+i*18-(138-i*30)+21; const c = i>=3?'#00304D':'#fff';
      s+=`<text x="210" y="${y}" text-anchor="middle" fill="${c}" font-size="${i==n-1?15:13.5}" font-weight="700">${T(it.t)}</text><text x="210" y="${y+14}" text-anchor="middle" fill="${c}" font-size="10.5">${T(it.d)}</text>`; });
    h = s+'</svg>';
  }
  if(g.type==='cycle'){
    const n=g.items.length, R=105, cx=210, cy=150; let s=`<svg class="inf" viewBox="0 0 420 300" role="img"><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#39A900" stroke-width="3" stroke-dasharray="6 6"/>`;
    s+=`<circle cx="${cx}" cy="${cy}" r="52" fill="#00304D"/><text x="${cx}" y="${cy-2}" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">${T(g.center)}</text><text x="${cx}" y="${cy+15}" text-anchor="middle" fill="#7FD45A" font-size="11">${T(g.center2||'')}</text>`;
    g.items.forEach((it,i)=>{const a=-Math.PI/2+i*2*Math.PI/n, x=cx+R*Math.cos(a), y=cy+R*Math.sin(a);
      s+=`<circle cx="${x}" cy="${y}" r="34" fill="${i%2?'#007832':'#39A900'}"/><text x="${x}" y="${y-2}" text-anchor="middle" fill="#fff" font-size="11.5" font-weight="700">${T(it.t)}</text><text x="${x}" y="${y+12}" text-anchor="middle" fill="#fff" font-size="10">${T(it.d)}</text>`});
    h=s+'</svg>';
  }
  return `<div class="info"><div class="cap">${u('infog')} · ${T(g.title)}</div>${h}</div>`;
}

SIM.classifier = box => {
  const C = D.classifier; let train = C.train.slice();
  const cats = C.cats;
  const tok = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9ñ\s]/g,' ').split(/\s+/).filter(w=>w.length>2 && !C.stop.includes(w));
  const model = () => { const m={cnt:{},w:{},tot:{},voc:new Set()}; cats.forEach(c=>{m.cnt[c.k]=0;m.w[c.k]={};m.tot[c.k]=0});
    train.forEach(([t,c])=>{m.cnt[c]++; tok(t).forEach(w=>{m.w[c][w]=(m.w[c][w]||0)+1;m.tot[c]++;m.voc.add(w)})}); return m; };
  const predict = (m,txt) => { const ws=tok(txt), V=m.voc.size, N=train.length; const lp={};
    cats.forEach(c=>{let s=Math.log((m.cnt[c.k]+1)/(N+cats.length)); ws.forEach(w=>s+=Math.log(((m.w[c.k][w]||0)+1)/(m.tot[c.k]+V))); lp[c.k]=s});
    const mx=Math.max(...Object.values(lp)); let z=0; cats.forEach(c=>{lp[c.k]=Math.exp(lp[c.k]-mx); z+=lp[c.k]}); cats.forEach(c=>lp[c.k]/=z); return {p:lp, known:ws.filter(w=>m.voc.has(w))}; };
  box.innerHTML = `<div class="grid g2"><div><label class="f">${L=='es'?'Escriba o elija una PQRS':'Type or pick a request (PQRS)'}</label><textarea id="c_in"></textarea>
   <div class="row mt">${C.samples.map((s,i)=>`<button class="btn ghost" data-cs="${i}">${L=='es'?'Muestra':'Sample'} ${i+1}</button>`).join('')}</div>
   <div class="row mt"><button class="btn" id="c_go">${I('cpu')} ${L=='es'?'Clasificar':'Classify'}</button></div>
   <h4>${L=='es'?'Enseñe al modelo (aprendizaje supervisado)':'Teach the model (supervised learning)'}</h4>
   <div class="row"><select id="c_lab" style="width:auto">${cats.map(c=>`<option value="${c.k}">${T(c.n)}</option>`).join('')}</select><button class="btn alt" id="c_add">${L=='es'?'Agregar como ejemplo etiquetado':'Add as labelled example'}</button></div>
   <p class="small" id="c_n"></p></div>
   <div><label class="f">${L=='es'?'Predicción del modelo':'Model prediction'}</label><div class="out" id="c_out">—</div><div class="bars mt" id="c_bars"></div><p class="small" id="c_words"></p></div></div>`;
  const run = () => { const m=model(); const txt=document.getElementById('c_in').value; if(!txt.trim()) return; const r=predict(m,txt);
    const best=cats.reduce((a,c)=>r.p[c.k]>r.p[a.k]?c:a);
    document.getElementById('c_out').innerHTML = `<b style="font-size:20px">${T(best.n)}</b> · ${(r.p[best.k]*100).toFixed(0)}% ${L=='es'?'de confianza':'confidence'}<br><span class="small">${T(best.d)}</span>`;
    document.getElementById('c_bars').innerHTML = cats.map(c=>`<div class="b"><span>${T(c.n)}</span><div><i style="width:${r.p[c.k]*100}%;background:${c.k==best.k?'var(--sena)':'var(--muted)'}"></i></div><span>${(r.p[c.k]*100).toFixed(0)}%</span></div>`).join('');
    document.getElementById('c_words').innerHTML = (L=='es'?'Palabras que el modelo reconoció: ':'Words the model recognised: ') + (r.known.map(w=>`<mark>${w}</mark>`).join(' ')||'—') + (r.p[best.k]<.55?`<br><span class="warnc">${L=='es'?'Confianza baja: un humano debe revisar.':'Low confidence: a human should review.'}</span>`:''); };
  const cnt = () => document.getElementById('c_n').textContent = (L=='es'?'Ejemplos de entrenamiento: ':'Training examples: ')+train.length;
  box.querySelectorAll('[data-cs]').forEach(b=>b.onclick=()=>{document.getElementById('c_in').value=T(C.samples[+b.dataset.cs]); run();});
  document.getElementById('c_go').onclick=run;
  document.getElementById('c_add').onclick=()=>{const t=document.getElementById('c_in').value.trim(); if(!t) return; train.push([t,document.getElementById('c_lab').value]); cnt(); run();};
  cnt();
};

SIM.flowb = box => {

   <label class="f">${L=='es'?'2. Agregue acciones en orden':'2. Add actions in order'}</label><div class="row">${FB.actions.map((x,i)=>`<button class="btn ghost" data-fa="${i}">+ ${T(x.t)}</button>`).join('')}</div>

    const arrow='<div style="margin:2px 0 2px 14px;height:14px;border-left:2px dashed var(--sena)"></div>';
    document.getElementById('fb_d').innerHTML = node('⚡ '+tr,'#00304D','T') + steps.map((s,i)=>arrow+node(T(FB.actions[s].t),FB.actions[s].ai?'#7FD45A':'#39A900',i+1)).join('');

SIM.sqlsim = box => {
  const Q = D.sql; const cats=Q.cols.filter(c=>c.type==='cat'), nums=Q.cols.filter(c=>c.type==='num');
  const opt=(arr,id)=>`<select id="${id}">${arr.map(c=>`<option value="${c.k}">${T(c.t)}</option>`).join('')}</select>`;
  box.innerHTML = `<div class="grid g2"><div>
   <label class="f">${L=='es'?'Agrupar por':'Group by'}</label>${opt(cats,'q_g')}
   <label class="f">${L=='es'?'Medida':'Measure'}</label>${opt(nums,'q_m')}
   <label class="f">${L=='es'?'Función':'Function'}</label><select id="q_a"><option value="SUM">SUM · ${L=='es'?'suma':'sum'}</option><option value="AVG">AVG · ${L=='es'?'promedio':'average'}</option><option value="COUNT">COUNT · ${L=='es'?'conteo':'count'}</option><option value="MAX">MAX · ${L=='es'?'máximo':'maximum'}</option></select>
   <label class="f">${L=='es'?'Filtro (WHERE)':'Filter (WHERE)'}</label><div class="row">${opt([{k:'',t:{es:'(sin filtro)',en:'(no filter)'}},...cats],'q_fc')}<select id="q_fv"></select></div>
   <div class="tw mt"><table><thead><tr>${Q.cols.map(c=>`<th>${c.k}</th>`).join('')}</tr></thead><tbody>${Q.rows.slice(0,6).map(r=>`<tr>${Q.cols.map(c=>`<td>${r[c.k]}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small">${L=='es'?'Primeras 6 de':'First 6 of'} ${Q.rows.length} ${L=='es'?'filas de la tabla':'table rows'} <b>${Q.table}</b> (${L=='es'?'datos ficticios':'fictitious data'}).</p></div>
   <div><label class="f">SQL</label><div class="out" id="q_sql" style="font-family:Consolas,monospace;font-size:13px"></div><label class="f">R · dplyr</label><div class="out" id="q_r" style="font-family:Consolas,monospace;font-size:13px"></div>
   <label class="f">${L=='es'?'Resultado':'Result'}</label><div class="bars" id="q_res"></div></div></div>`;
  const fv=()=>{ const c=document.getElementById('q_fc').value; const s=document.getElementById('q_fv'); s.innerHTML = c? [...new Set(Q.rows.map(r=>r[c]))].map(v=>`<option>${v}</option>`).join('') : ''; s.style.display=c?'':'none'; };
  const go=()=>{ const g=document.getElementById('q_g').value, m=document.getElementById('q_m').value, a=document.getElementById('q_a').value, fc=document.getElementById('q_fc').value, fval=document.getElementById('q_fv').value;
    let rows=Q.rows.filter(r=>!fc||String(r[fc])===fval); const grp={};
    rows.forEach(r=>{(grp[r[g]]=grp[r[g]]||[]).push(+r[m]);});
    const res=Object.entries(grp).map(([k,v])=>[k, a==='SUM'?v.reduce((x,y)=>x+y,0):a==='AVG'?v.reduce((x,y)=>x+y,0)/v.length:a==='COUNT'?v.length:Math.max(...v)]).sort((x,y)=>y[1]-x[1]);
    const mx=Math.max(1,...res.map(r=>r[1]));
    const w = fc?`\nWHERE ${fc} = '${fval}'`:'';
    document.getElementById('q_sql').textContent=`SELECT ${g}, ${a}(${a==='COUNT'?'*':m}) AS resultado\nFROM ${Q.table}${w}\nGROUP BY ${g}\nORDER BY resultado DESC;`;
    const rf={SUM:'sum',AVG:'mean',COUNT:'n',MAX:'max'}[a];
    document.getElementById('q_r').textContent=`${Q.table} |>\n${fc?`  filter(${fc} == "${fval}") |>\n`:''}  group_by(${g}) |>\n  summarise(resultado = ${a==='COUNT'?'n()':rf+'('+m+')'}) |>\n  arrange(desc(resultado))`;
    document.getElementById('q_res').innerHTML = res.map(r=>`<div class="b"><span>${r[0]}</span><div><i style="width:${r[1]/mx*100}%"></i></div><span>${(+r[1]).toLocaleString(L=='es'?'es-CO':'en-US',{maximumFractionDigits:1})}</span></div>`).join('') || '—'; };
  ['q_g','q_m','q_a','q_fv'].forEach(id=>document.getElementById(id).onchange=go);
  document.getElementById('q_fc').onchange=()=>{fv();go();}; fv(); go();
};
SIM.radar = box => {

/* ---------- shell ---------- */
function render(){
  document.documentElement.lang = L;
  document.title = T(D.meta.title) + ' · ' + T(D.meta.code);
  document.getElementById('bCode').textContent = T(D.meta.code);
  document.getElementById('bTitle').textContent = T(D.meta.short);
  document.getElementById('tTitle').innerHTML = `${T(D.meta.title)}<small>${T(D.meta.event)}</small>`;
  document.getElementById('sfoot').innerHTML = `${T(D.meta.event)}<br>${T(D.meta.instructor)} · ${T(D.meta.center)}`;
  document.getElementById('nav').innerHTML = SECTIONS.map(([k,ic])=>`<button data-go="${k}" class="${k==current?'on':''} ${seen[k]?'seen':''}">${I(ic)} ${u(k)}<span class="dot"></span></button>`).join('');
  document.getElementById('content').innerHTML = `<section class="pane on">${R[current]()}</section>`;
  const dark = document.documentElement.getAttribute('data-theme')==='dark' || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  document.getElementById('themeBtn').innerHTML = dark? I('sun')+' '+u('light') : I('moon')+' '+u('dark');
  document.getElementById('langBtn').innerHTML = I('globe') + (L=='es'?' English':' Español');
  const n=SECTIONS.length, v=SECTIONS.filter(([k])=>seen[k]).length;
  document.getElementById('pbar').style.width = (v/n*100)+'%';
  document.getElementById('ptxt').textContent = `${Math.round(v/n*100)}% ${u('prog')}`;
  bind();
}
function bind(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{subTab=+b.dataset.sub;render();window.scrollTo(0,0)});
  document.querySelectorAll('[data-sim]').forEach(b=>b.onclick=()=>{simTab=+b.dataset.sim;render()});
  const sb=document.getElementById('simBox'); if(sb) SIM[D.sims[simTab].k](sb);
  document.querySelectorAll('[data-q]').forEach(o=>o.onclick=()=>{const qi=+o.dataset.q, oi=+o.dataset.o; if(quizState[qi]) return; quizState[qi]={c:oi,ok:oi==D.quiz[qi].a}; const y=window.scrollY; render(); window.scrollTo(0,y);});
  const qr=document.getElementById('qreset'); if(qr) qr.onclick=()=>{quizState={};render();};
  document.querySelectorAll('[data-step]').forEach(c=>c.onchange=()=>{stepsDone[c.dataset.step]=c.checked; save('ova_steps_'+D.meta.id,stepsDone); const y=window.scrollY; render(); window.scrollTo(0,y);});
  document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>{const el=document.getElementById('model'+b.dataset.model); el.classList.toggle('hide'); b.textContent=el.classList.contains('hide')?u('show'):u('hide');});
  document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{const ei=+b.dataset.check, e=D.exercises[ei]; let ok=0;
    e.items.forEach((it,ii)=>{const s=document.querySelector(`select[data-ex="${ei}"][data-it="${ii}"]`); const r=document.getElementById(`r${ei}_${ii}`); const good= s.value!=='' && +s.value===it.a; if(good) ok++;
      r.innerHTML = s.value===''?'':(good?`<span class="okc">✓</span>`:`<span class="badc">✗ ${T(e.opts[it.a])}</span>`); document.getElementById(`fb${ei}_${ii}`).classList.remove('hide');});
    document.getElementById('es'+ei).innerHTML=`<b>${ok}/${e.items.length}</b> ${L=='es'?'aciertos':'correct'}`;});
  const gs=document.getElementById('gsearch'); if(gs) gs.oninput=()=>document.getElementById('glist').innerHTML=glo(gs.value);
}
function go(k){ current=k; seen[k]=true; save('ova_seen_'+D.meta.id,seen); render(); window.scrollTo(0,0); }
document.getElementById('langBtn').onclick=()=>{ L = L=='es'?'en':'es'; try{localStorage.setItem('ova_lang',L)}catch(e){} render(); };
document.getElementById('themeBtn').onclick=()=>{ const r=document.documentElement; const dark = r.getAttribute('data-theme')==='dark' || (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  r.setAttribute('data-theme', dark?'light':'dark'); try{localStorage.setItem('ova_theme',dark?'light':'dark')}catch(e){} render(); };
try{ const th=localStorage.getItem('ova_theme'); if(th) document.documentElement.setAttribute('data-theme',th);}catch(e){}
seen.home=true;
function fromHash(){ const h=(location.hash||'').slice(1); if(!h) return false; const m=/^sub(\d+)$/.exec(h); const m2=/^sim(\d+)$/.exec(h);
  if(m){ subTab=Math.min(D.subtopics.length-1,+m[1]-1); current='sub'; }
  else if(m2){ simTab=Math.min(D.sims.length-1,+m2[1]-1); current='sim'; }
  else if(SECTIONS.some(([k])=>k===h)) current=h; else return false;
  seen[current]=true; return true; }
fromHash(); render();
window.addEventListener('hashchange',()=>{ if(fromHash()){ render(); window.scrollTo(0,0);} });
