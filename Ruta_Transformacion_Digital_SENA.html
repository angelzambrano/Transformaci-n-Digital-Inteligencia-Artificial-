<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruta Transformación Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --sena:#39A900; --sena2:#007832; --navy:#00304D; --sena-soft:#E8F5DF;
  --bg:#F4F7F5; --panel:#FFFFFF; --panel2:#F8FAF9; --ink:#14212B; --muted:#5B6B76; --line:#E1E8E4;
  --accent:#00304D; --chip:#EEF4F0; --shadow:0 1px 2px rgba(0,48,77,.06),0 6px 20px rgba(0,48,77,.06);
  --ok:#2E8B16; --bad:#C62828; --warn:#C77700; --link:#007832; --nv:#00304D;
}
:root:not([data-theme="light"]){color-scheme:light}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1620; --panel:#112230; --panel2:#0E1D29; --ink:#E7EEF2; --muted:#9DB0BC; --line:#1F3546;
    --accent:#7FD45A; --chip:#173042; --sena-soft:#16331F; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --ok:#6BCB45; --bad:#FF6B6B; --warn:#F2B44A; --link:#7FD45A; --nv:#1F6A99; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1620; --panel:#112230; --panel2:#0E1D29; --ink:#E7EEF2; --muted:#9DB0BC; --line:#1F3546;
  --accent:#7FD45A; --chip:#173042; --sena-soft:#16331F; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --ok:#6BCB45; --bad:#FF6B6B; --warn:#F2B44A; --link:#7FD45A; --nv:#1F6A99; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Work Sans",Calibri,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15.5px;line-height:1.55}
a{color:var(--link);font-weight:500}
svg{width:1.05em;height:1.05em;vertical-align:-.15em;flex:none}
svg.inf{width:100%;height:auto}
button{font-family:inherit}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--navy);color:#fff;position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;gap:12px;align-items:center;padding:4px 6px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand img{width:46px;height:46px;border-radius:10px;flex:none}
.brand b{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#A9E58A}
.brand span{font-size:13px;opacity:.85;line-height:1.3;display:block}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#D6E3EA;padding:9px 10px;border-radius:9px;font-size:14px;cursor:pointer}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:var(--sena);color:#fff;font-weight:600}
.nav button .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:transparent}
.nav button.seen .dot{background:#A9E58A}
.nav button.on .dot{background:#fff}
.nav svg{width:18px;height:18px;flex:none}
.side .foot{margin-top:auto;font-size:12px;opacity:.7;line-height:1.4;padding:8px 6px}
/* main */
.main{min-width:0}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 28px}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.prog{width:160px;flex:none}
.prog .bar{height:7px;background:var(--line);border-radius:9px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--sena);width:0;transition:width .4s}
.prog small{font-size:11.5px;color:var(--muted)}
.tog{display:flex;gap:6px;flex:none}
.tog button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.tog button:hover{border-color:var(--sena)}
.tog svg{width:16px;height:16px}
.content{padding:26px 28px 60px;max-width:1240px}
section.pane{display:none;animation:fade .35s ease}
section.pane.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2.sec{font-size:26px;margin:0 0 4px;letter-spacing:-.02em;font-weight:700}
p.lead{color:var(--muted);margin:0 0 22px;max-width:820px}
h3{font-size:18px;margin:0 0 8px;font-weight:700}
h4{font-size:15px;margin:14px 0 6px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mt{margin-top:16px}.mt2{margin-top:26px}
.hero{background:linear-gradient(120deg,var(--navy) 0%,#00476F 55%,var(--sena2) 100%);color:#fff;border-radius:20px;padding:28px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;overflow:hidden;position:relative}
.hero h2{font-size:30px;margin:4px 0 8px;letter-spacing:-.02em;line-height:1.15}
.hero p{margin:0;opacity:.9;max-width:640px}
.hero .tag{display:inline-block;background:var(--sena);padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.hero svg.av{width:150px;height:150px}
.kpi{display:flex;gap:14px;align-items:center}
.kpi .ic{width:46px;height:46px;border-radius:12px;background:var(--sena-soft);color:var(--sena2);display:grid;place-items:center;flex:none}
:root[data-theme="dark"] .kpi .ic{color:#7FD45A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kpi .ic{color:#7FD45A}}
.kpi .ic svg{width:24px;height:24px}
.kpi b{font-size:24px;display:block;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--ink)}
.chip.g{background:var(--sena);color:#fff}
.chip.n{background:var(--navy);color:#fff}
.list{margin:0;padding-left:20px}.list li{margin:4px 0}
/* subtopic */
.sub{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.sub .num{font-size:12px;font-weight:700;color:var(--sena);letter-spacing:.08em;text-transform:uppercase}
.ex{border-left:4px solid var(--sena);background:var(--panel2);border-radius:0 12px 12px 0;padding:12px 14px;margin-top:12px;font-size:14.5px}
.ex b{color:var(--sena2)}
:root[data-theme="dark"] .ex b{color:#7FD45A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ex b{color:#7FD45A}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:7px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.tabs button.on{background:var(--nv);border-color:var(--nv);color:#fff}
/* infographics */
.info{background:var(--panel2);border:1px dashed var(--line);border-radius:14px;padding:14px}
.info .cap{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.flow .st{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;position:relative}
.flow .st b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sena);color:#fff;margin:0 auto 6px;font-size:14px}
.flow .st:nth-child(even) b{background:var(--navy)}
.flow .st span{font-size:13px;font-weight:600;display:block;line-height:1.3}
.flow .st small{font-size:12px;color:var(--muted);display:block;margin-top:3px;line-height:1.3}
.igrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.igrid div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.igrid b{font-size:22px;color:var(--sena);display:block;line-height:1}
.igrid span{font-weight:700;font-size:13.5px;display:block;margin-top:4px}
.igrid small{font-size:12px;color:var(--muted);line-height:1.3;display:block}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp>div{border-radius:12px;padding:12px;background:var(--panel);border:1px solid var(--line)}
.cmp>div:first-child{border-top:4px solid var(--navy)}.cmp>div:last-child{border-top:4px solid var(--sena)}
.cmp ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}
svg.inf{width:100%;height:auto;display:block}
svg.inf text{font-family:"Work Sans",sans-serif}
/* avatar tip */
.tip{display:flex;gap:12px;align-items:flex-start;margin-top:14px}
.tip svg{width:54px;height:54px;flex:none}
.tip .bub{background:var(--sena-soft);border-radius:4px 14px 14px 14px;padding:10px 13px;font-size:14px}
.tip .bub b{display:block;font-size:12px;color:var(--sena2);letter-spacing:.04em}
:root[data-theme="dark"] .tip .bub b{color:#7FD45A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tip .bub b{color:#7FD45A}}
/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--panel)}
th{background:var(--navy);color:#fff;text-align:left;padding:10px 12px;font-weight:600;font-size:13px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:var(--panel2)}
/* forms */
label.f{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input[type=text],textarea,select{width:100%;font-family:inherit;font-size:14.5px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;padding:9px 11px}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--sena);border-color:transparent}
.btn{border:0;background:var(--sena);color:#fff;font-weight:700;border-radius:10px;padding:9px 16px;cursor:pointer;font-size:14px;display:inline-flex;gap:7px;align-items:center}
.btn.alt{background:var(--nv)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.07)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.meter{height:12px;background:var(--line);border-radius:9px;overflow:hidden}
.meter i{display:block;height:100%;transition:width .35s,background .35s}
.out{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;white-space:pre-wrap;min-height:60px}
.okc{color:var(--ok);font-weight:700}.badc{color:var(--bad);font-weight:700}.warnc{color:var(--warn);font-weight:700}
.bars .b{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bars .b div{height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.bars .b i{display:block;height:100%;background:var(--sena)}
.opt{display:block;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:6px 0;cursor:pointer;background:var(--panel)}
.opt:hover{border-color:var(--sena)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--panel))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel))}
.fb{font-size:13.5px;margin-top:6px}
.vid{display:block;text-decoration:none;color:inherit;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);transition:transform .2s}
.vid:hover{transform:translateY(-3px)}
.vid .th{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,var(--navy),var(--sena2));display:grid;place-items:center;color:#fff}
.vid .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid .th .pl{position:relative;width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center}
.vid .th .pl svg{width:24px;height:24px;margin-left:3px}
.vid .th .lg{position:absolute;top:8px;left:8px;background:var(--sena);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
.vid .bd{padding:10px 12px}
.vid .bd b{font-size:14px;display:block;line-height:1.3}
.vid .bd small{color:var(--muted);font-size:12.5px}
.step{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .n{width:40px;height:40px;border-radius:12px;background:var(--nv);color:#fff;display:grid;place-items:center;font-weight:800}
.step.done .n{background:var(--sena)}
.step .tm{font-size:12px;font-weight:700;color:var(--sena2);text-transform:uppercase;letter-spacing:.05em}
:root[data-theme="dark"] .step .tm{color:#7FD45A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .step .tm{color:#7FD45A}}
.step ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.timeline{display:flex;height:16px;border-radius:9px;overflow:hidden;margin:10px 0 4px}
.timeline i{display:block;height:100%}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.gl div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.gl b{color:var(--sena2)}
:root[data-theme="dark"] .gl b{color:#7FD45A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gl b{color:#7FD45A}}
.gl p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.res{display:flex;gap:12px;align-items:flex-start}
.res .ic{width:38px;height:38px;border-radius:10px;background:var(--nv);color:#fff;display:grid;place-items:center;flex:none}
.res .ic svg{width:20px;height:20px}
code{background:var(--chip);padding:1px 6px;border-radius:6px;font-size:.88em;font-family:Consolas,monospace}
mark{background:#FFE58F;color:#000;border-radius:4px;padding:0 3px}
.score{font-size:40px;font-weight:800;color:var(--sena)}
.small{font-size:13px;color:var(--muted)}
.hide{display:none!important}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:column}
  .nav{flex-direction:row;overflow:auto;gap:4px;padding-bottom:4px}
  .nav button{white-space:nowrap;width:auto}
  .side .foot{display:none}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sub{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}.hero svg.av{display:none}
}
@media (max-width:620px){
  .content{padding:18px 16px 50px}.top{padding:10px 16px;flex-wrap:wrap}
  .prog{order:3;width:100%}
  .g2,.g3,.g4,.cmp{grid-template-columns:1fr}
  .hero h2{font-size:24px}
}

/* extras ruta */
.simple{display:flex;gap:12px;align-items:flex-start;background:var(--sena-soft);border-radius:14px;padding:14px 16px;margin:14px 0}
.simple .ic{width:36px;height:36px;border-radius:10px;background:var(--sena);color:#fff;display:grid;place-items:center;flex:none}
.simple>div>b:first-child{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--sena2)}
:root[data-theme="dark"] .simple>div>b:first-child{color:#7FD45A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .simple>div>b:first-child{color:#7FD45A}}
.prompt{position:relative;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--nv);border-radius:0 12px 12px 0;padding:12px 14px 12px;font-size:14px;margin:8px 0}
.prompt .cp{position:absolute;top:8px;right:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:600;cursor:pointer}
.prompt .cp:hover{border-color:var(--sena)}
.prompt p{margin:0;padding-right:70px}
.prompt small{display:block;font-weight:700;color:var(--muted);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.day{display:flex;gap:14px;align-items:center}
.day .d{width:54px;height:54px;border-radius:14px;background:var(--sena);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;line-height:1.05;text-align:center;flex:none}
.day:nth-child(even) .d{background:var(--navy)}
.pyr{display:grid;gap:6px;justify-items:center}
.pyr div{color:#fff;border-radius:10px;padding:9px 12px;text-align:center;font-size:13.5px}
.pyr div b{display:block;font-size:15px}
.pill{display:inline-block;background:var(--chip);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;margin:2px 4px 2px 0}
.next{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.agenda .it{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.agenda .it:first-child{border-top:0}
.agenda .it b.t{color:var(--sena2);font-size:13px}
:root[data-theme="dark"] .agenda .it b.t{color:#7FD45A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .agenda .it b.t{color:#7FD45A}}
.agenda .it.pause{opacity:.7}
code{overflow-wrap:anywhere}
input[type=number]{font-family:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;padding:5px 8px}
input[type=range]{accent-color:var(--sena)}
.info svg.inf{max-width:620px;margin:0 auto}
.big{font-size:20px;font-weight:700;line-height:1.35;margin:0}
</style>
</head>
<body>

   ['<b>Dato</b>','El número <code>35</code>. Solo, no dice nada.'],
   ['<b>Información</b>','“35 ventas en la tienda en línea de Bogotá en la última hora”.'],
   ['<b>Conocimiento</b>','“Cuando llueve en Bogotá y hay 10 % de descuento, las ventas suben 35 %”.'],
   ['<b>Inteligencia</b>','Un sistema que, al ver pronóstico de lluvia, lanza solo la campaña de descuento.']])}</div></div>
  ${S('Para recordar','La transformación digital busca subir esa escalera: no quedarnos acumulando datos, sino convertirlos en buenas decisiones.')}`],
 ['Big Data',`
  <h3>¿Qué es el Big Data?</h3>
  <p>Son cantidades de datos <b>tan grandes, tan variadas y que crecen tan rápido</b> que un Excel o una base de datos normal no alcanzan para manejarlas. Es la “materia prima” que, bien trabajada, se vuelve información y conocimiento.</p>
  <h4>Las 5 “V”</h4>
  ${IG([['V','Volumen','Muchísimos datos cada segundo.'],['V','Velocidad','Llegan y hay que procesarlos al instante.'],['V','Variedad','Números, textos, fotos, videos, audios.'],['V','Veracidad','¿Son datos confiables y completos?'],['V','Valor','¿Nos sirven para algo útil?']])}
  <h4 class="mt2">Dónde lo vemos</h4>
  ${UL(['<b>Mantenimiento:</b> sensores en máquinas avisan antes de que una pieza falle.','<b>Recomendaciones:</b> Netflix o Spotify te sugieren qué ver o escuchar.','<b>Bancos:</b> detectan en segundos una compra extraña y bloquean la tarjeta.'])}`],
 ['Inteligencia artificial',`
  <h3>¿Qué es la IA?</h3>
  <p>Es lograr que un computador haga cosas que normalmente requieren inteligencia humana: <b>aprender</b>, <b>razonar</b> y <b>corregirse</b>.</p>
  ${CMP(['IA débil o estrecha (la que usamos hoy)',['Hace una sola tarea muy bien.','Ej.: reconocer voz, filtrar correo basura, un asistente virtual.','No tiene conciencia ni “piensa” por sí sola.']],['IA fuerte o general (todavía teórica)',['Sería tan inteligente como una persona en cualquier tema.','Podría aprender y resolver cualquier problema.','Hoy no existe.']])}
  <h4 class="mt2">Ejemplos cotidianos</h4>
  ${UL(['Asistentes de voz del celular.','Recomendaciones en redes sociales y plataformas de video.','El GPS que calcula la ruta según el tráfico.'])}
  ${C(`<h4 style="margin-top:0">${I('users')} Actividad 1 · 5 minutos</h4><p>En grupos de 3 o 4, piensen en procesos del SENA donde la IA podría ayudar: asignación de cupos en Sofía Plus o Zajuna, control de asistencia, verificación de certificados, revisión de tareas… Dos equipos comparten su idea.</p>`,'mt')}`],
 ['Machine Learning',`
  <h3>Máquinas que aprenden con ejemplos</h3>
  <p>El <b>Machine Learning</b> (aprendizaje automático) es una parte de la IA. En vez de programar cada regla, le mostramos muchos ejemplos al sistema y él aprende los patrones solo.</p>
  ${FLOW('¿Cómo funciona?',[['Recoger datos','ejemplos del pasado'],['Entrenar','busca patrones'],['Probar','¿qué tanto acierta?'],['Usar','predice casos nuevos']])}
  <h4 class="mt2">3 formas de aprender</h4>
  ${TB(['Tipo','Cómo aprende','Ejemplo'],[
   ['<b>Supervisado</b>','Con ejemplos que ya traen la respuesta correcta.','Facturas marcadas “bien” o “con error” para revisar nuevas.'],
   ['<b>No supervisado</b>','Busca grupos parecidos sin que nadie le diga la respuesta.','Agrupar aprendices con perfiles similares.'],
   ['<b>Por refuerzo</b>','Prueba y error: gana “puntos” cuando acierta.','Robot aspiradora que aprende a no chocar.']])}
  ${C(`<h4 style="margin-top:0">${I('flag')} Actividad 2 · Triatlón de Machine Learning (6 min)</h4><p>Clasifiquen cada caso: <b>A.</b> Robot aspiradora que gana puntos al limpiar sin chocar. <b>B.</b> El SENA agrupa 50.000 aprendices sin etiquetas en 4 perfiles. <b>C.</b> Sistema entrenado con 5.000 facturas marcadas “Aprobada” o “Con error”.</p><button class="btn ghost" data-toggle="r1">Ver respuesta</button><p id="r1" class="hide mt"><b>A = Refuerzo · B = No supervisado · C = Supervisado.</b></p>`,'mt')}
  <h4 class="mt2">Casos reales</h4>
  ${UL(['Chatbots que atienden 24/7.','Avisos antes de que una máquina se dañe.','Tiendas que sugieren productos a tu medida.','Rutas de entrega que ahorran tiempo y combustible.'])}`],
 ['IA generativa',`
  <h3>IA que crea contenido nuevo</h3>
  <p>La IA “tradicional” analiza y predice. La <b>IA generativa</b> va más allá: <b>crea</b> textos, imágenes, audio, video o código a partir de lo que le pedimos en lenguaje normal.</p>
  ${FLOW('¿Cómo opera?',[['Aprende','leyó enormes cantidades de texto e imágenes'],['Entiende','lee tu instrucción (prompt)'],['Genera','arma la respuesta palabra por palabra']])}
  ${S('En palabras simples','Es como un asistente que escribió y leyó muchísimo: le pides algo con tus palabras y te entrega un primer borrador. Pero puede equivocarse, así que siempre lo revisas tú.')}
  <h4>Herramientas conocidas</h4>
  ${G(2,[C('<b>ChatGPT</b> (OpenAI)<p class="small">Conversación, redacción, resúmenes.</p>'),C('<b>Copilot</b> (Microsoft)<p class="small">Integrado en Word, Excel, PowerPoint, Outlook y Teams.</p>'),C('<b>Gemini</b> (Google)<p class="small">Entiende texto, imágenes, audio y video.</p>'),C('<b>Claude</b> (Anthropic)<p class="small">Análisis y documentos extensos.</p>')])}
  <p class="mt"><a href="https://forms.gle/tpB3XmaJx96mYMUt8" target="_blank" rel="noopener">Cuestionario del primer día →</a></p>`]
 ],

dia2:{tag:'Día 2',title:'Automatizar para trabajar mejor',icon:'gear',
 lead:'Automatización, mejora de procesos, Copilot y cómo pedirle bien las cosas a la IA.',
 subs:[
 ['Ruta del día',`
  <h3>Cuatro pasos que se conectan</h3>
  ${FLOW('del problema a la mejora',[['Automatizar','¿qué tarea repetitiva haría un sistema?'],['Optimizar','¿dónde se pierde tiempo?'],['Copilot','¿cómo me ayuda la IA?'],['Prompts','¿cómo se lo pido bien?']])}
  <h4 class="mt2">Reto integrador del día</h4>
  <p>Elige un proceso manual sencillo de tu trabajo y:</p>
  ${OL(['Describe cómo se hace hoy, paso a paso.','Marca dónde hay esperas, errores o trabajo repetido.','Escoge el problema principal.','Propón cómo automatizarlo (con reglas o con IA).','Escribe un prompt para analizar o comunicar la mejora.','Revisa lo que responde la IA y anota qué debe validar una persona.','Define cómo medirás si funcionó.'])}
  ${S('Idea central','La tecnología acelera el trabajo, pero el valor aparece cuando primero entendemos el proceso y usamos la IA con criterio y responsabilidad.','target')}
  ${S('Cuida la información','Practica con datos ficticios. No pongas contraseñas, datos personales ni información confidencial en herramientas no autorizadas.','shield')}`],
 ['Automatización',`
  <h3>¿Qué es automatizar?</h3>
  ${S('En palabras simples','Automatizar es pedirle a un sistema que haga, de forma repetida y confiable, lo que antes hacía una persona a mano.')}
  ${TB(['Antes (a mano)','Ahora (automático)'],[
   ['El instructor llama lista en papel.','Un código QR registra la asistencia al instante.'],
   ['Alguien envía un correo de confirmación a cada comprador.','El sistema lo envía solo después de la compra.'],
   ['Se calculan horas y salarios en Excel.','El software calcula y paga la nómina.'],
   ['Un operario aprieta tornillos uno a uno.','Un brazo robótico ensambla las piezas.']])}
  <h4 class="mt2">Dos tipos de automatización</h4>
  ${CMP(['Con reglas fijas (tradicional)',['Sigue instrucciones exactas.','No aprende: si algo cambia, hay que reprogramarla.','Ej.: semáforo, macro de Excel.']],['Con inteligencia artificial',['Aprende de los datos y mejora.','Maneja situaciones nuevas.','Ej.: chatbot que entiende preguntas, detección de fraudes.']])}
  ${S('Nota','No compiten: se usan juntas. Reglas para lo estable, IA para lo que necesita criterio.')}
  <h4>Beneficios</h4>
  ${IG([['↑','Productividad','Más rápido, sin pausas.'],['↓','Errores','El sistema no se cansa.'],['$','Ahorro','Menos horas en tareas repetitivas.'],['∞','Escala','Atiende más sin colapsar.'],['☺','Servicio','Respuestas 24/7.'],['📊','Datos','Información para decidir.']])}
  ${EX('<b>Ejemplo SENA:</b> enviar automáticamente el certificado digital al terminar el programa. El aprendiz lo recibe en horas, no en semanas.')}
  ${C(`<h4 style="margin-top:0">${I('users')} Actividad</h4>Piensa en un proceso manual de tu área: ¿qué pasos tiene?, ¿se automatizaría con reglas o con IA?, ¿qué ganaríamos?`,'mt')}`],
 ['Mejorar un proceso',`
  <h3>Encontrar el “cuello de botella”</h3>
  <p>Optimizar es revisar cómo se hace algo para lograr <b>mejor resultado con menos tiempo, esfuerzo o errores</b>.</p>
  ${S('¿Qué es un cuello de botella?','Es el paso donde todo se atasca, como el cuello de una botella por donde el agua sale despacio. Ejemplo: una sola persona debe aprobar todas las solicitudes.')}
  <h4>Señales de alerta</h4>
  ${UL(['Se acumulan tareas antes de un paso.','Muchos preguntan “¿cómo va mi solicitud?”.','Solo una persona puede continuar el proceso.','Se devuelven documentos una y otra vez.'])}
  ${FLOW('método en 6 pasos',[['Definir','inicio, fin y resultado'],['Dibujar','cómo se hace hoy de verdad'],['Medir','tiempos y errores'],['Ubicar','dónde se acumula'],['Preguntar ¿por qué?','hasta la causa raíz'],['Priorizar','impacto × frecuencia × facilidad']])}
  <h4 class="mt2">Ejemplo: solicitudes de soporte</h4>
  <p>Una oficina tarda 5 días en responder. Al medir 40 casos se ve que la solución técnica toma solo 30 minutos… el problema está <b>al inicio</b>: las solicitudes llegan incompletas y a la persona equivocada.</p>
  ${TB(['Indicador','Antes','Meta'],[['Tiempo hasta asignar','1,2 días','menos de 2 horas'],['Solicitudes incompletas','60 %','menos de 15 %'],['Reenvíos equivocados','35 %','menos de 10 %'],['Respuesta total','5 días','2 días']])}
  <p class="small">Mejora: formulario con campos obligatorios, reglas de asignación, respuesta automática con número de caso y la IA sugiriendo la categoría (con revisión humana).</p>
  <h4 class="mt2">Mejorar siempre: ciclo PHVA</h4>
  ${IG([['P','Planear','Problema, causa y meta.'],['H','Hacer','Probar en pequeño.'],['V','Verificar','Comparar con el antes.'],['A','Actuar','Si sirve, se adopta; si no, se ajusta.']])}
  ${S('Idea central','Optimizar no es trabajar más rápido a cualquier costo: es quitar obstáculos y mejorar de forma medible y responsable.','target')}`],
 ['Copilot',`
  <h3>Microsoft Copilot: tu asistente</h3>
  <p>Copilot es un asistente con IA al que le hablas con tus palabras. Te ayuda a <b>escribir, resumir, analizar y organizar</b> información. Te da un borrador; tú lo revisas y decides.</p>
  ${TB(['Dónde','Para qué sirve'],[['Copilot Chat','Preguntar, explicar, generar ideas.'],['Word','Borradores, resúmenes, cambiar el tono.'],['Excel','Fórmulas, tendencias y gráficos.'],['PowerPoint','Estructura y diapositivas.'],['Outlook','Resumir correos y redactar respuestas.'],['Teams','Resumir reuniones, acuerdos y tareas.']])}
  <p class="small">Las funciones dependen de la licencia y de la configuración de la entidad.</p>
  <h4 class="mt2">Fórmula para pedirle bien</h4>
  <p class="big">Rol + tarea + contexto + formato + criterios</p>
  ${P('Explica la automatización.','Pedido débil')}
  ${P('Actúa como formador del SENA. Explica qué es la automatización de procesos para personas principiantes, incluye dos ejemplos de empresas, usa lenguaje claro y termina con tres preguntas de repaso.','Pedido mejorado')}
  <h4 class="mt2">Lo que NO debes asumir</h4>
  ${UL(['No es infalible: puede equivocarse o inventar datos.','Que suene bien no significa que sea verdad.','No reemplaza tu conocimiento ni tu revisión.','No le entregues información que la entidad prohíbe compartir.'])}
  <h4 class="mt2">Practica en cada aplicación</h4>
  ${TB(['App','Ejercicio'],[['Word','Crear una guía de una página para identificar un proceso automatizable.'],['Excel','Analizar 6 meses de solicitudes ficticias y calcular % de atención.'],['PowerPoint','Presentación de 7 diapositivas: beneficios y límites de automatizar.'],['Outlook','Resumir un hilo de correos y redactar una respuesta de 150 palabras.'],['Teams','Convertir una reunión en tabla de tareas y responsables.']])}
  ${P('Resume esta conversación en cinco puntos. Separa decisiones, tareas pendientes, responsables, fechas y preguntas sin resolver. Si falta un dato, escribe “por confirmar”.','Prompt para Outlook o Teams')}`],
 ['Ingeniería de prompts',`
  <h3>Cómo pedirle las cosas a la IA</h3>
  ${S('En palabras simples','Un buen prompt le dice a la IA <b>qué hacer, para quién, con qué información y cómo entregarlo</b>. Como cuando le explicas un encargo a un compañero nuevo.')}
  ${TB(['Elemento','Ejemplo'],[['Rol','Actúa como asistente administrativo.'],['Tarea','Resume el texto en tres ideas.'],['Contexto','Lo leerán personas que empiezan.'],['Información','Usa solo las notas que te pego.'],['Límites','Máximo 200 palabras. No inventes datos.'],['Formato','Entrégalo en una tabla.'],['Calidad','Claro y ordenado; señala dudas.']])}
  ${P('Actúa como [rol]. Necesito que [tarea]. El contexto es [situación y público]. Usa [información] y no inventes datos. Entrégalo en [formato], con [extensión]. Asegúrate de que sea [criterios] y señala lo que falte.','Plantilla para reutilizar')}
  <h4 class="mt2">Errores frecuentes</h4>
  ${TB(['Error','Qué pasa','Cómo corregirlo'],[['Pedido muy amplio','Respuesta genérica','Di el objetivo y el público.'],['Sin contexto','La IA supone mal','Explica la situación.'],['Muchas tareas juntas','Se olvida partes','Divide por pasos.'],['Sin formato','Difícil de usar','Pide tabla, lista o correo.'],['Aceptar sin revisar','Errores o datos inventados','Verifica antes de usar.'],['Datos sensibles','Se expone información','Anonimiza.']])}
  ${C(`<h4 style="margin-top:0">${I('quiz')} ¿Cuál prompt es mejor para resumir?</h4><p>A. Resume esto.<br>B. Haz un resumen muy bueno y completo.<br>C. Resume el texto en cinco ideas para principiantes, sin agregar información externa, y termina con tres palabras clave.</p><button class="btn ghost" data-toggle="r2">Ver respuesta</button><p id="r2" class="hide mt"><b>La C:</b> dice cuánto, para quién, qué no hacer y cómo cerrar.</p>`,'mt')}
  ${S('Para recordar','Una buena instrucción no reemplaza tu criterio: lo orienta, lo acelera y facilita la revisión.','check')}`]
 ],
 quiz:[
  ['La automatización con reglas fijas…',['Aprende sola con el tiempo','Sigue instrucciones exactas y no aprende','Siempre usa IA'],1,'Si la situación cambia, hay que reprogramarla.'],
  ['Un cuello de botella es…',['El paso donde el proceso se atasca','El último paso del proceso','Un error de la IA'],0,'Es la etapa que frena todo lo demás.'],
  ['Lo que entrega Copilot debe tratarse como…',['Una verdad definitiva','Un borrador para revisar','Un documento oficial'],1,'La decisión final sigue siendo humana.'],
  ['¿Qué le falta a “Haz un informe sobre automatización”?',['Nada, está perfecto','Público, propósito, extensión y formato','Más signos de puntuación'],1,'Sin contexto la respuesta queda genérica.']]
},
dia3:{tag:'Día 3',title:'Analizar datos para decidir mejor',icon:'chart',
 lead:'Los cuatro tipos de analítica, con un caso real de asistencia y herramientas que ya conoces.',
 subs:[
 ['¿Qué es analizar datos?',`
  <h3>Convertir datos en decisiones</h3>
  <p>La analítica de datos es <b>recoger, ordenar e interpretar</b> datos para tomar mejores decisiones. Un dato solo dice poco; comparado y con contexto se vuelve evidencia.</p>
  ${FLOW('cadena básica de trabajo',[['Preguntar','¿qué necesito saber?'],['Recoger','formularios, registros'],['Limpiar','quitar errores y duplicados'],['Analizar','calcular y comparar'],['Comunicar','tablas y gráficos'],['Actuar','decidir y evaluar']])}
  ${S('Idea clave','Analizar no es solo hacer gráficos: es convertir los datos en decisiones con sustento.')}
  <p><a href="https://view.genially.com/6abe8fc954aee44c028bc294" target="_blank" rel="noopener">Ver la presentación del día →</a></p>
  <h4 class="mt2">Al terminar podrás</h4>
  ${UL(['Diferenciar los 4 tipos de analítica.','Hacer buenas preguntas a un conjunto de datos.','Ordenar y resumir datos en una hoja de cálculo.','Crear indicadores y gráficos sencillos.','Usar la IA como apoyo, verificando siempre.'])}`],
 ['Los 4 tipos',`
  <h3>Cuatro preguntas, cuatro tipos de analítica</h3>
  ${G(2,[
   C(`<span class="chip g">Descriptiva</span><h3 class="mt">¿Qué pasó?</h3><p>Resume con totales, promedios y gráficos.</p>${EX('30 aprendices; promedio de asistencia 84 %; 4 por debajo del 60 %.')}<p class="small">Herramientas: SUMA, PROMEDIO, CONTAR.SI, filtros, tablas dinámicas.</p>`),
   C(`<span class="chip n">Diagnóstica</span><h3 class="mt">¿Por qué pasó?</h3><p>Compara grupos y fechas para encontrar causas posibles.</p>${EX('La asistencia bajó de 88 % a 76 %, sobre todo los viernes y en la jornada nocturna, después de un cambio de horario.')}<p class="small">Ojo: que dos cosas pasen juntas no prueba que una cause la otra.</p>`),
   C(`<span class="chip g">Predictiva</span><h3 class="mt">¿Qué podría pasar?</h3><p>Usa lo que pasó antes para estimar el futuro.</p>${EX('Con 6 meses de consumo, se estima que el próximo mes se usarán unas 420 unidades.')}<p class="small">Una predicción no es una certeza: explica siempre tus supuestos.</p>`),
   C(`<span class="chip n">Prescriptiva</span><h3 class="mt">¿Qué conviene hacer?</h3><p>Propone acciones según metas y recursos.</p>${EX('Con inventario limitado, priorizar los productos que más rotan.')}<p class="small">Una recomendación no reemplaza el criterio humano.</p>`)])}`],
 ['Caso: asistencia',`
  <h3>Caso práctico: ¿por qué faltan los aprendices?</h3>
  <p>Un Centro de Formación revisa la asistencia de 30 aprendices (mañana, tarde y noche) durante 4 semanas. <span class="pill">Datos ficticios</span></p>
  ${S('Pregunta central','¿Qué patrones de asistencia hay en el grupo y qué acciones podrían ayudar a prevenir la inasistencia?','target')}
  <div class="grid g2 mt">${C(`<h4 style="margin-top:0">1 · Descriptiva — ¿qué pasó?</h4><div class="bars">${[['Semana 1',90.7],['Semana 2',86.7],['Semana 3',82.0],['Semana 4',79.3]].map(x=>`<div class="b"><span>${x[0]}</span><div><i style="width:${x[1]}%"></i></div><b>${x[1].toFixed(1).replace('.',',')}%</b></div>`).join('')}</div><p class="small">¿Qué tendencia ves? La asistencia baja cada semana.</p>`)}
  ${C(`<h4 style="margin-top:0">2 · Diagnóstica — ¿por qué?</h4>${UL(['¿Baja igual en todas las jornadas?','¿Qué motivos se repiten más?','¿En qué semana cambia más?','¿Qué información falta para confirmar?'])}`)}
  ${C(`<h4 style="margin-top:0">3 · Predictiva — ¿qué podría pasar?</h4><p>Si todo sigue igual, ¿cómo estará la asistencia en las próximas semanas? Arma tres escenarios: favorable, esperado y desfavorable.</p>`)}
  ${C(`<h4 style="margin-top:0">4 · Prescriptiva — ¿qué hacer?</h4>${UL(['Seguimiento a quienes más faltan.','Revisar las causas que reportan.','Orientar hacia las rutas institucionales.','Medir si las acciones funcionan.'])}`)}</div>
  <h4 class="mt2">Reto para los equipos</h4>
  <p>Con el archivo <code>Caso_practico_analitica_asistencia_SENA.xlsx</code>: ordenen los datos, calculen indicadores, hagan el gráfico semanal, comparen jornadas, planteen una hipótesis, un escenario y una acción con su métrica.</p>
  ${TB(['En la conclusión, separen','Qué es'],[['Datos','Lo que muestran los registros.'],['Interpretación','Lo que se deduce de ellos.'],['Hipótesis','Posible explicación por confirmar.'],['Predicción','Lo que podría pasar si…'],['Recomendación','La acción que proponen.']])}
  ${S('Regla de oro','Anonimiza los datos, protege la información personal y valida los resultados antes de decidir.','shield')}`],
 ['IA y herramientas',`
  <h3>La IA gratuita como ayudante</h3>
  <p>Puedes usar ChatGPT o Gemini (versión gratuita) para entender conceptos, revisar fórmulas, sugerir gráficos o proponer preguntas.</p>
  ${P('Explica la diferencia entre analítica descriptiva y diagnóstica con un ejemplo de asistencia estudiantil. Usa lenguaje para principiantes.','Para entender un concepto')}
  ${P('Tengo columnas Estudiante, Semana 1, Semana 2, Semana 3 y Semana 4. Propón una fórmula para calcular el porcentaje de asistencia por estudiante. Indica qué cambia entre Excel y Google Sheets.','Para revisar una hoja de cálculo')}
  ${P('Estos son los resultados de asistencia: 95 %, 90 %, 75 %, 70 % y 50 %. Describe el patrón, sugiere dos preguntas diagnósticas y no afirmes causas que los datos no demuestran.','Para interpretar resultados')}
  <h4 class="mt2">Reglas de uso responsable</h4>
  ${UL(['No pongas nombres, documentos, teléfonos ni correos.','Revisa fórmulas y cálculos: la IA puede equivocarse.','No confundas “pasan juntos” con “una causa la otra”.','La decisión final es tuya.'])}
  <h4 class="mt2">Herramientas sugeridas</h4>
  ${TB(['Necesidad','Opciones'],[['Registrar y limpiar datos','Excel, Google Sheets, LibreOffice Calc'],['Resumir','Tablas dinámicas, filtros, funciones'],['Comunicar','PowerPoint, Google Slides, Canva'],['Redactar conclusiones','Word, Google Docs'],['Explorar ideas','IA generativa gratuita']])}
  ${C(`<h4 style="margin-top:0">${I('flag')} Actividad de cierre</h4>En equipos, elijan un tema (asistencia, ventas, inventario, satisfacción…) y presenten máximo 5 diapositivas con: pregunta, datos limpios, gráfico, hipótesis, predicción, recomendación y una limitación.`,'mt')}`]

function CLS(box,cfg){
 box.innerHTML=`<p>${cfg.intro}</p>${cfg.items.map((it,i)=>`<div class="row" style="justify-content:space-between;padding:9px 0;border-top:${i?'1px solid var(--line)':'0'}"><span style="flex:1;min-width:220px">${it[0]}</span><select data-c="${i}" style="width:auto;min-width:170px"><option value="">Elegir…</option>${cfg.opts.map((o,j)=>`<option value="${j}">${o}</option>`).join('')}</select></div><div class="fb hide" id="cf${i}"></div>`).join('')}<div class="row mt"><button class="btn" id="cOk">Revisar</button><button class="btn ghost" id="cRe">Reiniciar</button><span id="cSc" class="small"></span></div>`;
 box.querySelector('#cOk').onclick=()=>{let ok=0;cfg.items.forEach((it,i)=>{const v=box.querySelector(`[data-c="${i}"]`).value,f=box.querySelector('#cf'+i);f.classList.remove('hide');
  if(v==='')f.innerHTML='<span class="warnc">Sin responder.</span>';else if(+v===it[1]){ok++;f.innerHTML=`<span class="okc">✓ Correcto.</span> ${it[2]||''}`}else f.innerHTML=`<span class="badc">✗ Era: ${cfg.opts[it[1]]}.</span> ${it[2]||''}`});
  box.querySelector('#cSc').innerHTML=`<span class="score" style="font-size:26px">${ok}/${cfg.items.length}</span>`};
 box.querySelector('#cRe').onclick=()=>CLS(box,cfg);}

spam(box){const train=[['¡Ganaste un premio! Reclama ya tu dinero gratis','s'],['Recordatorio: comité académico el jueves a las 9','n'],['Oferta exclusiva: haz clic y gana un celular gratis','s'],['Adjunto el acta de la reunión de ayer','n'],['Tu cuenta será bloqueada, confirma tu clave aquí urgente','s'],['¿Puedes revisar el informe de asistencia?','n']];

 let lab={},phase=0;const words=t=>t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').match(/[a-zñ]{4,}/g)||[];
 const draw=()=>{if(phase==0){box.innerHTML=`<p><b>Paso 1 · Entrena.</b> Eres quien enseña: marca cada mensaje. El modelo aprenderá de tus etiquetas (aprendizaje supervisado).</p>${train.map((m,i)=>`<div class="row" style="padding:7px 0;border-top:${i?'1px solid var(--line)':'0'}"><span style="flex:1;min-width:200px">${m[0]}</span><button class="btn ${lab[i]=='s'?'':'ghost'}" data-l="${i}:s">Spam</button><button class="btn ${lab[i]=='n'?'alt':'ghost'}" data-l="${i}:n">No spam</button></div>`).join('')}<button class="btn mt" id="sT" ${Object.keys(lab).length<6?'disabled style="opacity:.5"':''}>Entrenar modelo →</button>`;
   box.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const[i,v]=b.dataset.l.split(':');lab[i]=v;draw()});box.querySelector('#sT').onclick=()=>{phase=1;draw()};}
  else{const sp={},hm={};train.forEach((m,i)=>words(m[0]).forEach(w=>{(lab[i]=='s'?sp:hm)[w]=((lab[i]=='s'?sp:hm)[w]||0)+1}));
   let ok=0;const rows=test.map(m=>{const ws=words(m[0]);const s=ws.reduce((a,w)=>a+(sp[w]||0)-(hm[w]||0),0);const p=s>0?'s':'n';if(p==m[1])ok++;return [m[0],`<b>${p=='s'?'Spam':'No spam'}</b>`,ws.filter(w=>sp[w]).map(w=>`<mark>${w}</mark>`).join(' ')||'—',p==m[1]?'<span class="okc">✓</span>':'<span class="badc">✗</span>']});

   box.querySelector('#sR').onclick=()=>{lab={};phase=0;draw()};}};draw();},

 const draw=()=>{const p=probs();box.innerHTML=`<p>Una IA generativa no “sabe” la respuesta: calcula <b>qué palabra es más probable</b> que siga. La <b>temperatura</b> controla qué tanto se arriesga.</p>

  <p class="small">Cada “semilla” es un ruido inicial distinto: por eso el mismo prompt da imágenes diferentes cada vez.</p>`;
  box.querySelectorAll('[data-ds]').forEach(x=>x.onclick=()=>{clearT();sh=x.dataset.ds;step=0;draw()});box.querySelector('#dS').oninput=e=>{clearT();step=+e.target.value;draw()};
  box.querySelector('#dN').onclick=()=>{clearT();seed=Math.floor(Math.random()*9999)+1;nz=noise();step=0;draw()};
  box.querySelector('#dG').onclick=()=>{clearT();step=0;draw();const t=setInterval(()=>{step++;draw();if(step>=10)clearInterval(t)},260);SIMT.push(t)};};draw();}
});

/* ===== estado ===== */
let current='home', subTab={dia1:0,dia2:0,dia3:0,dia4:0}, quizState={}, caseSel=0, idealV={};
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let seen=load('ruta_seen',{});

/* ===== vistas ===== */
const R={};
R.home=()=>`${H('Semana general · Administrativos SENA','Ruta de la Transformación Digital','Un recorrido práctico para fortalecer nuestras capacidades en tecnología, automatización y análisis de datos — explicado de forma sencilla.','rocket')}
 <div class="grid g4 mt">${[['users','Para','administrativos del SENA'],['clock','4','días de formación'],['wand','30+','prompts listos para copiar'],['tool','37','simulaciones prácticas']].map(x=>C(`<div class="kpi"><div class="ic">${I(x[0])}</div><div><b>${x[1]}</b><span>${x[2]}</span></div></div>`)).join('')}</div>
 <h2 class="sec mt2">Lo que vamos a explorar</h2><p class="lead">De la transformación digital a la toma de decisiones con datos: entender el cambio, mejorar la forma de trabajar y convertir los datos en información útil.</p>
 <div class="grid g2">${['dia1','dia2','dia3','dia4'].map(k=>C(`<div class="day"><div class="d">${DAYS[k].tag.replace(' ','<br>')}</div><div><h3>${DAYS[k].title}</h3><p class="small" style="margin:0">${DAYS[k].lead}</p></div></div><button class="btn ghost mt" data-go="${k}">Entrar →</button>`)).join('')}</div>
 ${S('Propósito','Aprender herramientas y conceptos para trabajar de forma más simple, inteligente y estratégica.','target')}
 ${C(`<h4 style="margin-top:0">Cómo usar este recurso</h4>${UL(['Avanza por el menú; el punto verde marca lo que ya visitaste.','Cada día tiene pestañas con sus temas, simulaciones prácticas y un repaso al final.','Los botones “Copiar” te dejan llevar los prompts a tu asistente de IA.','Practica siempre con datos ficticios o anonimizados.'])}`)}`;

function dayView(k){const d=DAYS[k],t=subTab[k],tabs=[...d.subs.map(s=>s[0]),'🧪 Simulaciones','¿Lo entendí?'];
 const body=t<d.subs.length?d.subs[t][1]:t==d.subs.length?simView(k):quizView(k);
 return `${H(d.tag,d.title,d.lead,d.icon)}<div class="tabs mt">${tabs.map((x,i)=>`<button data-sub="${k}:${i}" class="${i==t?'on':''}">${i<d.subs.length?(i+1)+'. ':''}${x}</button>`).join('')}</div>${C(body)}
 <div class="next">${t>0?`<button class="btn ghost" data-sub="${k}:${t-1}">← Anterior</button>`:'<span></span>'}${t<tabs.length-1?`<button class="btn" data-sub="${k}:${t+1}">Siguiente: ${tabs[t+1]} →</button>`:nextDay(k)}</div>`;}
function nextDay(k){const o=['dia1','dia2','dia3','dia4','taller'];const n=o[o.indexOf(k)+1];return `<button class="btn" data-go="${n}">Continuar →</button>`;}
function quizView(k){const q=DAYS[k].quiz,st=quizState[k]||{};const ok=Object.values(st).filter(x=>x.ok).length;
 return `<h3>Repaso rápido</h3><p class="small">Elige una respuesta. Verás de inmediato si acertaste.</p>${q.map((x,i)=>`<div class="mt"><b>${i+1}. ${x[0]}</b>${x[1].map((o,j)=>{let c='';if(st[i]){if(j==x[2])c='right';else if(j==st[i].c)c='wrong';}return `<label class="opt ${c}" data-q="${k}:${i}:${j}">${o}</label>`}).join('')}${st[i]?`<div class="fb ${st[i].ok?'okc':'badc'}">${st[i].ok?'¡Correcto!':'No exactamente.'} <span style="color:var(--ink);font-weight:400">${x[3]}</span></div>`:''}</div>`).join('')}
 ${Object.keys(st).length==q.length?`<div class="mt2 row"><span class="score">${ok}/${q.length}</span><button class="btn ghost" data-qreset="${k}">Intentar de nuevo</button></div>`:''}`;}
['dia1','dia2','dia3','dia4'].forEach(k=>R[k]=()=>dayView(k));

R.taller=()=>{const c=CASES[caseSel];return `${H('Día 4 · Tarde','Taller: la IA en un proceso real','En equipos de 3 o 4 personas, construyan y prueben una solución con IA para una tarea concreta, usando el método IDEAL y revisión humana.','tool')}
 <div class="grid g2 mt">${C(`<h4 style="margin-top:0">Antes de empezar</h4>${UL(['Repartan roles: coordinar, escribir el prompt, verificar y presentar.','Necesitan un asistente de IA y un documento compartido.','Usen solo los datos ficticios de los casos.','Elijan <b>un solo caso</b> y profundicen en él toda la tarde.'])}`)}
 ${C(`<h4 style="margin-top:0">Contexto común</h4><p><b>TechSolutions S.A.S.</b>, empresa ficticia de tecnología con 50 empleados, quiere mejorar sus procesos internos.</p><p class="small">Al final cada equipo tendrá: ficha del reto, dos versiones del prompt, un resultado revisado, registro de pruebas y una propuesta de piloto.</p>`)}</div>
 <h2 class="sec mt2">1. Elijan un caso</h2><div class="tabs">${CASES.map((x,i)=>`<button data-case="${i}" class="${i==caseSel?'on':''}">${x[0].split(':')[0]}</button>`).join('')}</div>
 ${C(`<h3>${c[0]}</h3><div class="sub"><div><h4>Reto</h4><p>${c[1]}</p><h4>Datos del caso</h4><div class="out">${c[2]}</div></div><div><h4>Producto</h4><p>${c[3]}</p><h4>Prueba</h4>${EX(c[4])}</div></div>`)}
 <h2 class="sec mt2">2. Trabajen por etapas</h2>${C([['13:30','Elegir','Repartan roles y escojan el caso.'],['13:45','Analizar','¿Cómo se hace hoy? ¿Quién usa el resultado? ¿Qué datos hay?'],['14:05','Construir','Escriban el prompt IDEAL, pruébenlo y guarden la versión 1.'],['14:50','Verificar','Otra persona compara cada afirmación con los datos. Busquen inventos y omisiones.'],['16:00','Mejorar','Corrijan el prompt, prueben la versión 2 y el cambio del caso.'],['16:40','Compartir','Problema, un error encontrado, la corrección y el resultado.'],['17:10','Cerrar','Propongan un piloto: tarea, responsable, datos, revisión y medida.']].map((x,i)=>`<div class="step"><div class="n">${i+1}</div><div><span class="tm">${x[0]}</span><h4 style="margin:2px 0">${x[1]}</h4><span>${x[2]}</span></div></div>`).join(''))}
 <h2 class="sec mt2">3. Registren la evidencia</h2>${P('EQUIPO Y CASO:\nPROBLEMA Y FORMA ACTUAL DE TRABAJO:\nDESTINATARIO Y RESULTADO ESPERADO:\nDATOS DISPONIBLES Y DATOS FALTANTES:\nCRITERIO DE ÉXITO:\nPROMPT IDEAL — VERSIÓN 1:\nRESPUESTA OBTENIDA:\nHALLAZGOS: afirmación / evidencia / corrección\nPROMPT IDEAL — VERSIÓN 2:\nRESULTADO REVISADO:\nPRUEBA CON UN DATO NUEVO:\nQUÉ DEBE REVISAR UNA PERSONA:\nPILOTO PROPUESTO: tarea / responsable / indicador / fecha','Plantilla de evidencia').replace('<p>','<p style="white-space:pre-wrap">')}
 <h2 class="sec mt2">4. Califiquen su solución</h2><p class="lead">Cada criterio de 0 a 2 (0 = no se ve · 1 = parcial · 2 = demostrado). Máximo 10.</p>
 ${C(`<div id="rub">${['Reto claro: tarea, destinatario y criterio de éxito.','Prompt IDEAL con sus cinco partes.','Resultado sustentado: sin datos inventados y con el formato pedido.','Mejora probada: dos versiones y prueba con un dato nuevo.','Uso responsable: revisión humana y piloto con indicador.'].map((x,i)=>`<div class="row" style="justify-content:space-between;padding:8px 0;border-top:${i?'1px solid var(--line)':'0'}"><span style="flex:1;min-width:200px">${x}</span><select data-rub="${i}" style="width:90px"><option>0</option><option>1</option><option>2</option></select></div>`).join('')}</div><div class="row mt"><span class="score" id="rubT">0/10</span><span class="small" id="rubM"></span></div>`)}
 ${S('Sin internet o sin IA','Construyan el prompt y simulen la respuesta por parejas. Otro equipo la revisa. Márquenlo como simulación.','clock')}`;};

const IDF=[['i','I — Identificar','Rol de la IA','Ej.: asistente administrativo con experiencia en atención al cliente'],['d1','D — Definir','Contexto y destinatario','Ej.: un cliente pregunta por su orden; aún no hay fecha confirmada'],['d2','D — Definir','Tarea y objetivo','Ej.: redactar un correo de respuesta con el estado actual'],['e','E — Ejemplificar (opcional)','Modelo de referencia','Ej.: un correo anterior que sirva de guía'],['a','A — Adaptar','Tono, formato y extensión','Ej.: tono cordial, con asunto, máximo 150 palabras'],['l','L — Limitar','Límites y restricciones','Ej.: no inventes fechas; marca “por confirmar” lo que falte']];
R.ideal=()=>`${H('Herramienta','Generador de prompts IDEAL','Llena los campos y obtén un prompt ordenado para copiar en el asistente de IA que prefieras. Nada se envía a internet.','wand')}
 <div class="grid g2 mt">${C(IDF.map(f=>`<label class="f">${f[1]} · <span style="font-weight:400;color:var(--muted)">${f[2]}</span></label><textarea data-id="${f[0]}" placeholder="${f[3]}" style="min-height:60px">${esc(idealV[f[0]]||'')}</textarea>`).join('')+`<div class="row mt"><button class="btn ghost" id="idEx">Cargar ejemplo</button><button class="btn ghost" id="idClr">Limpiar</button></div>`)}
 ${C(`<h4 style="margin-top:0">Tu prompt</h4><div class="meter"><i id="idM"></i></div><p class="small" id="idT"></p><div class="out" id="idOut"></div><div class="row mt"><button class="btn" id="idCp">Copiar prompt</button></div>${S('Antes de usarlo','Revisa la respuesta: ¿inventó algo? ¿cumple el formato y los límites? Guarda el prompt como evidencia.','check')}`)}</div>`;

R.vocab=()=>`<h2 class="sec">Vocabulario</h2><p class="lead">Las palabras de la semana, explicadas en una línea.</p><input type="text" id="vs" placeholder="Buscar una palabra…"><div class="gl mt" id="vl">${vocList('')}</div>`;
const vocList=q=>VOCAB.filter(x=>(x[0]+x[1]).toLowerCase().includes(q.toLowerCase())).map(x=>`<div><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')||'<p class="small">Sin resultados.</p>';

R.cierre=()=>`${H('Al finalizar','Aprender · Experimentar · Transformar','Cada tema es una oportunidad para mirar nuestro trabajo con nuevos ojos y encontrar formas más simples de hacer las cosas.','flag')}
 <div class="grid g2 mt">${['Reconoceremos oportunidades de transformación en nuestro trabajo.','Identificaremos procesos que se pueden mejorar o automatizar.','Entenderemos el valor de los datos para decidir.','Tendremos una visión práctica para seguir aprendiendo.'].map(x=>C(`<div class="kpi"><div class="ic">${I('check')}</div><div><span style="font-size:15px;color:var(--ink)">${x}</span></div></div>`)).join('')}</div>
 ${S('Idea guía','La transformación digital no consiste solo en usar más tecnología: consiste en <b>trabajar mejor, generar valor y facilitar el servicio a las personas</b>.','bulb')}
 <h2 class="sec mt2">Para seguir aprendiendo</h2>
 <div class="grid g3">${[['¿Qué es la Industria 4.0?','Carlos Pacheco','qué es la industria 4.0 Carlos Pacheco'],['Cómo escribir prompts perfectos','IA Educativa','cómo escribir prompts perfectos'],['La fórmula del prompt perfecto','Cyberclick','la fórmula del prompt perfecto Cyberclick'],['IA aplicada a la gestión documental','Apiux Tech','IA aplicada a la gestión documental Apiux'],['Cuando los documentos piensan: IA','DGTIC Generalitat Valenciana','Cuando los documentos piensan IA DGTIC'],['15 mejores herramientas de IA','Emprende Digital','15 mejores herramientas de IA Emprende Digital']].map(v=>`<a class="vid" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(v[2])}"><div class="th"><span class="lg">Video</span><div class="pl">${I('play')}</div></div><div class="bd"><b>${v[0]}</b><small>${v[1]} · YouTube</small></div></a>`).join('')}</div>
 <h4 class="mt2">Referencias</h4>${UL(['Schwab, K. (2016). <i>La cuarta revolución industrial</i>. Debate.','OpenAI. (2024). Mejores prácticas de ingeniería de prompts.','Prompt Engineering Guide. (2024). PromptingGuide.ai.','Microsoft Learn. Descripción general de Microsoft 365 Copilot.','Abana. (2023). La inteligencia artificial aplicada a la gestión documental.'])}`;

/* ===== motor ===== */
function render(){
 const s=SECTIONS.find(x=>x[0]==current);
 document.getElementById('tTitle').innerHTML=`${s[2]}<small>Ruta de la Transformación Digital · SENA</small>`;
 document.getElementById('nav').innerHTML=SECTIONS.map(([k,ic,l])=>`<button data-go="${k}" class="${k==current?'on':''} ${seen[k]?'seen':''}">${I(ic)} ${l}<span class="dot"></span></button>`).join('');
 document.getElementById('content').innerHTML=`<section class="pane on">${R[current]()}</section>`;
 const r=document.documentElement,dark=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);
 document.getElementById('themeBtn').innerHTML=dark?I('sun')+' Claro':I('moon')+' Oscuro';
 const v=SECTIONS.filter(([k])=>seen[k]).length;document.getElementById('pbar').style.width=(v/SECTIONS.length*100)+'%';
 document.getElementById('ptxt').textContent=Math.round(v/SECTIONS.length*100)+'% recorrido';bind();}
const keep=f=>{const y=window.scrollY;f();render();window.scrollTo(0,y)};
function copyTxt(t,b){const done=()=>{const o=b.textContent;b.textContent='¡Copiado!';setTimeout(()=>b.textContent=o,1400)};
 if(navigator.clipboard)navigator.clipboard.writeText(t).then(done,()=>fallback());else fallback();
 function fallback(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();done()}}
function bind(){
 clearT();
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{const[k,i]=b.dataset.sub.split(':');subTab[k]=+i;render();window.scrollTo(0,0)});
 document.querySelectorAll('[data-sim]').forEach(b=>b.onclick=()=>keep(()=>{const[k,i]=b.dataset.sim.split(':');simTab[k]=+i}));
 const sb=document.getElementById('simBox');if(sb)SIM[sb.dataset.k](sb);
 document.querySelectorAll('[data-q]').forEach(o=>o.onclick=()=>{const[k,i,j]=o.dataset.q.split(':');const st=quizState[k]=quizState[k]||{};if(st[i])return;keep(()=>st[i]={c:+j,ok:+j==DAYS[k].quiz[i][2]})});
 document.querySelectorAll('[data-qreset]').forEach(b=>b.onclick=()=>keep(()=>quizState[b.dataset.qreset]={}));
 document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.toggle).classList.toggle('hide'));
 document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyTxt(b.parentNode.querySelector('p').textContent,b));
 document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>keep(()=>caseSel=+b.dataset.case));
 const rs=document.querySelectorAll('[data-rub]');if(rs.length){const f=()=>{const t=[...rs].reduce((a,s)=>a+ +s.value,0);document.getElementById('rubT').textContent=t+'/10';document.getElementById('rubM').textContent=t>=8?'¡Listo para proponer el piloto!':t>=5?'Van bien: refuercen los criterios en 0 o 1.':'Revisen el reto y la verificación antes de presentar.'};rs.forEach(s=>s.onchange=f);f();}
 const vs=document.getElementById('vs');if(vs)vs.oninput=()=>document.getElementById('vl').innerHTML=vocList(vs.value);
 const out=document.getElementById('idOut');if(out){
  const gen=()=>{const v=idealV,parts=[];
   if(v.i)parts.push(`Actúa como ${v.i}.`);if(v.d1)parts.push(`Contexto: ${v.d1}.`);if(v.d2)parts.push(`Tarea: ${v.d2}.`);if(v.e)parts.push(`Usa como referencia este ejemplo: ${v.e}.`);if(v.a)parts.push(`Formato: ${v.a}.`);if(v.l)parts.push(`Límites: ${v.l}.`);
   if(parts.length)parts.push('Si falta información, indícalo en lugar de inventarla.');
   out.textContent=parts.join('\n').replace(/\.\./g,'.')||'Completa los campos para ver tu prompt aquí.';
   const req=['i','d1','d2','a','l'].filter(k=>(v[k]||'').trim()).length;const m=document.getElementById('idM');m.style.width=(req/5*100)+'%';m.style.background=req==5?'var(--ok)':req>=3?'var(--warn)':'var(--bad)';
   document.getElementById('idT').textContent=`${req} de 5 partes obligatorias completas`+(req==5?' · ¡prompt completo!':'');};
  document.querySelectorAll('[data-id]').forEach(t=>t.oninput=()=>{idealV[t.dataset.id]=t.value.trim();gen()});
  document.getElementById('idCp').onclick=e=>copyTxt(out.textContent,e.target);
  document.getElementById('idClr').onclick=()=>keep(()=>idealV={});
  document.getElementById('idEx').onclick=()=>keep(()=>idealV={i:'asistente administrativo de una empresa de tecnología',d1:'un cliente pregunta por la orden OC-0156 de 12 equipos; está pendiente de confirmación del proveedor y no hay fecha de entrega',d2:'redactar un correo de respuesta que informe el estado actual y el siguiente paso',e:'',a:'tono cordial y profesional, con asunto, saludo y cierre, máximo 150 palabras',l:'no inventes ni prometas fechas; marca como “por confirmar” lo que no esté en los datos'});
  gen();}
}
function go(k){current=k;seen[k]=true;save('ruta_seen',seen);render();window.scrollTo(0,0);}
document.getElementById('themeBtn').onclick=()=>{const r=document.documentElement,dark=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);r.setAttribute('data-theme',dark?'light':'dark');try{localStorage.setItem('ova_theme',dark?'light':'dark')}catch(e){}render();};
try{const th=localStorage.getItem('ova_theme');if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
seen.home=true;const h=location.hash.slice(1);if(SECTIONS.some(([k])=>k==h)){current=h;seen[h]=true}
render();

</script>
