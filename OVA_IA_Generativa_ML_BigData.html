<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IA generativa, machine learning y Big Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sena:#39A900; --sena2:#007832; --navy:#00304D; --sena-soft:#E8F5DF;
  --bg:#F4F7F5; --panel:#FFFFFF; --panel2:#F8FAF9; --ink:#14212B; --muted:#5B6B76; --line:#E1E8E4;
  --accent:#00304D; --chip:#EEF4F0; --shadow:0 1px 2px rgba(0,48,77,.06),0 6px 20px rgba(0,48,77,.06);
  --ok:#2E8B16; --bad:#C62828; --warn:#C77700; --link:#007832; --nv:#00304D;
}
:root:not([data-theme="light"]){color-scheme:light}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1620; --panel:#112230; --panel2:#0E1D29; --ink:#E7EEF2; --muted:#9DB0BC; --line:#1F3546;
    --accent:#7FD45A; --chip:#173042; --sena-soft:#16331F; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --ok:#6BCB45; --bad:#FF6B6B; --warn:#F2B44A; --link:#7FD45A; --nv:#1F6A99; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1620; --panel:#112230; --panel2:#0E1D29; --ink:#E7EEF2; --muted:#9DB0BC; --line:#1F3546;
  --accent:#7FD45A; --chip:#173042; --sena-soft:#16331F; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --ok:#6BCB45; --bad:#FF6B6B; --warn:#F2B44A; --link:#7FD45A; --nv:#1F6A99; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Work Sans",Calibri,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15.5px;line-height:1.55}
a{color:var(--link);font-weight:500}
svg{width:1.05em;height:1.05em;vertical-align:-.15em;flex:none}
svg.inf{width:100%;height:auto}
button{font-family:inherit}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--navy);color:#fff;position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;gap:12px;align-items:center;padding:4px 6px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand img{width:46px;height:46px;border-radius:10px;flex:none}
.brand b{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#A9E58A}
.brand span{font-size:13px;opacity:.85;line-height:1.3;display:block}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#D6E3EA;padding:9px 10px;border-radius:9px;font-size:14px;cursor:pointer}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:var(--sena);color:#fff;font-weight:600}
.nav button .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:transparent}
.nav button.seen .dot{background:#A9E58A}
.nav button.on .dot{background:#fff}
.nav svg{width:18px;height:18px;flex:none}
.side .foot{margin-top:auto;font-size:12px;opacity:.7;line-height:1.4;padding:8px 6px}
/* main */
.main{min-width:0}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 28px}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.prog{width:160px;flex:none}
.prog .bar{height:7px;background:var(--line);border-radius:9px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--sena);width:0;transition:width .4s}
.prog small{font-size:11.5px;color:var(--muted)}
.tog{display:flex;gap:6px;flex:none}
.tog button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.tog button:hover{border-color:var(--sena)}
.tog svg{width:16px;height:16px}
.content{padding:26px 28px 60px;max-width:1240px}
section.pane{display:none;animation:fade .35s ease}
section.pane.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2.sec{font-size:26px;margin:0 0 4px;letter-spacing:-.02em;font-weight:700}
p.lead{color:var(--muted);margin:0 0 22px;max-width:820px}
h3{font-size:18px;margin:0 0 8px;font-weight:700}
h4{font-size:15px;margin:14px 0 6px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mt{margin-top:16px}.mt2{margin-top:26px}
.hero{background:linear-gradient(120deg,var(--navy) 0%,#00476F 55%,var(--sena2) 100%);color:#fff;border-radius:20px;padding:28px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;overflow:hidden;position:relative}
.hero h2{font-size:30px;margin:4px 0 8px;letter-spacing:-.02em;line-height:1.15}
.hero p{margin:0;opacity:.9;max-width:640px}
.hero .tag{display:inline-block;background:var(--sena);padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.hero svg.av{width:150px;height:150px}
.kpi{display:flex;gap:14px;align-items:center}
.kpi .ic{width:46px;height:46px;border-radius:12px;background:var(--sena-soft);color:var(--sena2);display:grid;place-items:center;flex:none}
:root[data-theme="dark"] .kpi .ic{color:#7FD45A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kpi .ic{color:#7FD45A}}
.kpi .ic svg{width:24px;height:24px}
.kpi b{font-size:24px;display:block;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--ink)}
.chip.g{background:var(--sena);color:#fff}
.chip.n{background:var(--navy);color:#fff}
.list{margin:0;padding-left:20px}.list li{margin:4px 0}
/* subtopic */
.sub{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.sub .num{font-size:12px;font-weight:700;color:var(--sena);letter-spacing:.08em;text-transform:uppercase}
.ex{border-left:4px solid var(--sena);background:var(--panel2);border-radius:0 12px 12px 0;padding:12px 14px;margin-top:12px;font-size:14.5px}
.ex b{color:var(--sena2)}
:root[data-theme="dark"] .ex b{color:#7FD45A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ex b{color:#7FD45A}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:7px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.tabs button.on{background:var(--nv);border-color:var(--nv);color:#fff}
/* infographics */
.info{background:var(--panel2);border:1px dashed var(--line);border-radius:14px;padding:14px}
.info .cap{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.flow .st{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;position:relative}
.flow .st b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sena);color:#fff;margin:0 auto 6px;font-size:14px}
.flow .st:nth-child(even) b{background:var(--navy)}
.flow .st span{font-size:13px;font-weight:600;display:block;line-height:1.3}
.flow .st small{font-size:12px;color:var(--muted);display:block;margin-top:3px;line-height:1.3}
.igrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.igrid div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.igrid b{font-size:22px;color:var(--sena);display:block;line-height:1}
.igrid span{font-weight:700;font-size:13.5px;display:block;margin-top:4px}
.igrid small{font-size:12px;color:var(--muted);line-height:1.3;display:block}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp>div{border-radius:12px;padding:12px;background:var(--panel);border:1px solid var(--line)}
.cmp>div:first-child{border-top:4px solid var(--navy)}.cmp>div:last-child{border-top:4px solid var(--sena)}
.cmp ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}
svg.inf{width:100%;height:auto;display:block}
svg.inf text{font-family:"Work Sans",sans-serif}
/* avatar tip */
.tip{display:flex;gap:12px;align-items:flex-start;margin-top:14px}
.tip svg{width:54px;height:54px;flex:none}
.tip .bub{background:var(--sena-soft);border-radius:4px 14px 14px 14px;padding:10px 13px;font-size:14px}
.tip .bub b{display:block;font-size:12px;color:var(--sena2);letter-spacing:.04em}
:root[data-theme="dark"] .tip .bub b{color:#7FD45A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tip .bub b{color:#7FD45A}}
/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--panel)}
th{background:var(--navy);color:#fff;text-align:left;padding:10px 12px;font-weight:600;font-size:13px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:var(--panel2)}
/* forms */
label.f{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input[type=text],textarea,select{width:100%;font-family:inherit;font-size:14.5px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;padding:9px 11px}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--sena);border-color:transparent}
.btn{border:0;background:var(--sena);color:#fff;font-weight:700;border-radius:10px;padding:9px 16px;cursor:pointer;font-size:14px;display:inline-flex;gap:7px;align-items:center}
.btn.alt{background:var(--nv)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.07)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.meter{height:12px;background:var(--line);border-radius:9px;overflow:hidden}
.meter i{display:block;height:100%;transition:width .35s,background .35s}
.out{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;white-space:pre-wrap;min-height:60px}
.okc{color:var(--ok);font-weight:700}.badc{color:var(--bad);font-weight:700}.warnc{color:var(--warn);font-weight:700}
.bars .b{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bars .b div{height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.bars .b i{display:block;height:100%;background:var(--sena)}
.opt{display:block;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:6px 0;cursor:pointer;background:var(--panel)}
.opt:hover{border-color:var(--sena)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--panel))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel))}
.fb{font-size:13.5px;margin-top:6px}
.vid{display:block;text-decoration:none;color:inherit;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);transition:transform .2s}
.vid:hover{transform:translateY(-3px)}
.vid .th{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,var(--navy),var(--sena2));display:grid;place-items:center;color:#fff}
.vid .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid .th .pl{position:relative;width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center}
.vid .th .pl svg{width:24px;height:24px;margin-left:3px}
.vid .th .lg{position:absolute;top:8px;left:8px;background:var(--sena);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
.vid .bd{padding:10px 12px}
.vid .bd b{font-size:14px;display:block;line-height:1.3}
.vid .bd small{color:var(--muted);font-size:12.5px}
.step{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .n{width:40px;height:40px;border-radius:12px;background:var(--nv);color:#fff;display:grid;place-items:center;font-weight:800}
.step.done .n{background:var(--sena)}
.step .tm{font-size:12px;font-weight:700;color:var(--sena2);text-transform:uppercase;letter-spacing:.05em}
:root[data-theme="dark"] .step .tm{color:#7FD45A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .step .tm{color:#7FD45A}}
.step ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.timeline{display:flex;height:16px;border-radius:9px;overflow:hidden;margin:10px 0 4px}
.timeline i{display:block;height:100%}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.gl div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.gl b{color:var(--sena2)}
:root[data-theme="dark"] .gl b{color:#7FD45A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gl b{color:#7FD45A}}
.gl p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.res{display:flex;gap:12px;align-items:flex-start}
.res .ic{width:38px;height:38px;border-radius:10px;background:var(--nv);color:#fff;display:grid;place-items:center;flex:none}
.res .ic svg{width:20px;height:20px}
code{background:var(--chip);padding:1px 6px;border-radius:6px;font-size:.88em;font-family:Consolas,monospace}
mark{background:#FFE58F;color:#000;border-radius:4px;padding:0 3px}
.score{font-size:40px;font-weight:800;color:var(--sena)}
.small{font-size:13px;color:var(--muted)}
.hide{display:none!important}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:column}
  .nav{flex-direction:row;overflow:auto;gap:4px;padding-bottom:4px}
  .nav button{white-space:nowrap;width:auto}
  .side .foot{display:none}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sub{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}.hero svg.av{display:none}
}
@media (max-width:620px){
  .content{padding:18px 16px 50px}.top{padding:10px 16px;flex-wrap:wrap}
  .prog{order:3;width:100%}
  .g2,.g3,.g4,.cmp{grid-template-columns:1fr}
  .hero h2{font-size:24px}
}
</style>
</head>

{"t": {"es": "Aplicar", "en": "Apply"}, "d": {"es": "Taller 1 con casos SENA", "en": "Workshop 1 with SENA cases"}}, {"t": {"es": "Verificar", "en": "Verify"}, "d": {"es": "Autoevaluación y glosario", "en": "Self-assessment and glossary"}}]}, "howto": [{"es": "Recorra las secciones del menú en orden; el punto verde indica las que ya visitó.", "en": "Go through the menu sections in order; the green dot shows the ones you have visited."}, {"es": "Use el botón de idioma para alternar entre español e inglés, y el de tema para el modo claro u oscuro.", "en": "Use the language button to switch between Spanish and English, and the theme button for light or dark mode."}, {"es": "Los simuladores funcionan sin conexión a servicios externos: puede practicar con tranquilidad.", "en": "Simulators do not connect to external services: you can practice safely."}, {"es": "Nunca ingrese datos reales o reservados en herramientas de IA durante el evento.", "en": "Never enter real or confidential data into AI tools during the event."}], "homeTip": {"es": "Yo empecé usando la IA para resumir correos. Hoy verifico todo y ahorro horas cada semana.", "en": "I started using AI to summarise emails. Now I verify everything and save hours every week."}, "objective": {"es": "Comprender los fundamentos de la inteligencia artificial generativa, el machine learning y el Big Data, para reconocer su potencial y sus límites en la gestión institucional del SENA.", "en": "Understand the fundamentals of generative artificial intelligence, machine learning and Big Data, in order to recognise their potential and limits in SENA's institutional management."}, "objTip": {"es": "Al final de la mañana usted tendrá su propia bitácora de prompts lista para usar en su trabajo.", "en": "By the end of the morning you will have your own prompt log ready to use at work."}, "outcomes": [{"es": "Diferenciar la IA tradicional, el machine learning, el deep learning y la IA generativa.", "en": "Tell apart traditional AI, machine learning, deep learning and generative AI."}, {"es": "Explicar los tipos de aprendizaje automático con ejemplos del SENA.", "en": "Explain the types of machine learning with SENA examples."}, {"es": "Describir las 5 V del Big Data y las fuentes de datos institucionales.", "en": "Describe the 5 Vs of Big Data and institutional data sources."}, {"es": "Redactar prompts con la estructura rol–contexto–tarea–formato.", "en": "Write prompts using the role–context–task–format structure."}, {"es": "Detectar alucinaciones y verificar respuestas en fuentes oficiales.", "en": "Detect hallucinations and verify answers with official sources."}, {"es": "Aplicar principios éticos y normativos (CONPES 4144 de 2025, Ley 1581 de 2012).", "en": "Apply ethical and regulatory principles (CONPES 4144 of 2025, Law 1581 of 2012)."}], "subtopics": [{"n": "1.1", "t": {"es": "Instalación del evento y diagnóstico", "en": "Event kick-off and diagnostic"}, "av": "andres", "body": {"es": "<p>El Evento de Divulgación Tecnológica (EDT) dura <b>4 días y 32 horas<\/b>, con dos temas diarios de 4 horas. Cada tema sigue tres momentos: explicación con apoyo de este OVA, taller de aplicación (1 h 45 min) y retroalimentación.<\/p><p>Antes de empezar, cada participante responde la <b>prueba diagnóstica en Microsoft Forms<\/b>. No tiene nota: sirve para que el instructor ajuste el ritmo y la profundidad.<\/p><p>Acuerdos de trabajo: puntualidad, celular en silencio durante las explicaciones, participación activa, entrega de cada taller en la carpeta de evidencias de Teams y <b>cero datos reales en herramientas de IA<\/b>.<\/p>", "en": "<p>The Technology Dissemination Event (TDE) lasts <b>4 days and 32 hours<\/b>, with two 4-hour topics per day. Each topic follows three moments: explanation supported by this OVA, hands-on workshop (1 h 45 min) and feedback.<\/p><p>Before starting, each participant takes the <b>diagnostic test in Microsoft Forms<\/b>. It is not graded: it helps the instructor adjust pace and depth.<\/p><p>Working agreements: punctuality, phones on silent during explanations, active participation, submitting each workshop to the Teams evidence folder and <b>no real data in AI tools<\/b>.<\/p>"}, "ex": {"es": "Laura, de la coordinación académica, responde el diagnóstico y descubre que usa IA a diario pero nunca ha verificado sus respuestas: ese será su foco del día.", "en": "Laura, from academic coordination, takes the diagnostic and realises she uses AI daily but has never verified its answers: that will be her focus today."}, "tip": {"es": "Responda el diagnóstico con honestidad: no hay respuestas «malas», solo puntos de partida.", "en": "Answer the diagnostic honestly: there are no “bad” answers, only starting points."}, "g": {"type": "flow", "title": {"es": "los 4 días del EDT", "en": "the 4 days of the TDE"}, "items": [{"t": {"es": "Día 1", "en": "Day 1"}, "d": {"es": "Fundamentos y aplicación de la IA", "en": "AI fundamentals and application"}}, {"t": {"es": "Día 2", "en": "Day 2"}, "d": {"es": "Copilot y automatización", "en": "Copilot and automation"}}, {"t": {"es": "Día 3", "en": "Day 3"}, "d": {"es": "Analítica de datos e Industria 4.0", "en": "Data analytics and Industry 4.0"}}, {"t": {"es": "Día 4", "en": "Day 4"}, "d": {"es": "Prospectiva y arquitectura empresarial", "en": "Foresight and enterprise architecture"}}]}, "g2": {"type": "grid", "title": {"es": "cómo se trabaja cada tema", "en": "how each topic works"}, "items": [{"k": "1 h 45", "t": {"es": "Explicación", "en": "Explanation"}, "d": {"es": "Subtemas con apoyo del OVA", "en": "Subtopics supported by the OVA"}}, {"k": "1 h 45", "t": {"es": "Taller", "en": "Workshop"}, "d": {"es": "Producto = evidencia", "en": "Product = evidence"}}, {"k": "30 min", "t": {"es": "Retroalimentación", "en": "Feedback"}, "d": {"es": "Socialización y ajustes", "en": "Sharing and adjustments"}}]}}, {"n": "1.2", "t": {"es": "Conceptos clave de inteligencia artificial", "en": "Key concepts of artificial intelligence"}, "av": "andres", "body": {"es": "<p>La <b>inteligencia artificial (IA)<\/b> es la capacidad de un sistema informático para realizar tareas que normalmente requieren inteligencia humana: comprender lenguaje, reconocer patrones, predecir o tomar decisiones.<\/p><p>La <b>IA tradicional<\/b> clasifica o predice a partir de datos (¿esta PQRS es una queja o una petición?). La <b>IA generativa<\/b> crea contenido nuevo: textos, imágenes, audio o código.<\/p><p>Los <b>modelos de lenguaje grandes (LLM)<\/b>, como los que usan Copilot, ChatGPT, Gemini o Claude, se entrenan con enormes cantidades de texto y generan respuestas prediciendo, palabra a palabra (en realidad, <b>token<\/b> a token), la continuación más probable. La <b>ventana de contexto<\/b> es la cantidad de texto que el modelo puede considerar a la vez.<\/p><p>Importante: un LLM no «sabe» en el sentido humano; produce texto plausible. Por eso puede equivocarse con total seguridad.<\/p>", "en": "<p><b>Artificial intelligence (AI)<\/b> is the ability of a computer system to perform tasks that normally require human intelligence: understanding language, recognising patterns, predicting or making decisions.<\/p><p><b>Traditional AI<\/b> classifies or predicts from data (is this request a complaint or a petition?). <b>Generative AI<\/b> creates new content: text, images, audio or code.<\/p><p><b>Large language models (LLMs)<\/b>, such as those behind Copilot, ChatGPT, Gemini or Claude, are trained on huge amounts of text and generate answers by predicting, word by word (actually <b>token<\/b> by token), the most likely continuation. The <b>context window<\/b> is how much text the model can consider at once.<\/p><p>Important: an LLM does not “know” in the human sense; it produces plausible text. That is why it can be confidently wrong.<\/p>"}, "ex": {"es": "La IA tradicional puede alertar qué aprendices tienen riesgo de deserción; la IA generativa puede redactar el correo de acompañamiento para cada uno.", "en": "Traditional AI can flag which trainees are at risk of dropping out; generative AI can draft the follow-up email for each of them."}, "tip": {"es": "Piense en un LLM como un practicante muy rápido que leyó muchísimo, pero que necesita instrucciones claras y supervisión.", "en": "Think of an LLM as a very fast intern who has read a lot but needs clear instructions and supervision."}, "g": {"type": "nested", "title": {"es": "la IA contiene a sus ramas", "en": "AI contains its branches"}, "items": [{"t": {"es": "Inteligencia artificial", "en": "Artificial intelligence"}, "d": {"es": "sistemas que imitan capacidades humanas", "en": "systems that mimic human abilities"}}, {"t": "Machine learning", "d": {"es": "aprenden de datos", "en": "learn from data"}}, {"t": "Deep learning", "d": {"es": "redes neuronales profundas", "en": "deep neural networks"}}, {"t": {"es": "IA generativa", "en": "Generative AI"}, "d": {"es": "LLM · texto, imagen, código", "en": "LLM · text, image, code"}}]}, "g2": {"type": "compare", "title": {"es": "tradicional frente a generativa", "en": "traditional vs generative"}, "cols": [{"t": {"es": "IA tradicional (predictiva)", "en": "Traditional (predictive) AI"}, "items": [{"es": "Clasifica, predice, detecta", "en": "Classifies, predicts, detects"}, {"es": "Salida: una etiqueta o un número", "en": "Output: a label or a number"}, {"es": "Ej.: clasificar PQRS", "en": "E.g., classify requests"}]}, {"t": {"es": "IA generativa", "en": "Generative AI"}, "items": [{"es": "Crea contenido nuevo", "en": "Creates new content"}, {"es": "Salida: texto, imagen, audio, código", "en": "Output: text, image, audio, code"}, {"es": "Ej.: redactar la respuesta a la PQRS", "en": "E.g., draft the reply to the request"}]}]}}, {"n": "1.3", "t": "Machine learning", "av": "laura", "body": {"es": "<p>El <b>machine learning (aprendizaje automático)<\/b> permite que un sistema aprenda patrones a partir de datos, en lugar de programar cada regla. Sus tres tipos principales son:<\/p><p><b>Supervisado:<\/b> aprende de ejemplos que ya traen la respuesta correcta (etiqueta). Ej.: miles de PQRS ya clasificadas enseñan al modelo a clasificar las nuevas.<\/p><p><b>No supervisado:<\/b> busca grupos o patrones en datos sin etiquetas. Ej.: agrupar a los aprendices según su comportamiento en la plataforma virtual.<\/p><p><b>Por refuerzo:<\/b> aprende por ensayo y error, recibiendo recompensas. Ej.: optimizar la asignación de ambientes de formación.<\/p><p>El ciclo es siempre: <b>datos → entrenamiento → modelo → predicción → evaluación<\/b>. Si los datos de entrenamiento tienen sesgos, el modelo los reproduce.<\/p>", "en": "<p><b>Machine learning<\/b> lets a system learn patterns from data instead of programming every rule. Its three main types are:<\/p><p><b>Supervised:<\/b> learns from examples that already include the correct answer (label). E.g., thousands of already-classified requests teach the model to classify new ones.<\/p><p><b>Unsupervised:<\/b> looks for groups or patterns in unlabelled data. E.g., grouping trainees by their behaviour on the virtual platform.<\/p><p><b>Reinforcement:<\/b> learns by trial and error, receiving rewards. E.g., optimising the allocation of training rooms.<\/p><p>The cycle is always: <b>data → training → model → prediction → evaluation<\/b>. If training data is biased, the model reproduces the bias.<\/p>"}, "ex": {"es": "Pruebe el simulador «Clasificador de PQRS»: es un modelo supervisado real (Naive Bayes) que aprende de ejemplos etiquetados, y usted puede enseñarle nuevos.", "en": "Try the “Request classifier” simulator: it is a real supervised model (Naive Bayes) that learns from labelled examples, and you can teach it new ones."}, "tip": {"es": "Cuando me dicen «la IA lo decidió», pregunto: ¿con qué datos aprendió y quién revisó el resultado?", "en": "When someone says “the AI decided”, I ask: what data did it learn from and who reviewed the result?"}, "g": {"type": "flow", "title": {"es": "ciclo del machine learning", "en": "machine learning cycle"}, "items": [{"t": {"es": "Datos", "en": "Data"}, "d": {"es": "PQRS históricas etiquetadas", "en": "Labelled historical requests"}}, {"t": {"es": "Entrenamiento", "en": "Training"}, "d": {"es": "El algoritmo busca patrones", "en": "The algorithm finds patterns"}}, {"t": {"es": "Modelo", "en": "Model"}, "d": {"es": "Reglas aprendidas", "en": "Learned rules"}}, {"t": {"es": "Predicción", "en": "Prediction"}, "d": {"es": "Clasifica PQRS nuevas", "en": "Classifies new requests"}}, {"t": {"es": "Evaluación", "en": "Evaluation"}, "d": {"es": "¿Acierta? ¿Tiene sesgos?", "en": "Is it accurate? Biased?"}}]}, "g2": {"type": "grid", "title": {"es": "tipos de aprendizaje", "en": "learning types"}, "items": [{"k": "S", "t": {"es": "Supervisado", "en": "Supervised"}, "d": {"es": "Con etiquetas · clasificar, predecir", "en": "Labelled · classify, predict"}}, {"k": "NS", "t": {"es": "No supervisado", "en": "Unsupervised"}, "d": {"es": "Sin etiquetas · agrupar", "en": "Unlabelled · cluster"}}, {"k": "R", "t": {"es": "Por refuerzo", "en": "Reinforcement"}, "d": {"es": "Recompensas · optimizar", "en": "Rewards · optimise"}}]}}, {"n": "1.4", "t": "Big Data", "av": "laura", "body": {"es": "<p><b>Big Data<\/b> son conjuntos de datos tan grandes, rápidos o variados que requieren tecnologías especiales para almacenarlos y analizarlos. Se describe con las <b>5 V<\/b>: volumen, velocidad, variedad, veracidad y valor.<\/p><p>En el SENA hay datos de matrículas y certificaciones, resultados de formación, PQRS, contratación, empleo y emprendimiento, además de fuentes abiertas como <b>datos.gov.co<\/b> o la Gran Encuesta Integrada de Hogares del DANE.<\/p><p>Los datos se almacenan cada vez más en la <b>nube<\/b> y en lagos de datos. El <b>gobierno de datos<\/b> define quién es responsable, con qué calidad y con qué permisos se usan. Sin datos de calidad, la IA no produce resultados confiables: «basura entra, basura sale».<\/p>", "en": "<p><b>Big Data<\/b> refers to data sets so large, fast or varied that they require special technologies to store and analyse them. It is described with the <b>5 Vs<\/b>: volume, velocity, variety, veracity and value.<\/p><p>SENA holds data on enrolments and certifications, training results, citizen requests, contracting, employment and entrepreneurship, plus open sources such as <b>datos.gov.co<\/b> or DANE's household survey.<\/p><p>Data is increasingly stored in the <b>cloud<\/b> and in data lakes. <b>Data governance<\/b> defines who is responsible and with what quality and permissions data is used. Without quality data, AI cannot produce reliable results: “garbage in, garbage out”.<\/p>"}, "ex": {"es": "Cruzar las bases de egresados con datos de empleo permite estimar la pertinencia de un programa; si los documentos de identidad están mal digitados, el cruce falla (veracidad).", "en": "Joining graduate records with employment data helps estimate a programme's relevance; if ID numbers are mistyped, the join fails (veracity)."}, "tip": {"es": "Antes de pedirle algo a la IA, pregúntese: ¿mis datos están completos, actualizados y autorizados?", "en": "Before asking AI for anything, ask yourself: is my data complete, up to date and authorised?"}, "g": {"type": "grid", "title": {"es": "las 5 V del Big Data", "en": "the 5 Vs of Big Data"}, "items": [{"k": "V1", "t": {"es": "Volumen", "en": "Volume"}, "d": {"es": "Millones de registros de matrículas", "en": "Millions of enrolment records"}}, {"k": "V2", "t": {"es": "Velocidad", "en": "Velocity"}, "d": {"es": "Inscripciones en tiempo real", "en": "Real-time registrations"}}, {"k": "V3", "t": {"es": "Variedad", "en": "Variety"}, "d": {"es": "Tablas, PDF, correos, audio", "en": "Tables, PDFs, emails, audio"}}, {"k": "V4", "t": {"es": "Veracidad", "en": "Veracity"}, "d": {"es": "Datos limpios y confiables", "en": "Clean, reliable data"}}, {"k": "V5", "t": {"es": "Valor", "en": "Value"}, "d": {"es": "Decisiones mejor informadas", "en": "Better-informed decisions"}}]}}, {"n": "1.5", "t": {"es": "Ingeniería de instrucciones (prompts)", "en": "Prompt engineering"}, "av": "andres", "body": {"es": "<p>Un <b>prompt<\/b> es la instrucción que se le da a la IA. Su calidad determina la calidad de la respuesta. Use la estructura <b>rol – contexto – tarea – formato<\/b>, y agregue restricciones cuando sea necesario.<\/p><p>Trabaje de forma <b>iterativa<\/b>: pida, revise, ajuste. Proporcione ejemplos del resultado esperado, indique el público y el tono, y pida que señale lo que no sabe.<\/p><p>Las <b>alucinaciones<\/b> son respuestas plausibles pero falsas (normas, cifras o citas inventadas). Técnicas de verificación: pedir fuentes y comprobarlas, contrastar con documentos oficiales, pedir que distinga hechos de supuestos y revisar cifras con los datos originales.<\/p>", "en": "<p>A <b>prompt<\/b> is the instruction given to the AI. Its quality determines the quality of the answer. Use the <b>role – context – task – format<\/b> structure and add constraints when needed.<\/p><p>Work <b>iteratively<\/b>: ask, review, adjust. Provide examples of the expected result, state the audience and tone, and ask it to flag what it does not know.<\/p><p><b>Hallucinations<\/b> are plausible but false answers (invented rules, figures or quotes). Verification techniques: ask for sources and check them, compare with official documents, ask it to separate facts from assumptions and check figures against the original data.<\/p>"}, "ex": {"es": "Débil: «Haz una respuesta para un aprendiz». Sólido: «Actúa como profesional de atención al ciudadano del SENA. Un aprendiz pregunta por su apoyo de sostenimiento. Redacta una respuesta empática de máximo 150 palabras en lenguaje claro. No inventes fechas».", "en": "Weak: “Write a reply to a trainee”. Strong: “Act as a SENA citizen-service officer. A trainee asks about their support payment. Write an empathetic reply of max 150 words in plain language. Do not invent dates”."}, "tip": {"es": "Si la respuesta no le sirve, no repita la misma pregunta: agregue contexto, un ejemplo o el formato que necesita.", "en": "If the answer is not useful, don't repeat the same question: add context, an example or the format you need."}, "g": {"type": "grid", "title": {"es": "anatomía de un buen prompt", "en": "anatomy of a good prompt"}, "items": [{"k": "R", "t": {"es": "Rol", "en": "Role"}, "d": {"es": "Actúa como abogado/a contratista…", "en": "Act as a contracts lawyer…"}}, {"k": "C", "t": {"es": "Contexto", "en": "Context"}, "d": {"es": "Situación, público, datos", "en": "Situation, audience, data"}}, {"k": "T", "t": {"es": "Tarea", "en": "Task"}, "d": {"es": "Verbo claro: resume, compara…", "en": "Clear verb: summarise, compare…"}}, {"k": "F", "t": {"es": "Formato", "en": "Format"}, "d": {"es": "Tabla, viñetas, extensión", "en": "Table, bullets, length"}}, {"k": "!", "t": {"es": "Restricciones", "en": "Constraints"}, "d": {"es": "No inventes; cita la fuente", "en": "Don't invent; cite the source"}}]}, "g2": {"type": "cycle", "title": {"es": "ciclo iterativo", "en": "iterative cycle"}, "center": {"es": "Prompt", "en": "Prompt"}, "center2": {"es": "iterar", "en": "iterate"}, "items": [{"t": {"es": "Pedir", "en": "Ask"}, "d": "R-C-T-F"}, {"t": {"es": "Revisar", "en": "Review"}, "d": {"es": "¿sirve?", "en": "useful?"}}, {"t": {"es": "Verificar", "en": "Verify"}, "d": {"es": "fuentes", "en": "sources"}}, {"t": {"es": "Ajustar", "en": "Adjust"}, "d": {"es": "más contexto", "en": "more context"}}]}}, {"n": "1.6", "t": {"es": "Ética y marco normativo", "en": "Ethics and regulatory framework"}, "av": "laura", "body": {"es": "<p>La <b>Recomendación sobre la ética de la IA de la UNESCO (2021)<\/b> promueve principios como proporcionalidad, seguridad, privacidad, transparencia, responsabilidad, equidad y supervisión humana.<\/p><p>En Colombia, el <b>CONPES 4144 de 2025<\/b> adoptó la Política Nacional de Inteligencia Artificial, que orienta el desarrollo y uso ético y responsable de la IA, incluido su uso en el sector público.<\/p><p>La <b>Ley 1581 de 2012<\/b> protege los datos personales: requieren autorización del titular, finalidad legítima y medidas de seguridad. Cargar datos de aprendices o ciudadanos en herramientas no autorizadas puede vulnerar esta ley.<\/p><p>Regla práctica: la IA <b>apoya<\/b>, la persona <b>decide y responde<\/b>. Declare cuándo usó IA en un documento institucional cuando la política de su dependencia lo pida.<\/p>", "en": "<p>UNESCO's <b>Recommendation on the Ethics of AI (2021)<\/b> promotes principles such as proportionality, safety, privacy, transparency, accountability, fairness and human oversight.<\/p><p>In Colombia, <b>CONPES 4144 of 2025<\/b> adopted the National Artificial Intelligence Policy, which guides the ethical and responsible development and use of AI, including its use in the public sector.<\/p><p><b>Law 1581 of 2012<\/b> protects personal data: it requires the data subject's consent, a legitimate purpose and security measures. Uploading trainee or citizen data to unauthorised tools may breach this law.<\/p><p>Rule of thumb: AI <b>supports<\/b>, the person <b>decides and is accountable<\/b>. Disclose AI use in an institutional document when your unit's policy requires it.<\/p>"}, "ex": {"es": "Antes de pedir a la IA un resumen de quejas, Laura reemplaza nombres, cédulas y correos por etiquetas como [NOMBRE] o [DOCUMENTO].", "en": "Before asking AI to summarise complaints, Laura replaces names, IDs and emails with tags such as [NAME] or [ID]."}, "tip": {"es": "Si no publicaría el dato en la cartelera de la sede, no lo pegue en una IA no autorizada.", "en": "If you wouldn't post the data on the office notice board, don't paste it into an unauthorised AI."}, "g": {"type": "cycle", "title": {"es": "principios para el uso responsable", "en": "principles for responsible use"}, "center": {"es": "IA", "en": "AI"}, "center2": {"es": "responsable", "en": "responsible"}, "items": [{"t": {"es": "Privacidad", "en": "Privacy"}, "d": "Ley 1581"}, {"t": {"es": "Transparencia", "en": "Transparency"}, "d": {"es": "declarar uso", "en": "disclose use"}}, {"t": {"es": "Equidad", "en": "Fairness"}, "d": {"es": "sin sesgos", "en": "no bias"}}, {"t": {"es": "Supervisión", "en": "Oversight"}, "d": {"es": "humana", "en": "human"}}, {"t": {"es": "Seguridad", "en": "Safety"}, "d": {"es": "datos seguros", "en": "secure data"}}]}}], "sims": [{"k": "prompt", "t": {"es": "Constructor de prompts", "en": "Prompt builder"}, "d": {"es": "Complete cada componente y observe cómo cambia la calidad estimada del prompt. Luego cópielo y pruébelo en la herramienta autorizada.", "en": "Fill in each component and watch the estimated prompt quality change. Then copy it and try it in the authorised tool."}, "tip": {"es": "Un prompt de 80 o más puntos suele dar respuestas útiles al primer intento.", "en": "A prompt scoring 80+ usually gets useful answers on the first try."}}, {"k": "classifier", "t": {"es": "Clasificador de PQRS (machine learning)", "en": "Request classifier (machine learning)"}, "d": {"es": "Modelo supervisado Naive Bayes entrenado con PQRS ficticias. Escriba una solicitud, vea la probabilidad de cada categoría y enséñele nuevos ejemplos.", "en": "Supervised Naive Bayes model trained on fictitious requests. Type a request, see the probability of each category and teach it new examples."}, "tip": {"es": "Observe cómo cambia la confianza cuando agrega ejemplos: así aprende un modelo supervisado.", "en": "Watch how confidence changes when you add examples: that is how a supervised model learns."}}, {"k": "halluc", "t": {"es": "Cazador de alucinaciones", "en": "Hallucination hunter"}, "d": {"es": "Decida si cada respuesta de la IA es verificable o es una alucinación.", "en": "Decide whether each AI answer is verifiable or a hallucination."}, "tip": {"es": "Las normas, cifras y citas son lo primero que debe verificar.", "en": "Rules, figures and quotes are the first things to verify."}}], "classifier": {"cats": [{"k": "P", "n": {"es": "Petición", "en": "Petition"}, "d": {"es": "Solicitud de información, certificado o trámite.", "en": "Request for information, a certificate or a procedure."}}, {"k": "Q", "n": {"es": "Queja", "en": "Complaint"}, "d": {"es": "Inconformidad con la conducta o atención de una persona.", "en": "Dissatisfaction with someone's conduct or service."}}, {"k": "R", "n": {"es": "Reclamo", "en": "Claim"}, "d": {"es": "Inconformidad por un servicio no prestado o deficiente.", "en": "Dissatisfaction about a service not provided or deficient."}}, {"k": "S", "n": {"es": "Sugerencia", "en": "Suggestion"}, "d": {"es": "Propuesta para mejorar un servicio.", "en": "Proposal to improve a service."}}], "stop": ["para", "por", "que", "los", "las", "del", "con", "una", "uno", "mis", "mas", "pero", "este", "esta", "como", "sus", "the", "and", "for", "with", "from", "that", "this", "have", "has", "not", "was", "are", "you", "your", "sena"], "train": [["Solicito copia de mi certificado de formación del programa técnico", "P"], ["Quisiera saber las fechas de inscripción para cursos complementarios", "P"], ["Necesito información sobre los requisitos para el contrato de aprendizaje", "P"], ["Por favor envíenme la constancia de estudio para mi empresa", "P"], ["Cómo puedo consultar el estado de mi matrícula", "P"], ["Requiero el certificado laboral de mi contrato del año pasado", "P"], ["I request a copy of my training certificate", "P"], ["Please send me information about enrolment dates", "P"], ["El instructor me trató de forma grosera durante la clase", "Q"], ["La funcionaria de atención fue irrespetuosa y no me quiso atender", "Q"], ["El vigilante me gritó en la entrada de la sede", "Q"], ["Me quejo por el mal trato del coordinador con los aprendices", "Q"], ["El asesor fue descortés y me colgó la llamada", "Q"], ["The instructor was rude and disrespectful to me", "Q"], ["The staff member shouted at me at reception", "Q"], ["No me han pagado el apoyo de sostenimiento de este mes", "R"], ["Llevo dos meses esperando el certificado y no ha llegado", "R"], ["La plataforma no funciona y no he podido presentar las evidencias", "R"], ["El curso fue cancelado sin aviso y no me devolvieron el cupo", "R"], ["No han resuelto mi solicitud radicada hace treinta días", "R"], ["Pedí el certificado hace un mes y todavía no me lo entregan", "R"], ["Hace semanas radiqué el documento y todavía no me responden, necesito solución", "R"], ["My support payment has not been paid this month", "R"], ["The platform does not work and I could not submit my work", "R"], ["Sugiero ampliar el horario de la biblioteca en las noches", "S"], ["Sería bueno ofrecer más cursos virtuales de inteligencia artificial", "S"], ["Propongo instalar más puntos de hidratación en la sede", "S"], ["Recomiendo mejorar la señalización de los ambientes de formación", "S"], ["Deberían crear un canal de WhatsApp para informar novedades", "S"], ["I suggest extending the library opening hours", "S"], ["It would be good to offer more virtual courses", "S"]], "samples": [{"es": "Hace tres semanas pedí mi certificado y todavía no me lo entregan, necesito que lo resuelvan", "en": "Three weeks ago I asked for my certificate and still have not received it, please solve it"}, {"es": "Quisiera que abrieran más cursos de Excel en horario nocturno", "en": "I would like you to open more evening Excel courses"}, {"es": "La persona de la ventanilla me habló de manera grosera", "en": "The person at the counter spoke to me rudely"}, {"es": "Necesito saber cuáles son los requisitos para inscribirme en un tecnólogo", "en": "I need to know the requirements to enrol in a technology programme"}]}, "halluc": [{"s": {"es": "La Ley 1581 de 2012 establece las disposiciones generales para la protección de datos personales en Colombia.", "en": "Law 1581 of 2012 sets out the general provisions for personal data protection in Colombia."}, "real": true, "why": {"es": "Es verificable os datos.", "en": "Velocity: how fast data is generated."}}, {"q": {"es": "Hay cédulas mal digitadas que impiden cruzar las bases.", "en": "Mistyped ID numbers prevent joining the databases."}, "a": 3, "fb": {"es": "Veracidad: calidad y confiabilidad de los datos.", "en": "Veracity: data quality and reliability."}}, {"q": {"es": "Se analizan PDF, correos, audios de llamadas y tablas.", "en": "PDFs, emails, call recordings and tables are analysed."}, "a": 2, "fb": {"es": "Variedad: diferentes formatos.", "en": "Variety: different formats."}}, {"q": {"es": "El análisis permitió abrir cursos donde había más demanda laboral.", "en": "The analysis enabled opening courses where labour demand was higher."}, "a": 4, "fb": {"es": "Valor: los datos se convierten en decisiones.", "en": "Value: data becomes decisions."}}, {"q": {"es": "La base histórica tiene más de 20 millones de registros.", "en": "The historical database has over 20 million records."}, "a": 0, "fb": {"es": "Volumen: cantidad de datos.", "en": "Volume: amount of data."}}]}, {"type": "open", "t": {"es": "Mejore el prompt", "en": "Improve the prompt"}, "d": {"es": "Reescriba este prompt débil aplicando rol, contexto, tarea, formato y restricciones: «Hazme un informe de las PQRS».", "en": "Rewrite this weak prompt using role, context, task, format and constraints: “Make me a report on the requests”."}, "ph": {"es": "Escriba aquí su prompt mejorado…", "en": "Write your improved prompt here…"}, "model": {"es": "Actúa como analista de atención al ciudadano del SENA. Te comparto una tabla anonimizada con las PQRS del tercer trimestre de un centro de formación (tipo, tema, días de respuesta). Elabora un informe que identifique los tres temas más frecuentes, el tiempo promedio de respuesta por tipo y los casos que superaron 15 días hábiles. Presenta una tabla resumen y tres recomendaciones en viñetas, en máximo una página. Usa solo los datos de la tabla y señala si falta información.", "en": "Act as a SENA citizen-ser /* ---------- infographics ---------- */
function infographic(g){
  if(!g) return '';
  let h='';
  if(g.type==='flow') h = `<div class="flow">${g.items.map((s,i)=>`<div class="st"><b>${i+1}</b><span>${T(s.t)}</span><small>${T(s.d)}</small></div>`).join('')}</div>`;
  if(g.type==='grid') h = `<div class="igrid">${g.items.map(s=>`<div><b>${T(s.k)}</b><span>${T(s.t)}</span><small>${T(s.d)}</small></div>`).join('')}</div>`;
  if(g.type==='compare') h = `<div class="cmp">${g.cols.map(c=>`<div><b>${T(c.t)}</b><ul>${c.items.map(x=>`<li>${T(x)}</li>`).join('')}</ul></div>`).join('')}</div>`;
  if(g.type==='nested'){
    const n=g.items.length, cols=['#00304D','#007832','#39A900','#9BDB78','#C9EEB4'];
    let s=`<svg class="inf" viewBox="0 0 420 290" role="img">`;
    g.items.forEach((it,i)=>{ s+=`<ellipse cx="210" cy="${150+i*18}" rx="${205-i*42}" ry="${138-i*30}" fill="${cols[i%5]}"/>`; });
    g.items.forEach((it,i)=>{ const y = i==n-1 ? 150+i*18-2 : 150+i*18-(138-i*30)+21; const c = i>=3?'#00304D':'#fff';
      s+=`<text x="210" y="${y}" text-anchor="middle" fill="${c}" font-size="${i==n-1?15:13.5}" font-weight="700">${T(it.t)}</text><text x="210" y="${y+14}" text-anchor="middle" fill="${c}" font-size="10.5">${T(it.d)}</text>`; });
    h = s+'</svg>';
  }
  if(g.type==='cycle'){
    const n=g.items.length, R=105, cx=210, cy=150; let s=`<svg class="inf" viewBox="0 0 420 300" role="img"><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#39A900" stroke-width="3" stroke-dasharray="6 6"/>`;
    s+=`<circle cx="${cx}" cy="${cy}" r="52" fill="#00304D"/><text x="${cx}" y="${cy-2}" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">${T(g.center)}</text><text x="${cx}" y="${cy+15}" text-anchor="middle" fill="#7FD45A" font-size="11">${T(g.center2||'')}</text>`;
    g.items.forEach((it,i)=>{const a=-Math.PI/2+i*2*Math.PI/n, x=cx+R*Math.cos(a), y=cy+R*Math.sin(a);
      s+=`<circle cx="${x}" cy="${y}" r="34" fill="${i%2?'#007832':'#39A900'}"/><text x="${x}" y="${y-2}" text-anchor="middle" fill="#fff" font-size="11.5" font-weight="700">${T(it.t)}</text><text x="${x}" y="${y+12}" text-anchor="middle" fill="#fff" font-size="10">${T(it.d)}</text>`});
    h=s+'</svg>';
  }
  return `<div class="info"><div class="cap">${u('infog')} · ${T(g.title)}</div>${h}</div>`;
}

SIM.classifier = box => {
  const C = D.classifier; let train = C.train.slice();
  const cats = C.cats;
  const tok = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9ñ\s]/g,' ').split(/\s+/).filter(w=>w.length>2 && !C.stop.includes(w));
  const model = () => { const m={cnt:{},w:{},tot:{},voc:new Set()}; cats.forEach(c=>{m.cnt[c.k]=0;m.w[c.k]={};m.tot[c.k]=0});
    train.forEach(([t,c])=>{m.cnt[c]++; tok(t).forEach(w=>{m.w[c][w]=(m.w[c][w]||0)+1;m.tot[c]++;m.voc.add(w)})}); return m; };
  const predict = (m,txt) => { const ws=tok(txt), V=m.voc.size, N=train.length; const lp={};
    cats.forEach(c=>{let s=Math.log((m.cnt[c.k]+1)/(N+cats.length)); ws.forEach(w=>s+=Math.log(((m.w[c.k][w]||0)+1)/(m.tot[c.k]+V))); lp[c.k]=s});
    const mx=Math.max(...Object.values(lp)); let z=0; cats.forEach(c=>{lp[c.k]=Math.exp(lp[c.k]-mx); z+=lp[c.k]}); cats.forEach(c=>lp[c.k]/=z); return {p:lp, known:ws.filter(w=>m.voc.has(w))}; };
  box.innerHTML = `<div class="grid g2"><div><label class="f">${L=='es'?'Escriba o elija una PQRS':'Type or pick a request (PQRS)'}</label><textarea id="c_in"></textarea>
   <div class="row mt">${C.samples.map((s,i)=>`<button class="btn ghost" data-cs="${i}">${L=='es'?'Muestra':'Sample'} ${i+1}</button>`).join('')}</div>
   <div class="row mt"><button class="btn" id="c_go">${I('cpu')} ${L=='es'?'Clasificar':'Classify'}</button></div>
   <h4>${L=='es'?'Enseñe al modelo (aprendizaje supervisado)':'Teach the model (supervised learning)'}</h4>
   <div class="row"><select id="c_lab" style="width:auto">${cats.map(c=>`<option value="${c.k}">${T(c.n)}</option>`).join('')}</select><button class="btn alt" id="c_add">${L=='es'?'Agregar como ejemplo etiquetado':'Add as labelled example'}</button></div>
   <p class="small" id="c_n"></p></div>
   <div><label class="f">${L=='es'?'Predicción del modelo':'Model prediction'}</label><div class="out" id="c_out">—</div><div class="bars mt" id="c_bars"></div><p class="small" id="c_words"></p></div></div>`;
  const run = () => { const m=model(); const txt=document.getElementById('c_in').value; if(!txt.trim()) return; const r=predict(m,txt);
    const best=cats.reduce((a,c)=>r.p[c.k]>r.p[a.k]?c:a);
    document.getElementById('c_out').innerHTML = `<b style="font-size:20px">${T(best.n)}</b> · ${(r.p[best.k]*100).toFixed(0)}% ${L=='es'?'de confianza':'confidence'}<br><span class="small">${T(best.d)}</span>`;
    document.getElementById('c_bars').innerHTML = cats.map(c=>`<div class="b"><span>${T(c.n)}</span><div><i style="width:${r.p[c.k]*100}%;background:${c.k==best.k?'var(--sena)':'var(--muted)'}"></i></div><span>${(r.p[c.k]*100).toFixed(0)}%</span></div>`).join('');
    document.getElementById('c_words').innerHTML = (L=='es'?'Palabras que el modelo reconoció: ':'Words the model recognised: ') + (r.known.map(w=>`<mark>${w}</mark>`).join(' ')||'—') + (r.p[best.k]<.55?`<br><span class="warnc">${L=='es'?'Confianza baja: un humano debe revisar.':'Low confidence: a human should review.'}</span>`:''); };
  const cnt = () => document.getElementById('c_n').textContent = (L=='es'?'Ejemplos de entrenamiento: ':'Training examples: ')+train.length;
  box.querySelectorAll('[data-cs]').forEach(b=>b.onclick=()=>{document.getElementById('c_in').value=T(C.samples[+b.dataset.cs]); run();});
  document.getElementById('c_go').onclick=run;
  document.getElementById('c_add').onclick=()=>{const t=document.getElementById('c_in').value.trim(); if(!t) return; train.push([t,document.getElementById('c_lab').value]); cnt(); run();};
  cnt();
};
SIM.halluc = box => {
  const H = D.halluc; let i=0, pts=0, done=false;
  const draw = () => { if(i>=H.length){ box.innerHTML=`<div class="score">${pts}/${H.length}</div><p>${D.hallucLabels?T(D.hallucLabels.end):(L=='es'?'Recuerde: la IA puede sonar segura aunque se equivoque. Verifique siempre en fuentes oficiales.':'Remember: AI can sound confident even when wrong. Always verify with official sources.')}</p><button class="btn" id="h_r">${u('tryagain')}</button>`; document.getElementById('h_r').onclick=()=>{i=0;pts=0;draw();}; return; }
    const h=H[i]; done=false;
    box.innerHTML = `<div class="small">${i+1} / ${H.length}</div><div class="tip" style="margin-top:6px">${avatar('bot')}<div class="bub" style="font-size:15.5px"><b>${D.hallucLabels?T(D.hallucLabels.head):(L=='es'?'Respuesta de la IA':'AI answer')}</b>${T(h.s)}</div></div>
     <div class="row mt"><button class="btn" data-h="1">${D.hallucLabels?T(D.hallucLabels.yes):(L=='es'?'Es verificable / real':'Verifiable / real')}</button><button class="btn alt" data-h="0">${D.hallucLabels?T(D.hallucLabels.no):(L=='es'?'Es una alucinación':'It is a hallucination')}</button></div><div id="h_fb" class="mt"></div>`;
    box.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{ if(done) return; done=true; const ok=(+b.dataset.h===1)===h.real; if(ok) pts++;
      document.getElementById('h_fb').innerHTML=`<div class="out"><span class="${ok?'okc':'badc'}">${ok?u('right'):(L=='es'?'No es así.':'Not quite.')}</span> ${T(h.why)}</div><div class="row mt"><button class="btn" id="h_n">${u('next')} →</button></div>`;
      document.getElementById('h_n').onclick=()=>{i++;draw();}; }); };
  draw();
};
SIM.anon = box => {

  const go = () => { let t=document.getElementById('a_in').value; const c={id:0,mail:0,tel:0,dir:0,name:0};
    t=t.replace(/[\w.+-]+@[\w-]+\.[\w.]+/g,()=>{c.mail++;return '[CORREO]'});

    t=t.replace(/\b\d{1,3}(?:\.\d{3}){2,3}\b|\b\d{7,10}\b/g,()=>{c.id++;return '[DOCUMENTO]'});
    t=t.replace(/\b(?:Calle|Carrera|Cra\.?|Cl\.?|Avenida|Av\.?|Diagonal|Transversal|Kr\.?)\s*\d+[A-Za-z]?\s*(?:#|No\.?|N°)\s*\d+[A-Za-z]?\s*-\s*\d+/gi,()=>{c.dir++;return '[DIRECCIÓN]'});

    document.getElementById('a_out').innerHTML = t.replace(/\[(.*?)\]/g,'<mark>[$1]</mark>');

SIM.clear = box => {
  box.innerHTML = `<div class="grid g2"><div><label class="f">${L=='es'?'Pegue un párrafo de respuesta u oficio':'Paste a reply or letter paragraph'}</label><textarea id="l_in" style="min-height:190px">${T(D.clearSample)}</textarea>

   <div><label class="f">${L=='es'?'Índice de lenguaje claro':'Plain-language index'}</label><div class="meter"><i id="l_m"></i></div><p id="l_s"></p><div class="out" id="l_out"></div></div></div>`;
  const go = () => { const t=document.getElementById('l_in').value; const sents=t.split(/[.!?;]+/).map(s=>s.trim()).filter(Boolean);
    const words=t.split(/\s+/).filter(Boolean); const avg=sents.length?words.length/sents.length:0;
    const found=D.jargon.filter(j=>t.toLowerCase().includes(j.f.toLowerCase()));
    const long=sents.filter(s=>s.split(/\s+/).length>30).length;
    let sc=100 - Math.max(0,(avg-20))*2 - found.length*8 - long*6; sc=Math.max(0,Math.min(100,Math.round(sc)));
    const m=document.getElementById('l_m'); m.style.width=sc+'%'; m.style.background= sc<50?'var(--bad)':sc<75?'var(--warn)':'var(--sena)';
    document.getElementById('l_s').innerHTML = `<b>${sc}/100</b> · ${L=='es'?'Promedio':'Average'} ${avg.toFixed(0)} ${L=='es'?'palabras por oración':'words per sentence'} · ${long} ${L=='es'?'oraciones de más de 30 palabras':'sentences over 30 words'}`;
    document.getElementById('l_out').innerHTML = found.length? `<b>${L=='es'?'Expresiones para simplificar':'Expressions to simplify'}:</b><br>`+found.map(j=>`<mark>${j.f}</mark> → <b>${T(j.r)}</b>`).join('<br>') : `<span class="okc">${L=='es'?'No se detectaron expresiones rebuscadas.':'No convoluted expressions detected.'}</span>`; };
  document.getElementById('l_go').onclick=go; go();
};

SIM.sqlsim = box => {
  const Q = D.sql; const cats=Q.cols.filter(c=>c.type==='cat'), nums=Q.cols.filter(c=>c.type==='num');
  const opt=(arr,id)=>`<select id="${id}">${arr.map(c=>`<option value="${c.k}">${T(c.t)}</option>`).join('')}</select>`;
  box.innerHTML = `<div class="grid g2"><div>
   <label class="f">${L=='es'?'Agrupar por':'Group by'}</label>${opt(cats,'q_g')}
   <label class="f">${L=='es'?'Medida':'Measure'}</label>${opt(nums,'q_m')}
   <label class="f">${L=='es'?'Función':'Function'}</label><select id="q_a"><option value="SUM">SUM · ${L=='es'?'suma':'sum'}</option><option value="AVG">AVG · ${L=='es'?'promedio':'average'}</option><option value="COUNT">COUNT · ${L=='es'?'conteo':'count'}</option><option value="MAX">MAX · ${L=='es'?'máximo':'maximum'}</option></select>
   <label class="f">${L=='es'?'Filtro (WHERE)':'Filter (WHERE)'}</label><div class="row">${opt([{k:'',t:{es:'(sin filtro)',en:'(no filter)'}},...cats],'q_fc')}<select id="q_fv"></select></div>
   <div class="tw mt"><table><thead><tr>${Q.cols.map(c=>`<th>${c.k}</th>`).join('')}</tr></thead><tbody>${Q.rows.slice(0,6).map(r=>`<tr>${Q.cols.map(c=>`<td>${r[c.k]}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small">${L=='es'?'Primeras 6 de':'First 6 of'} ${Q.rows.length} ${L=='es'?'filas de la tabla':'table rows'} <b>${Q.table}</b> (${L=='es'?'datos ficticios':'fictitious data'}).</p></div>
   <div><label class="f">SQL</label><div class="out" id="q_sql" style="font-family:Consolas,monospace;font-size:13px"></div><label class="f">R · dplyr</label><div class="out" id="q_r" style="font-family:Consolas,monospace;font-size:13px"></div>
   <label class="f">${L=='es'?'Resultado':'Result'}</label><div class="bars" id="q_res"></div></div></div>`;
  const fv=()=>{ const c=document.getElementById('q_fc').value; const s=document.getElementById('q_fv'); s.innerHTML = c? [...new Set(Q.rows.map(r=>r[c]))].map(v=>`<option>${v}</option>`).join('') : ''; s.style.display=c?'':'none'; };
  const go=()=>{ const g=document.getElementById('q_g').value, m=document.getElementById('q_m').value, a=document.getElementById('q_a').value, fc=document.getElementById('q_fc').value, fval=document.getElementById('q_fv').value;
    let rows=Q.rows.filter(r=>!fc||String(r[fc])===fval); const grp={};
    rows.forEach(r=>{(grp[r[g]]=grp[r[g]]||[]).push(+r[m]);});
    const res=Object.entries(grp).map(([k,v])=>[k, a==='SUM'?v.reduce((x,y)=>x+y,0):a==='AVG'?v.reduce((x,y)=>x+y,0)/v.length:a==='COUNT'?v.length:Math.max(...v)]).sort((x,y)=>y[1]-x[1]);
    const mx=Math.max(1,...res.map(r=>r[1]));
    const w = fc?`\nWHERE ${fc} = '${fval}'`:'';
    document.getElementById('q_sql').textContent=`SELECT ${g}, ${a}(${a==='COUNT'?'*':m}) AS resultado\nFROM ${Q.table}${w}\nGROUP BY ${g}\nORDER BY resultado DESC;`;
    const rf={SUM:'sum',AVG:'mean',COUNT:'n',MAX:'max'}[a];
    document.getElementById('q_r').textContent=`${Q.table} |>\n${fc?`  filter(${fc} == "${fval}") |>\n`:''}  group_by(${g}) |>\n  summarise(resultado = ${a==='COUNT'?'n()':rf+'('+m+')'}) |>\n  arrange(desc(resultado))`;
    document.getElementById('q_res').innerHTML = res.map(r=>`<div class="b"><span>${r[0]}</span><div><i style="width:${r[1]/mx*100}%"></i></div><span>${(+r[1]).toLocaleString(L=='es'?'es-CO':'en-US',{maximumFractionDigits:1})}</span></div>`).join('') || '—'; };
  ['q_g','q_m','q_a','q_fv'].forEach(id=>document.getElementById(id).onchange=go);
  document.getElementById('q_fc').onchange=()=>{fv();go();}; fv(); go();
};
SIM.radar = box => {
  const RD = D.radar; const sel = RD.techs.map(t=>t.def??2);
  box.innerHTML = `<div class="grid g2"><div class="tw"><table><thead><tr><th>${L=='es'?'Tecnología':'Technology'}</th><th>${L=='es'?'Anillo':'Ring'}</th></tr></thead><tbody>${RD.techs.map((t,i)=>`<tr><td><b>${T(t.t)}</b><div class="small">${T(t.d)}</div></td><td><select data-rd="${i}">${RD.rings.map((r,j)=>`<option value="${j}" ${j==sel[i]?'selected':''}>${T(r)}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div><div id="rd_svg"></div></div>`;
  const draw = () => { const W=420,H=420,cx=210,cy=210, R=[200,150,100,50], cols=['#39A900','#007832','#00476F','#00304D'];
    let s=`<svg class="inf" viewBox="0 0 ${W} ${H}">`;
    R.forEach((r,j)=>{ s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${cols[3-j]}" opacity="${0.12+j*0.08}" stroke="var(--line)"/>`; });
    RD.rings.forEach((r,j)=>{ s+=`<text x="${cx}" y="${cy-R[3-j]+16}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${T(r)}</text>`; });
    const n=RD.techs.length;
    RD.techs.forEach((t,i)=>{ const ring=sel[i]; const rin= ring==0?0:R[4-ring], rout=R[3-ring]; const rr=(rin+rout)/2+ (i%2?6:-6); const a=-Math.PI/2+ (i+0.5)*2*Math.PI/n;
      const x=cx+rr*Math.cos(a), y=cy+rr*Math.sin(a); s+=`<circle cx="${x}" cy="${y}" r="11" fill="#39A900" stroke="#fff" stroke-width="2"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">${i+1}</text>`; });
    s+='</svg>'; document.getElementById('rd_svg').innerHTML = s + `<div class="small">${RD.techs.map((t,i)=>`<b>${i+1}</b> ${T(t.t)}`).join(' · ')}</div>`; };
  box.querySelectorAll('[data-rd]').forEach(x=>x.onchange=()=>{sel[+x.dataset.rd]=+x.value;draw();}); draw();
};
SIM.equation = box => {
  const E0=D.equation;
  box.innerHTML = `<div class="grid g2"><div>
   <label class="f">${L=='es'?'Concepto A y sinónimos (separados por coma)':'Concept A and synonyms (comma separated)'}</label><input type="text" id="eq_a" value="${T(E0.a)}">
   <label class="f">${L=='es'?'Concepto B y sinónimos':'Concept B and synonyms'}</label><input type="text" id="eq_b" value="${T(E0.b)}">
   <label class="f">${L=='es'?'Excluir (opcional)':'Exclude (optional)'}</label><input type="text" id="eq_c" value="${T(E0.c)}"></div>
   <div><label class="f">${L=='es'?'Ecuación de búsqueda':'Search string'}</label><div class="out" id="eq_o" style="font-family:Consolas,monospace;font-size:13.5px"></div>
   <label class="f">${L=='es'?'Buscar en':'Search in'}</label><div class="row" id="eq_l"></div><p class="small">${L=='es'?'Cada base tiene su sintaxis: ajuste la ecuación si es necesario.':'Each database has its own syntax: adjust the string if needed.'}</p></div></div>`;
  const grp = s => { const t=s.split(',').map(x=>x.trim()).filter(Boolean).map(x=>x.includes(' ')?`"${x}"`:x); return t.length>1?`(${t.join(' OR ')})`:(t[0]||''); };
  const go = () => { const a=grp(document.getElementById('eq_a').value), b=grp(document.getElementById('eq_b').value), c=grp(document.getElementById('eq_c').value);
    const q=[a,b].filter(Boolean).join(' AND ') + (c?` NOT ${c}`:'');
    document.getElementById('eq_o').textContent=q||'—'; const enc=encodeURIComponent(q);
    document.getElementById('eq_l').innerHTML=[['Google Scholar',`https://scholar.google.com/scholar?q=${enc}`],['Lens.org',`https://www.lens.org/lens/search/scholar/list?q=${enc}`],['Google Patents',`https://patents.google.com/?q=${enc}`]].map(x=>`<a class="btn alt" style="text-decoration:none" target="_blank" rel="noopener" href="${x[1]}">${I('ext')} ${x[0]}</a>`).join(''); };
  ['eq_a','eq_b','eq_c'].forEach(id=>document.getElementById(id).oninput=go); go();
};
SIM.scenarios = box => {
  const S0=D.scen;
  const f=(id,v,l)=>`<label class="f">${l}</label><input type="text" id="${id}" value="${T(v)}">`;
  box.innerHTML = `<div class="grid g2"><div>${f('sc_x',S0.x,L=='es'?'Incertidumbre 1 (eje horizontal)':'Uncertainty 1 (horizontal axis)')}<div class="grid g2">${f('sc_x0',S0.x0,L=='es'?'Extremo bajo':'Low end')}${f('sc_x1',S0.x1,L=='es'?'Extremo alto':'High end')}</div>
   ${f('sc_y',S0.y,L=='es'?'Incertidumbre 2 (eje vertical)':'Uncertainty 2 (vertical axis)')}<div class="grid g2">${f('sc_y0',S0.y0,L=='es'?'Extremo bajo':'Low end')}${f('sc_y1',S0.y1,L=='es'?'Extremo alto':'High end')}</div>
   <div class="grid g2">${S0.q.map((q,i)=>f('sc_q'+i,q,(L=='es'?'Nombre del escenario ':'Scenario name ')+(i+1))).join('')}</div></div><div id="sc_o"></div></div>`;
  const v=id=>document.getElementById(id).value;
  const go=()=>{ const q=[0,1,2,3].map(i=>v('sc_q'+i));
    const cell=(t,sub,c)=>`<div style="background:${c};color:#fff;border-radius:12px;padding:12px;min-height:110px"><b>${t}</b><div style="font-size:12.5px;opacity:.9;margin-top:6px">${sub}</div></div>`;
    document.getElementById('sc_o').innerHTML=`<div class="small" style="text-align:center"><b>${v('sc_y')}</b>: ${v('sc_y1')} ↑</div>
     <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0">${cell(q[0],v('sc_x0')+' + '+v('sc_y1'),'#007832')}${cell(q[1],v('sc_x1')+' + '+v('sc_y1'),'#39A900')}${cell(q[2],v('sc_x0')+' + '+v('sc_y0'),'#00304D')}${cell(q[3],v('sc_x1')+' + '+v('sc_y0'),'#00476F')}</div>
     <div class="small" style="display:flex;justify-content:space-between"><span>← ${v('sc_x0')}</span><b>${v('sc_x')}</b><span>${v('sc_x1')} →</span></div><div class="small" style="text-align:center">${v('sc_y0')} ↓</div>`; };
  box.querySelectorAll('input').forEach(x=>x.oninput=go); go();
};
SIM.gap = box => {
  const G0=D.gap;
  box.innerHTML = `<div class="grid g2"><div>${G0.domains.map((d,i)=>`<div class="card" style="padding:12px;margin-bottom:8px"><b>${T(d.t)}</b><div class="small">${T(d.d)}</div>
    <div class="row"><span class="small" style="width:70px">AS-IS</span><input type="range" min="1" max="5" value="${d.a||2}" data-ga="${i}" style="flex:1;accent-color:#00304D"><span class="small" style="width:70px;text-align:right">TO-BE</span><input type="range" min="1" max="5" value="${d.b||4}" data-gb="${i}" style="flex:1;accent-color:#39A900"></div></div>`).join('')}</div>
    <div><label class="f">${L=='es'?'Brechas por dominio (1 = inicial, 5 = optimizado)':'Gaps by domain (1 = initial, 5 = optimised)'}</label><div id="g_o"></div><div class="out mt" id="g_p"></div></div></div>`;
  const go=()=>{ const r=G0.domains.map((d,i)=>({t:T(d.t),a:+box.querySelector(`[data-ga="${i}"]`).value,b:+box.querySelector(`[data-gb="${i}"]`).value}));
    document.getElementById('g_o').innerHTML=r.map(x=>`<div style="margin:10px 0"><div class="small"><b>${x.t}</b> · AS-IS ${x.a} → TO-BE ${x.b} · ${L=='es'?'brecha':'gap'} <b>${Math.max(0,x.b-x.a)}</b></div>
      <div style="position:relative;height:14px;background:var(--line);border-radius:9px"><i style="position:absolute;left:0;top:0;bottom:0;width:${x.a/5*100}%;background:#00304D;border-radius:9px"></i><i style="position:absolute;left:${x.a/5*100}%;top:0;bottom:0;width:${Math.max(0,x.b-x.a)/5*100}%;background:#39A900;border-radius:0 9px 9px 0"></i></div></div>`).join('');
    const pr=r.filter(x=>x.b>x.a).sort((p,q)=>(q.b-q.a)-(p.b-p.a));
    document.getElementById('g_p').innerHTML=`<b>${L=='es'?'Prioridad sugerida para la hoja de ruta':'Suggested roadmap priority'}</b><ol class="list">${pr.map(x=>`<li>${x.t} (${L=='es'?'brecha':'gap'} ${x.b-x.a})</li>`).join('')||'<li>—</li>'}</ol>`; };
  box.querySelectorAll('input').forEach(x=>x.oninput=go); go();
};

/* ---------- shell ---------- */
function render(){
  document.documentElement.lang = L;
  document.title = T(D.meta.title) + ' · ' + T(D.meta.code);
  document.getElementById('bCode').textContent = T(D.meta.code);
  document.getElementById('bTitle').textContent = T(D.meta.short);
  document.getElementById('tTitle').innerHTML = `${T(D.meta.title)}<small>${T(D.meta.event)}</small>`;
  document.getElementById('sfoot').innerHTML = `${T(D.meta.event)}<br>${T(D.meta.instructor)} · ${T(D.meta.center)}`;
  document.getElementById('nav').innerHTML = SECTIONS.map(([k,ic])=>`<button data-go="${k}" class="${k==current?'on':''} ${seen[k]?'seen':''}">${I(ic)} ${u(k)}<span class="dot"></span></button>`).join('');
  document.getElementById('content').innerHTML = `<section class="pane on">${R[current]()}</section>`;
  const dark = document.documentElement.getAttribute('data-theme')==='dark' || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  document.getElementById('themeBtn').innerHTML = dark? I('sun')+' '+u('light') : I('moon')+' '+u('dark');
  document.getElementById('langBtn').innerHTML = I('globe') + (L=='es'?' English':' Español');
  const n=SECTIONS.length, v=SECTIONS.filter(([k])=>seen[k]).length;
  document.getElementById('pbar').style.width = (v/n*100)+'%';
  document.getElementById('ptxt').textContent = `${Math.round(v/n*100)}% ${u('prog')}`;
  bind();
}
function bind(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{subTab=+b.dataset.sub;render();window.scrollTo(0,0)});
  document.querySelectorAll('[data-sim]').forEach(b=>b.onclick=()=>{simTab=+b.dataset.sim;render()});
  const sb=document.getElementById('simBox'); if(sb) SIM[D.sims[simTab].k](sb);
  document.querySelectorAll('[data-q]').forEach(o=>o.onclick=()=>{const qi=+o.dataset.q, oi=+o.dataset.o; if(quizState[qi]) return; quizState[qi]={c:oi,ok:oi==D.quiz[qi].a}; const y=window.scrollY; render(); window.scrollTo(0,y);});
  const qr=document.getElementById('qreset'); if(qr) qr.onclick=()=>{quizState={};render();};
  document.querySelectorAll('[data-step]').forEach(c=>c.onchange=()=>{stepsDone[c.dataset.step]=c.checked; save('ova_steps_'+D.meta.id,stepsDone); const y=window.scrollY; render(); window.scrollTo(0,y);});
  document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>{const el=document.getElementById('model'+b.dataset.model); el.classList.toggle('hide'); b.textContent=el.classList.contains('hide')?u('show'):u('hide');});
  document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{const ei=+b.dataset.check, e=D.exercises[ei]; let ok=0;
    e.items.forEach((it,ii)=>{const s=document.querySelector(`select[data-ex="${ei}"][data-it="${ii}"]`); const r=document.getElementById(`r${ei}_${ii}`); const good= s.value!=='' && +s.value===it.a; if(good) ok++;
      r.innerHTML = s.value===''?'':(good?`<span class="okc">✓</span>`:`<span class="badc">✗ ${T(e.opts[it.a])}</span>`); document.getElementById(`fb${ei}_${ii}`).classList.remove('hide');});
    document.getElementById('es'+ei).innerHTML=`<b>${ok}/${e.items.length}</b> ${L=='es'?'aciertos':'correct'}`;});
  const gs=document.getElementById('gsearch'); if(gs) gs.oninput=()=>document.getElementById('glist').innerHTML=glo(gs.value);
}
function go(k){ current=k; seen[k]=true; save('ova_seen_'+D.meta.id,seen); render(); window.scrollTo(0,0); }
document.getElementById('langBtn').onclick=()=>{ L = L=='es'?'en':'es'; try{localStorage.setItem('ova_lang',L)}catch(e){} render(); };
document.getElementById('themeBtn').onclick=()=>{ const r=document.documentElement; const dark = r.getAttribute('data-theme')==='dark' || (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  r.setAttribute('data-theme', dark?'light':'dark'); try{localStorage.setItem('ova_theme',dark?'light':'dark')}catch(e){} render(); };
try{ const th=localStorage.getItem('ova_theme'); if(th) document.documentElement.setAttribute('data-theme',th);}catch(e){}
seen.home=true;
function fromHash(){ const h=(location.hash||'').slice(1); if(!h) return false; const m=/^sub(\d+)$/.exec(h); const m2=/^sim(\d+)$/.exec(h);
  if(m){ subTab=Math.min(D.subtopics.length-1,+m[1]-1); current='sub'; }
  else if(m2){ simTab=Math.min(D.sims.length-1,+m2[1]-1); current='sim'; }
  else if(SECTIONS.some(([k])=>k===h)) current=h; else return false;
  seen[current]=true; return true; }
fromHash(); render();
window.addEventListener('hashchange',()=>{ if(fromHash()){ render(); window.scrollTo(0,0);} });
</script>
