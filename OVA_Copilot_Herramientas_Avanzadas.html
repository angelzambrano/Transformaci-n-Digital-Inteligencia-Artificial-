<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copilot y herramientas digitales avanzadas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sena:#39A900; --sena2:#007832; --navy:#00304D; --sena-soft:#E8F5DF;
  --bg:#F4F7F5; --panel:#FFFFFF; --panel2:#F8FAF9; --ink:#14212B; --muted:#5B6B76; --line:#E1E8E4;
  --accent:#00304D; --chip:#EEF4F0; --shadow:0 1px 2px rgba(0,48,77,.06),0 6px 20px rgba(0,48,77,.06);
  --ok:#2E8B16; --bad:#C62828; --warn:#C77700; --link:#007832; --nv:#00304D;
}
:root:not([data-theme="light"]){color-scheme:light}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1620; --panel:#112230; --panel2:#0E1D29; --ink:#E7EEF2; --muted:#9DB0BC; --line:#1F3546;
    --accent:#7FD45A; --chip:#173042; --sena-soft:#16331F; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --ok:#6BCB45; --bad:#FF6B6B; --warn:#F2B44A; --link:#7FD45A; --nv:#1F6A99; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1620; --panel:#112230; --panel2:#0E1D29; --ink:#E7EEF2; --muted:#9DB0BC; --line:#1F3546;
  --accent:#7FD45A; --chip:#173042; --sena-soft:#16331F; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --ok:#6BCB45; --bad:#FF6B6B; --warn:#F2B44A; --link:#7FD45A; --nv:#1F6A99; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Work Sans",Calibri,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15.5px;line-height:1.55}
a{color:var(--link);font-weight:500}
svg{width:1.05em;height:1.05em;vertical-align:-.15em;flex:none}
svg.inf{width:100%;height:auto}
button{font-family:inherit}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--navy);color:#fff;position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;gap:12px;align-items:center;padding:4px 6px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand img{width:46px;height:46px;border-radius:10px;flex:none}
.brand b{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#A9E58A}
.brand span{font-size:13px;opacity:.85;line-height:1.3;display:block}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#D6E3EA;padding:9px 10px;border-radius:9px;font-size:14px;cursor:pointer}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:var(--sena);color:#fff;font-weight:600}
.nav button .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:transparent}
.nav button.seen .dot{background:#A9E58A}
.nav button.on .dot{background:#fff}
.nav svg{width:18px;height:18px;flex:none}
.side .foot{margin-top:auto;font-size:12px;opacity:.7;line-height:1.4;padding:8px 6px}
/* main */
.main{min-width:0}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 28px}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.prog{width:160px;flex:none}
.prog .bar{height:7px;background:var(--line);border-radius:9px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--sena);width:0;transition:width .4s}
.prog small{font-size:11.5px;color:var(--muted)}
.tog{display:flex;gap:6px;flex:none}
.tog button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.tog button:hover{border-color:var(--sena)}
.tog svg{width:16px;height:16px}
.content{padding:26px 28px 60px;max-width:1240px}
section.pane{display:none;animation:fade .35s ease}
section.pane.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2.sec{font-size:26px;margin:0 0 4px;letter-spacing:-.02em;font-weight:700}
p.lead{color:var(--muted);margin:0 0 22px;max-width:820px}
h3{font-size:18px;margin:0 0 8px;font-weight:700}
h4{font-size:15px;margin:14px 0 6px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mt{margin-top:16px}.mt2{margin-top:26px}
.hero{background:linear-gradient(120deg,var(--navy) 0%,#00476F 55%,var(--sena2) 100%);color:#fff;border-radius:20px;padding:28px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;overflow:hidden;position:relative}
.hero h2{font-size:30px;margin:4px 0 8px;letter-spacing:-.02em;line-height:1.15}
.hero p{margin:0;opacity:.9;max-width:640px}
.hero .tag{display:inline-block;background:var(--sena);padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.hero svg.av{width:150px;height:150px}
.kpi{display:flex;gap:14px;align-items:center}
.kpi .ic{width:46px;height:46px;border-radius:12px;background:var(--sena-soft);color:var(--sena2);display:grid;place-items:center;flex:none}
:root[data-theme="dark"] .kpi .ic{color:#7FD45A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kpi .ic{color:#7FD45A}}
.kpi .ic svg{width:24px;height:24px}
.kpi b{font-size:24px;display:block;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--ink)}
.chip.g{background:var(--sena);color:#fff}
.chip.n{background:var(--navy);color:#fff}
.list{margin:0;padding-left:20px}.list li{margin:4px 0}
/* subtopic */
.sub{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.sub .num{font-size:12px;font-weight:700;color:var(--sena);letter-spacing:.08em;text-transform:uppercase}
.ex{border-left:4px solid var(--sena);background:var(--panel2);border-radius:0 12px 12px 0;padding:12px 14px;margin-top:12px;font-size:14.5px}
.ex b{color:var(--sena2)}
:root[data-theme="dark"] .ex b{color:#7FD45A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ex b{color:#7FD45A}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:7px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.tabs button.on{background:var(--nv);border-color:var(--nv);color:#fff}
/* infographics */
.info{background:var(--panel2);border:1px dashed var(--line);border-radius:14px;padding:14px}
.info .cap{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.flow .st{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;position:relative}
.flow .st b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sena);color:#fff;margin:0 auto 6px;font-size:14px}
.flow .st:nth-child(even) b{background:var(--navy)}
.flow .st span{font-size:13px;font-weight:600;display:block;line-height:1.3}
.flow .st small{font-size:12px;color:var(--muted);display:block;margin-top:3px;line-height:1.3}
.igrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.igrid div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.igrid b{font-size:22px;color:var(--sena);display:block;line-height:1}
.igrid span{font-weight:700;font-size:13.5px;display:block;margin-top:4px}
.igrid small{font-size:12px;color:var(--muted);line-height:1.3;display:block}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp>div{border-radius:12px;padding:12px;background:var(--panel);border:1px solid var(--line)}
.cmp>div:first-child{border-top:4px solid var(--navy)}.cmp>div:last-child{border-top:4px solid var(--sena)}
.cmp ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}
svg.inf{width:100%;height:auto;display:block}
svg.inf text{font-family:"Work Sans",sans-serif}
/* avatar tip */
.tip{display:flex;gap:12px;align-items:flex-start;margin-top:14px}
.tip svg{width:54px;height:54px;flex:none}
.tip .bub{background:var(--sena-soft);border-radius:4px 14px 14px 14px;padding:10px 13px;font-size:14px}
.tip .bub b{display:block;font-size:12px;color:var(--sena2);letter-spacing:.04em}
:root[data-theme="dark"] .tip .bub b{color:#7FD45A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tip .bub b{color:#7FD45A}}
/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--panel)}
th{background:var(--navy);color:#fff;text-align:left;padding:10px 12px;font-weight:600;font-size:13px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:var(--panel2)}
/* forms */
label.f{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input[type=text],textarea,select{width:100%;font-family:inherit;font-size:14.5px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;padding:9px 11px}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--sena);border-color:transparent}
.btn{border:0;background:var(--sena);color:#fff;font-weight:700;border-radius:10px;padding:9px 16px;cursor:pointer;font-size:14px;display:inline-flex;gap:7px;align-items:center}
.btn.alt{background:var(--nv)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.07)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.meter{height:12px;background:var(--line);border-radius:9px;overflow:hidden}
.meter i{display:block;height:100%;transition:width .35s,background .35s}
.out{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;white-space:pre-wrap;min-height:60px}
.okc{color:var(--ok);font-weight:700}.badc{color:var(--bad);font-weight:700}.warnc{color:var(--warn);font-weight:700}
.bars .b{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bars .b div{height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.bars .b i{display:block;height:100%;background:var(--sena)}
.opt{display:block;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:6px 0;cursor:pointer;background:var(--panel)}
.opt:hover{border-color:var(--sena)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--panel))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel))}
.fb{font-size:13.5px;margin-top:6px}
.vid{display:block;text-decoration:none;color:inherit;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);transition:transform .2s}
.vid:hover{transform:translateY(-3px)}
.vid .th{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,var(--navy),var(--sena2));display:grid;place-items:center;color:#fff}
.vid .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid .th .pl{position:relative;width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center}
.vid .th .pl svg{width:24px;height:24px;margin-left:3px}
.vid .th .lg{position:absolute;top:8px;left:8px;background:var(--sena);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
.vid .bd{padding:10px 12px}
.vid .bd b{font-size:14px;display:block;line-height:1.3}
.vid .bd small{color:var(--muted);font-size:12.5px}
.step{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .n{width:40px;height:40px;border-radius:12px;background:var(--nv);color:#fff;display:grid;place-items:center;font-weight:800}
.step.done .n{background:var(--sena)}
.step .tm{font-size:12px;font-weight:700;color:var(--sena2);text-transform:uppercase;letter-spacing:.05em}
:root[data-theme="dark"] .step .tm{color:#7FD45A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .step .tm{color:#7FD45A}}
.step ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.timeline{display:flex;height:16px;border-radius:9px;overflow:hidden;margin:10px 0 4px}
.timeline i{display:block;height:100%}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.gl div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.gl b{color:var(--sena2)}
:root[data-theme="dark"] .gl b{color:#7FD45A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gl b{color:#7FD45A}}
.gl p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.res{display:flex;gap:12px;align-items:flex-start}
.res .ic{width:38px;height:38px;border-radius:10px;background:var(--nv);color:#fff;display:grid;place-items:center;flex:none}
.res .ic svg{width:20px;height:20px}
code{background:var(--chip);padding:1px 6px;border-radius:6px;font-size:.88em;font-family:Consolas,monospace}
mark{background:#FFE58F;color:#000;border-radius:4px;padding:0 3px}
.score{font-size:40px;font-weight:800;color:var(--sena)}
.small{font-size:13px;color:var(--muted)}
.hide{display:none!important}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:column}
  .nav{flex-direction:row;overflow:auto;gap:4px;padding-bottom:4px}
  .nav button{white-space:nowrap;width:auto}
  .side .foot{display:none}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sub{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}.hero svg.av{display:none}
}
@media (max-width:620px){
  .content{padding:18px 16px 50px}.top{padding:10px 16px;flex-wrap:wrap}
  .prog{order:3;width:100%}
  .g2,.g3,.g4,.cmp{grid-template-columns:1fr}
  .hero h2{font-size:24px}
}
</style>
</head>

const D = {"meta": {"id": "ova3", "code": {"es": "OVA 3 · Tema 3", "en": "OVA 3 · Topic 3"}, "short": {"es": "Copilot y herramientas digitales avanzadas", "en": "Copilot and advanced digital tools"}, "title": {"es": "Copilot y herramientas digitales avanzadas", "en": "Copilot and advanced digital tools"}, "event": {"es": "EDT Transformación Digital, IA e Innovación Tecnológica", "en": "TDE Digital Transformation, AI and Technological Innovation"}, "when": {"es": "Día 2 · Miércoles 4 de noviembre de 2026 · 7:30 – 11:45 a.m.", "en": "Day 2 · Wednesday, November 4, 2026 · 7:30 – 11:45 a.m."}, "intro": {"es": "Aprenda a usar Microsoft Copilot en Word, Outlook, Excel, PowerPoint y Teams, y a elegir otras herramientas avanzadas para producir y analizar información más rápido y con mejor calidad.", "en": "Learn to use Microsoft Copilot in Word, Outlook, Excel, PowerPoint and Teams, and to choose other advanced tools to produce and analyse information faster and better."}, "hours": {"es": "4 horas · Taller de 1 h 45 min", "en": "4 hours · 1 h 45 min workshop"}, "instructor": {"es": "Instructor: José Andrés Zambrano", "en": "Instructor: José Andrés Zambrano"}, "center": {"es": "Centro de Diseño y Metrología – SENA", "en": "Centro de Diseño y Metrología – SENA"}}, "kpis": [{"icon": "layers", "v": "6", "l": {"es": "subtemas", "en": "subtopics"}}, {"icon": "cpu", "v": "3", "l": {"es": "simuladores", "en": "simulators"}}, {"icon": "wrench", "v": "1 h 45", "l": {"es": "taller de aplicación", "en": "hands-on workshop"}}, {"icon": "quiz", "v": "10", "l": {"es": "preguntas de autoevaluación", "en": "self-assessment questions"}}], "route": {"type": "flow", "title": {"es": "un informe de principio a fin", "en": "a report from start to finish"}, "items": [{"t": {"es": "Leer", "en": "Read"}, "d": {"es": "Resumir con Copilot", "en": "Summarise with Copilot"}}, {"t": {"es": "Analizar", "en": "Analyse"}, "d": {"es": "Copilot en Excel", "en": "Copilot in Excel"}}, {"t": {"es": "Presentar", "en": "Present"}, "d": {"es": "Copilot en PowerPoint", "en": "Copilot in PowerPoint"}}, {"t": {"es": "Comunicar", "en": "Communicate"}, "d": {"es": "Copilot en Outlook", "en": "Copilot in Outlook"}}]}, "howto": [{"es": "Recorra las secciones del menú; el punto verde indica las que ya visitó.", "en": "Go through the menu sections; the green dot shows the ones you have visited."}, {"es": "Use los botones superiores para cambiar de idioma y entre modo claro y oscuro.", "en": "Use the top buttons to switch language and between light and dark mode."}, {"es": "Los simuladores funcionan en su navegador y no envían datos a internet.", "en": "Simulators run in your browser and do not send data to the internet."}, {"es": "Trabaje siempre con datos ficticios o anonimizados.", "en": "Always work with fictitious or anonymised data."}], "homeTip": {"es": "Hoy medí el tiempo: el resumen y la presentación me tomaron la mitad que antes, y la revisión fue lo más importante.", "en": "Today I timed it: the summary and presentation took half as long, and the review was the key part."}, "objective": {"es": "Utilizar Microsoft Copilot y otras herramientas digitales avanzadas para agilizar la elaboración y el análisis de documentos, hojas de cálculo, presentaciones, correos y reuniones.", "en": "Use Microsoft Copilot and other advanced digital tools to speed up the creation and analysis of documents, spreadsheets, presentations, emails and meetings."}, "objTip": {"es": "Al final de la mañana tendrá un paquete completo de oficina y su propia biblioteca de prompts.", "en": "By the end of the morning you will have a complete office pack and your own prompt library."}, "outcomes": [{"es": "Diferenciar Copilot Chat de Microsoft 365 Copilot y verificar qué tiene habilitado.", "en": "Tell Copilot Chat apart from Microsoft 365 Copilot and check what is enabled."}, {"es": "Redactar, reescribir y resumir en Word y Outlook con Copilot.", "en": "Draft, rewrite and summarise in Word and Outlook with Copilot."}, {"es": "Analizar tablas en Excel y crear presentaciones con Copilot.", "en": "Analyse tables in Excel and create presentations with Copilot."}, {"es": "Obtener resúmenes, acuerdos y tareas de reuniones en Teams.", "en": "Get meeting recaps, agreements and tasks in Teams."}, {"es": "Elegir la herramienta adecuada para cada tarea.", "en": "Choose the right tool for each task."}, {"es": "Construir una biblioteca de prompts reutilizables para su área.", "en": "Build a library of reusable prompts for your unit."}], "subtopics": [{"n": "3.1", "t": {"es": "Ecosistema Copilot", "en": "The Copilot ecosystem"}, "av": "andres", "body": {"es": "<p><b>Microsoft 365 Copilot Chat<\/b> es el asistente de IA basado en la web al que se accede con la cuenta institucional; cuando aparece el aviso de <b>protección de datos empresariales<\/b>, las conversaciones no se usan para entrenar los modelos y se aplican las políticas de la organización.<\/p><p><b>Microsoft 365 Copilot<\/b> es la versión integrada en Word, Excel, PowerPoint, Outlook y Teams, que además puede trabajar con los archivos, correos y reuniones a los que el usuario tiene permiso. Requiere una licencia adicional.<\/p><p>Antes de planear su uso, confirme con el área de TI qué servicios tiene habilitados su cuenta. Las capacidades cambian con frecuencia: consulte la documentación oficial de Microsoft.<\/p>", "en": "<p><b>Microsoft 365 Copilot Chat<\/b> is the web-based AI assistant accessed with the work account; when the <b>enterprise data protection<\/b> notice appears, conversations are not used to train models and organisational policies apply.<\/p><p><b>Microsoft 365 Copilot<\/b> is the version built into Word, Excel, PowerPoint, Outlook and Teams, which can also work with the files, emails and meetings the user has permission to access. It requires an additional licence.<\/p><p>Before planning its use, check with IT which services your account has. Capabilities change often: check Microsoft's official documentation.<\/p>"}, "ex": {"es": "Laura tiene Copilot Chat con su cuenta SENA, pero no la licencia integrada: puede resumir el informe pegando el texto en el chat, aunque no desde el botón de Copilot en Word.", "en": "Laura has Copilot Chat with her SENA account, but not the integrated licence: she can summarise the report by pasting the text into the chat, though not from the Copilot button in Word."}, "tip": {"es": "Busque siempre el escudo o aviso de protección antes de escribir información de trabajo.", "en": "Always look for the protection shield or notice before typing work information."}, "g": {"type": "compare", "title": {"es": "dos formas de usar Copilot", "en": "two ways to use Copilot"}, "cols": [{"t": "Copilot Chat", "items": [{"es": "Web y app, con cuenta institucional", "en": "Web and app, with work account"}, {"es": "Usted pega o carga el contenido", "en": "You paste or upload the content"}, {"es": "Protección de datos empresariales", "en": "Enterprise data protection"}]}, {"t": "Microsoft 365 Copilot", "items": [{"es": "Dentro de Word, Excel, Outlook, Teams…", "en": "Inside Word, Excel, Outlook, Teams…"}, {"es": "Usa sus archivos y correos con permiso", "en": "Uses your files and emails with permission"}, {"es": "Licencia adicional", "en": "Additional licence"}]}]}}, {"n": "3.2", "t": {"es": "Copilot en Word y Outlook", "en": "Copilot in Word and Outlook"}, "av": "laura", "body": {"es": "<p>En <b>Word<\/b>, Copilot puede crear un borrador a partir de una instrucción o de otro archivo, reescribir párrafos, cambiar el tono, convertir texto en tabla y resumir documentos largos.<\/p><p>En <b>Outlook<\/b>, resume hilos de correo extensos, propone respuestas y ayuda a ajustar el tono (más formal, más breve, más cordial).<\/p><p>Buenas prácticas: indique el destinatario y el propósito, pida la estructura institucional (asunto, saludo, cuerpo, cierre), y lea completo el borrador antes de enviarlo.<\/p>", "en": "<p>In <b>Word<\/b>, Copilot can create a draft from an instruction or another file, rewrite paragraphs, change the tone, turn text into a table and summarise long documents.<\/p><p>In <b>Outlook<\/b>, it summarises long email threads, suggests replies and helps adjust the tone (more formal, shorter, friendlier).<\/p><p>Good practice: state the recipient and purpose, ask for the institutional structure (subject, greeting, body, closing), and read the whole draft before sending.<\/p>"}, "ex": {"es": "Un hilo de 23 correos sobre la programación de ambientes se resume en cinco viñetas con las decisiones pendientes y los responsables.", "en": "A 23-email thread about room scheduling is summarised into five bullets with pending decisions and owners."}, "tip": {"es": "Pida «resume en 5 viñetas y señala qué decisiones están pendientes y de quién»: ahorra mucho tiempo.", "en": "Ask “summarise in 5 bullets and flag pending decisions and owners”: it saves a lot of time."}, "g": {"type": "grid", "title": {"es": "acciones frecuentes", "en": "frequent actions"}, "items": [{"k": "W", "t": {"es": "Redactar", "en": "Draft"}, "d": {"es": "Oficio a partir de notas", "en": "Letter from notes"}}, {"k": "W", "t": {"es": "Reescribir", "en": "Rewrite"}, "d": {"es": "Lenguaje claro y tono", "en": "Plain language and tone"}}, {"k": "O", "t": {"es": "Resumir hilo", "en": "Summarise thread"}, "d": {"es": "Decisiones y pendientes", "en": "Decisions and to-dos"}}, {"k": "O", "t": {"es": "Responder", "en": "Reply"}, "d": {"es": "Borrador para revisar", "en": "Draft to review"}}]}}, {"n": "3.3", "t": {"es": "Copilot en Excel y PowerPoint", "en": "Copilot in Excel and PowerPoint"}, "av": "andres", "body": {"es": "<p>En <b>Excel<\/b>, Copilot trabaja mejor con datos organizados como <b>tabla<\/b> (Insertar → Tabla) y con encabezados claros. Puede sugerir fórmulas, resaltar datos, crear gráficos y tablas dinámicas, y explicar tendencias.<\/p><p>En <b>PowerPoint<\/b>, crea una presentación a partir de un documento o de una instrucción, agrega diapositivas, resume la presentación y propone notas del orador.<\/p><p>Verifique siempre las cifras y fórmulas que propone Copilot: compruebe al menos un cálculo a mano y revise que los gráficos usen el rango correcto. Ajuste el diseño al manual de imagen del SENA.<\/p>", "en": "<p>In <b>Excel<\/b>, Copilot works best with data formatted as a <b>table<\/b> (Insert → Table) with clear headers. It can suggest formulas, highlight data, create charts and pivot tables, and explain trends.<\/p><p>In <b>PowerPoint<\/b>, it creates a presentation from a document or an instruction, adds slides, summarises the deck and proposes speaker notes.<\/p><p>Always verify the figures and formulas Copilot proposes: check at least one calculation by hand and make sure charts use the right range. Adjust the design to SENA's brand manual.<\/p>"}, "ex": {"es": "Con la tabla de metas por regional, Copilot sugiere una columna «% de cumplimiento» y un gráfico de barras; el analista comprueba dos regionales manualmente.", "en": "With the targets-by-region table, Copilot suggests a “% achieved” column and a bar chart; the analyst checks two regions by hand."}, "tip": {"es": "Si Copilot en Excel no responde, revise que los datos estén en formato de tabla y que el archivo esté guardado en OneDrive o SharePoint.", "en": "If Copilot in Excel does not respond, check that the data is a table and that the file is saved in OneDrive or SharePoint."}, "g": {"type": "flow", "title": {"es": "de la tabla a la presentación", "en": "from table to presentation"}, "items": [{"t": {"es": "Tabla", "en": "Table"}, "d": {"es": "Datos con encabezados", "en": "Data with headers"}}, {"t": {"es": "Pregunta", "en": "Ask"}, "d": {"es": "¿Qué regional está rezagada?", "en": "Which region lags?"}}, {"t": {"es": "Gráfico", "en": "Chart"}, "d": {"es": "Sugerido por Copilot", "en": "Suggested by Copilot"}}, {"t": {"es": "Verificar", "en": "Verify"}, "d": {"es": "Un cálculo a mano", "en": "One calculation by hand"}}, {"t": {"es": "Presentar", "en": "Present"}, "d": {"es": "Diapositivas", "en": "Slides"}}]}}, {"n": "3.4", "t": {"es": "Copilot en Teams", "en": "Copilot in Teams"}, "av": "laura", "body": {"es": "<p>En reuniones de <b>Teams<\/b> con transcripción activa, Copilot puede resumir lo conversado, listar acuerdos, identificar preguntas sin resolver y proponer tareas con responsables.<\/p><p>Informe siempre a los asistentes que la reunión se transcribe. La transcripción y el resumen son insumos: el acta oficial la revisa y aprueba la persona responsable.<\/p><p>También puede preguntar durante la reunión: «¿qué se ha decidido hasta ahora?» o «¿qué opinó cada área?».<\/p>", "en": "<p>In <b>Teams<\/b> meetings with transcription on, Copilot can summarise what was discussed, list agreements, identify open questions and propose tasks with owners.<\/p><p>Always tell attendees the meeting is being transcribed. The transcript and recap are inputs: the official minutes are reviewed and approved by the person in charge.<\/p><p>You can also ask during the meeting: “what has been decided so far?” or “what did each unit say?”.<\/p>"}, "ex": {"es": "Al terminar el comité, Copilot entrega los acuerdos; la secretaria técnica los pega en la plantilla de acta y los ajusta.", "en": "When the committee ends, Copilot delivers the agreements; the technical secretary pastes them into the minutes template and adjusts them."}, "tip": {"es": "Pida «lista de acuerdos con responsable y fecha en formato de tabla» para pasarla directo a Planner.", "en": "Ask for “a table of agreements with owner and date” to move it straight into Planner."}, "g": {"type": "cycle", "title": {"es": "reunión asistida", "en": "assisted meeting"}, "center": "Teams", "center2": "Copilot", "items": [{"t": {"es": "Transcribir", "en": "Transcribe"}, "d": {"es": "con aviso", "en": "with notice"}}, {"t": {"es": "Resumir", "en": "Summarise"}, "d": {"es": "acuerdos", "en": "agreements"}}, {"t": {"es": "Asignar", "en": "Assign"}, "d": {"es": "tareas", "en": "tasks"}}, {"t": {"es": "Aprobar", "en": "Approve"}, "d": {"es": "acta", "en": "minutes"}}]}}, {"n": "3.5", "t": {"es": "Otras herramientas avanzadas", "en": "Other advanced tools"}, "av": "andres", "body": {"es": "<p>Además de Copilot existen herramientas especializadas. <b>NotebookLM<\/b> responde preguntas sobre documentos que usted carga, citando el fragmento de origen. <b>Perplexity<\/b> busca en la web y muestra sus fuentes. <b>Microsoft Designer<\/b> y <b>Canva<\/b> generan piezas gráficas. <b>Microsoft Loop<\/b> permite construir documentos colaborativos vivos.<\/p><p>Criterios para elegir: ¿la tarea involucra datos institucionales? (prefiera la herramienta autorizada); ¿necesita citar fuentes? (NotebookLM o Perplexity); ¿necesita diseño? (Designer o Canva, respetando el manual de imagen).<\/p>", "en": "<p>Besides Copilot there are specialised tools. <b>NotebookLM<\/b> answers questions about documents you upload, citing the source passage. <b>Perplexity<\/b> searches the web and shows its sources. <b>Microsoft Designer<\/b> and <b>Canva<\/b> generate graphics. <b>Microsoft Loop<\/b> lets you build live collaborative documents.<\/p><p>Choosing criteria: does the task involve institutional data? (prefer the authorised tool); do you need to cite sources? (NotebookLM or Perplexity); do you need design? (Designer or Canva, following the brand manual).<\/p>"}, "ex": {"es": "Para preparar una charla sobre la Ley 1581, Laura carga la ley en NotebookLM y pide preguntas frecuentes con cita al artículo.", "en": "To prepare a talk on Law 1581, Laura uploads the law into NotebookLM and asks for FAQs citing the article."}, "tip": {"es": "Use el simulador «¿Qué herramienta uso?» para decidir rápido.", "en": "Use the “Which tool should I use?” simulator to decide quickly."}, "g": {"type": "grid", "title": {"es": "la herramienta según la tarea", "en": "the tool for the task"}, "items": [{"k": "📄", "t": "NotebookLM", "d": {"es": "Preguntas sobre sus documentos", "en": "Questions about your documents"}}, {"k": "🔎", "t": "Perplexity", "d": {"es": "Búsqueda con fuentes", "en": "Search with sources"}}, {"k": "🎨", "t": "Designer / Canva", "d": {"es": "Piezas gráficas", "en": "Graphics"}}, {"k": "🧩", "t": "Loop", "d": {"es": "Documentos colaborativos", "en": "Collaborative documents"}}]}}, {"n": "3.6", "t": {"es": "Biblioteca de prompts institucionales", "en": "Institutional prompt library"}, "av": "laura", "body": {"es": "<p>Una <b>biblioteca de prompts<\/b> es un documento compartido con las instrucciones que mejor funcionan para las tareas frecuentes del área. Ahorra tiempo, unifica la calidad y facilita que los nuevos funcionarios usen la IA correctamente.<\/p><p>Cada entrada debe tener: nombre de la tarea, prompt con campos entre corchetes, herramienta recomendada, ejemplo de resultado y advertencias (qué verificar, qué datos no incluir).<\/p><p>Guárdela en un espacio del equipo (SharePoint, Teams o Loop) y actualícela cuando un prompt mejore.<\/p>", "en": "<p>A <b>prompt library<\/b> is a shared document with the instructions that work best for the unit's frequent tasks. It saves time, standardises quality and helps new staff use AI correctly.<\/p><p>Each entry should have: task name, prompt with fields in brackets, recommended tool, sample result and warnings (what to verify, what data not to include).<\/p><p>Store it in a team space (SharePoint, Teams or Loop) and update it when a prompt improves.<\/p>"}, "ex": {"es": "«Resumen de informe trimestral: Actúa como analista de planeación del SENA. Resume [INFORME] en una tabla aspecto–hallazgo–acción y tres recomendaciones. Usa solo los datos del texto.»", "en": "“Quarterly report summary: Act as a SENA planning analyst. Summarise [REPORT] in an aspect–finding–action table and three recommendations. Use only the text data.”"}, "tip": {"es": "Los corchetes recuerdan qué debe reemplazar el usuario y evitan pegar datos de más.", "en": "Brackets remind users what to replace and avoid pasting extra data."}, "g": {"type": "grid", "title": {"es": "ficha de un prompt", "en": "prompt card"}, "items": [{"k": "1", "t": {"es": "Tarea", "en": "Task"}, "d": ""}, {"k": "2", "t": {"es": "Prompt con [campos]", "en": "Prompt with [fields]"}, "d": ""}, {"k": "3", "t": {"es": "Herramienta", "en": "Tool"}, "d": ""}, {"k": "4", "t": {"es": "Ejemplo", "en": "Example"}, "d": ""}, {"k": "5", "t": {"es": "Advertencias", "en": "Warnings"}, "d": ""}]}}], "sims": [{"k": "picker", "t": {"es": "¿Qué herramienta uso?", "en": "Which tool should I use?"}, "d": {"es": "Elija una tarea y vea la herramienta recomendada, cómo hacerlo y un prompt de ejemplo.", "en": "Pick a task and see the recommended tool, how to do it and a sample prompt."}, "tip": {"es": "Copie el prompt y reemplace lo que está entre corchetes.", "en": "Copy the prompt and replace what is in brackets."}}, {"k": "prompt", "t": {"es": "Constructor de prompts para Copilot", "en": "Copilot prompt builder"}, "d": {"es": "Construya prompts para Word, Excel, PowerPoint y Outlook con los ejemplos precargados.", "en": "Build prompts for Word, Excel, PowerPoint and Outlook with the preloaded examples."}, "tip": {"es": "Agregue siempre el formato de salida.", "en": "Always add the output format."}}, {"k": "halluc", "t": {"es": "¿Verdadero o falso sobre Copilot?", "en": "True or false about Copilot?"}, "d": {"es": "Ponga a prueba sus conocimientos sobre el uso seguro de Copilot.", "en": "Test your knowledge of safe Copilot use."}, "tip": {"es": "Si duda, consulte la documentación oficial de Microsoft.", "en": "If in doubt, check Microsoft's official documentation."}}], "picker": {"label": {"es": "¿Qué necesita hacer?", "en": "What do you need to do?"}, "items": [{"t": {"es": "Resumir un informe de 40 páginas", "en": "Summarise a 40-page report"}, "app": "Copilot en Word / Copilot Chat", "how": {"es": "Abra el documento y use Copilot → Resumir; o pegue el texto en Copilot Chat.", "en": "Open the document and use Copilot → Summarise; or paste the text into Copilot Chat."}, "prompt": {"es": "Resume este informe en 7 viñetas: logros, metas atrasadas, riesgos y recomendaciones. Indica la página de cada dato.", "en": "Summarise this report in 7 bullets: achievements, delayed targets, risks and recommendations. Give the page of each item."}}, {"t": {"es": "Responder un hilo de correos largo", "en": "Reply to a long email thread"}, "app": "Copilot en Outlook", "how": {"es": "Abra el hilo, pulse Resumir y luego Redactar con Copilot.", "en": "Open the thread, click Summarise and then Draft with Copilot."}, "prompt": {"es": "Redacta una respuesta cordial que confirme los acuerdos del hilo y pida a [ÁREA] el dato pendiente antes del [FECHA].", "en": "Draft a friendly reply confirming the thread agreements and asking [UNIT] for the pending data before [DATE]."}}, {"t": {"es": "Analizar una tabla de metas", "en": "Analyse a targets table"}, "app": "Copilot en Excel", "how": {"es": "Convierta los datos en tabla (Ctrl+T), guarde en OneDrive y abra Copilot.", "en": "Format data as a table (Ctrl+T), save to OneDrive and open Copilot."}, "prompt": {"es": "Agrega una columna de % de cumplimiento (ejecutado/meta), resalta las filas por debajo de 80 % y crea un gráfico de barras por regional.", "en": "Add a % achieved column (actual/target), highlight rows below 80% and create a bar chart by region."}}, {"t": {"es": "Crear una presentación a partir de un documento", "en": "Create a presentation from a document"}, "app": "Copilot en PowerPoint", "how": {"es": "Copilot → Crear presentación desde archivo y seleccione el documento.", "en": "Copilot → Create presentation from file and select the document."}, "prompt": {"es": "Crea 6 diapositivas a partir de [DOCUMENTO]: título, contexto, 3 hallazgos y próximos pasos, con notas del orador.", "en": "Create 6 slides from [DOCUMENT]: title, context, 3 findings and next steps, with speaker notes."}}, {"t": {"es": "Obtener el acta de una reunión", "en": "Get meeting minutes"}, "app": "Copilot en Teams", "how": {"es": "Active la transcripción al iniciar; al final abra Copilot en el resumen de la reunión.", "en": "Turn on transcription at the start; at the end open Copilot in the meeting recap."}, "prompt": {"es": "Lista los acuerdos en una tabla con responsable y fecha, y las preguntas que quedaron sin resolver.", "en": "List agreements in a table with owner and date, and the open questions."}}, {"t": {"es": "Preguntar sobre una norma con citas", "en": "Ask about a regulation with citations"}, "app": "NotebookLM", "how": {"es": "Cree un cuaderno y cargue el PDF oficial de la norma.", "en": "Create a notebook and upload the official PDF of the regulation."}, "prompt": {"es": "Elabora 10 preguntas frecuentes sobre esta ley para funcionarios, con la respuesta y el artículo exacto.", "en": "Write 10 FAQs about this law for staff, with the answer and the exact article."}}, {"t": {"es": "Diseñar una pieza para Teams", "en": "Design a piece for Teams"}, "app": "Microsoft Designer / Canva", "how": {"es": "Genere la imagen y ajuste colores y tipografía al manual de imagen del SENA.", "en": "Generate the image and adjust colours and type to SENA's brand manual."}, "prompt": {"es": "Pieza cuadrada para invitar a funcionarios a una capacitación sobre IA, estilo moderno, colores verde #39A900 y azul #00304D, sin texto incrustado.", "en": "Square piece inviting staff to an AI training, modern style, green #39A900 and blue #00304D, no embedded text."}}]}, "promptPresets": [{"label": "Word", "vals": {"es": ["Actúa como profesional administrativo del SENA", "Debo informar a los coordinadores el cambio de horario de atención al público a partir del 1 de diciembre", "Redacta una circular interna", "Estructura institucional: asunto, cuerpo de máximo 150 palabras y cierre; lenguaje claro", "No inventes fechas adicionales ni normas"], "en": ["Act as a SENA administrative officer", "I must inform coordinators of the change in public opening hours from December 1", "Write an internal circular", "Institutional structure: subject, body of max 150 words and closing; plain language", "Do not invent additional dates or rules"]}}, {"label": "Excel", "vals": {"es": ["Actúa como analista de datos", "Tengo una tabla con columnas Regional, Meta y Ejecutado", "Calcula el % de cumplimiento, identifica las 3 regionales más rezagadas y crea un gráfico", "Nueva columna, formato condicional y gráfico de barras", "Explica la fórmula usada"], "en": ["Act as a data analyst", "I have a table with columns Region, Target and Actual", "Calculate % achieved, identify the 3 most lagging regions and create a chart", "New column, conditional formatting and bar chart", "Explain the formula used"]}}, {"label": "PowerPoint", "vals": {"es": ["Actúa como comunicador institucional", "Debo presentar el informe trimestral al comité directivo en 10 minutos", "Crea una presentación a partir del informe adjunto", "6 diapositivas con títulos de máximo 8 palabras y notas del orador", "Usa solo cifras del informe"], "en": ["Act as an institutional communicator", "I must present the quarterly report to the board in 10 minutes", "Create a presentation from the attached report", "6 slides with titles of max 8 words and speaker notes", "Use only figures from the report"]}}, {"label": "Outlook", "vals": {"es": ["Actúa como asistente de la coordinación", "Un proveedor pide ampliar el plazo de entrega una semana", "Redacta una respuesta que acepte la ampliación si envía el cronograma ajustado", "Correo breve, cordial y formal, con asunto", "No comprometas pagos ni fechas no indicadas"], "en": ["Act as the coordinator's assistant", "A supplier asks to extend the delivery deadline by one week", "Draft a reply accepting the extension if they send the adjusted schedule", "Short, friendly, formal email with subject", "Do not commit to payments or dates not stated"]}}], "halluc": [{"s": {"es": "Con el aviso de protección de datos empresariales, mis conversaciones en Copilot Chat no se usan para entrenar los modelos.", "en": "With the enterprise data protection notice, my Copilot Chat conversations are not used to train the models."}, "real": true, "why": {"es": "Correcto según la documentación de Microsoft; aun así, no ingrese información reservada.", "en": "Correct per Microsoft's documentation; still, do not enter confidential information."}}, {"s": {"es": "Copilot en Excel funciona igual con datos sueltos que con datos en formato de tabla.", "en": "Copilot in Excel works the same with loose data as with table-formatted data."}, "real": false, "why": {"es": "Falso: Copilot en Excel trabaja mejor (y en muchos casos solo) con datos en formato de tabla y encabezados claros.", "en": "False: Copilot in Excel works best (and often only) with table-formatted data and clear headers."}}, {"s": {"es": "El resumen de una reunión de Teams generado por Copilot reemplaza el acta oficial aprobada.", "en": "A Teams meeting recap generated by Copilot replaces the officially approved minutes."}, "real": false, "why": {"es": "Falso: es un insumo; el acta oficial la revisa y aprueba la persona responsable.", "en": "False: it is an input; the official minutes are reviewed and approved by the person in charge."}}, {"s": {"es": "NotebookLM responde citando los fragmentos de los documentos que usted cargó.", "en": "NotebookLM answers citing passages from the documents you uploaded."}, "real": true, "why": {"es": "Correcto: es una de sus principales ventajas para verificar.", "en": "Correct: it is one of its main advantages for verification."}}, {"s": {"es": "Todas las cuentas institucionales tienen incluida la licencia de Microsoft 365 Copilot en Word y Excel.", "en": "All work accounts include the Microsoft 365 Copilot licence in Word and Excel."}, "real": false, "why": {"es": "Falso: la versión integrada requiere licencia adicional; verifique con TI.", "en": "False: the integrated version requires an additional licence; check with IT."}}, { /* ---------- infographics ---------- */
function infographic(g){
  if(!g) return '';
  let h='';
  if(g.type==='flow') h = `<div class="flow">${g.items.map((s,i)=>`<div class="st"><b>${i+1}</b><span>${T(s.t)}</span><small>${T(s.d)}</small></div>`).join('')}</div>`;
  if(g.type==='grid') h = `<div class="igrid">${g.items.map(s=>`<div><b>${T(s.k)}</b><span>${T(s.t)}</span><small>${T(s.d)}</small></div>`).join('')}</div>`;
  if(g.type==='compare') h = `<div class="cmp">${g.cols.map(c=>`<div><b>${T(c.t)}</b><ul>${c.items.map(x=>`<li>${T(x)}</li>`).join('')}</ul></div>`).join('')}</div>`;
  if(g.type==='nested'){
    const n=g.items.length, cols=['#00304D','#007832','#39A900','#9BDB78','#C9EEB4'];
    let s=`<svg class="inf" viewBox="0 0 420 290" role="img">`;
    g.items.forEach((it,i)=>{ s+=`<ellipse cx="210" cy="${150+i*18}" rx="${205-i*42}" ry="${138-i*30}" fill="${cols[i%5]}"/>`; });
    g.items.forEach((it,i)=>{ const y = i==n-1 ? 150+i*18-2 : 150+i*18-(138-i*30)+21; const c = i>=3?'#00304D':'#fff';
      s+=`<text x="210" y="${y}" text-anchor="middle" fill="${c}" font-size="${i==n-1?15:13.5}" font-weight="700">${T(it.t)}</text><text x="210" y="${y+14}" text-anchor="middle" fill="${c}" font-size="10.5">${T(it.d)}</text>`; });
    h = s+'</svg>';
  }
  if(g.type==='cycle'){
    const n=g.items.length, R=105, cx=210, cy=150; let s=`<svg class="inf" viewBox="0 0 420 300" role="img"><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#39A900" stroke-width="3" stroke-dasharray="6 6"/>`;
    s+=`<circle cx="${cx}" cy="${cy}" r="52" fill="#00304D"/><text x="${cx}" y="${cy-2}" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">${T(g.center)}</text><text x="${cx}" y="${cy+15}" text-anchor="middle" fill="#7FD45A" font-size="11">${T(g.center2||'')}</text>`;
    g.items.forEach((it,i)=>{const a=-Math.PI/2+i*2*Math.PI/n, x=cx+R*Math.cos(a), y=cy+R*Math.sin(a);
      s+=`<circle cx="${x}" cy="${y}" r="34" fill="${i%2?'#007832':'#39A900'}"/><text x="${x}" y="${y-2}" text-anchor="middle" fill="#fff" font-size="11.5" font-weight="700">${T(it.t)}</text><text x="${x}" y="${y+12}" text-anchor="middle" fill="#fff" font-size="10">${T(it.d)}</text>`});
    h=s+'</svg>';
  }
  return `<div class="info"><div class="cap">${u('infog')} · ${T(g.title)}</div>${h}</div>`;
}

SIM.classifier = box => {
  const C = D.classifier; let train = C.train.slice();
  const cats = C.cats;
  const tok = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9ñ\s]/g,' ').split(/\s+/).filter(w=>w.length>2 && !C.stop.includes(w));
  const model = () => { const m={cnt:{},w:{},tot:{},voc:new Set()}; cats.forEach(c=>{m.cnt[c.k]=0;m.w[c.k]={};m.tot[c.k]=0});
    train.forEach(([t,c])=>{m.cnt[c]++; tok(t).forEach(w=>{m.w[c][w]=(m.w[c][w]||0)+1;m.tot[c]++;m.voc.add(w)})}); return m; };
  const predict = (m,txt) => { const ws=tok(txt), V=m.voc.size, N=train.length; const lp={};
    cats.forEach(c=>{let s=Math.log((m.cnt[c.k]+1)/(N+cats.length)); ws.forEach(w=>s+=Math.log(((m.w[c.k][w]||0)+1)/(m.tot[c.k]+V))); lp[c.k]=s});
    const mx=Math.max(...Object.values(lp)); let z=0; cats.forEach(c=>{lp[c.k]=Math.exp(lp[c.k]-mx); z+=lp[c.k]}); cats.forEach(c=>lp[c.k]/=z); return {p:lp, known:ws.filter(w=>m.voc.has(w))}; };
  box.innerHTML = `<div class="grid g2"><div><label class="f">${L=='es'?'Escriba o elija una PQRS':'Type or pick a request (PQRS)'}</label><textarea id="c_in"></textarea>
   <div class="row mt">${C.samples.map((s,i)=>`<button class="btn ghost" data-cs="${i}">${L=='es'?'Muestra':'Sample'} ${i+1}</button>`).join('')}</div>
   <div class="row mt"><button class="btn" id="c_go">${I('cpu')} ${L=='es'?'Clasificar':'Classify'}</button></div>
   <h4>${L=='es'?'Enseñe al modelo (aprendizaje supervisado)':'Teach the model (supervised learning)'}</h4>
   <div class="row"><select id="c_lab" style="width:auto">${cats.map(c=>`<option value="${c.k}">${T(c.n)}</option>`).join('')}</select><button class="btn alt" id="c_add">${L=='es'?'Agregar como ejemplo etiquetado':'Add as labelled example'}</button></div>
   <p class="small" id="c_n"></p></div>
   <div><label class="f">${L=='es'?'Predicción del modelo':'Model prediction'}</label><div class="out" id="c_out">—</div><div class="bars mt" id="c_bars"></div><p class="small" id="c_words"></p></div></div>`;
  const run = () => { const m=model(); const txt=document.getElementById('c_in').value; if(!txt.trim()) return; const r=predict(m,txt);
    const best=cats.reduce((a,c)=>r.p[c.k]>r.p[a.k]?c:a);
    document.getElementById('c_out').innerHTML = `<b style="font-size:20px">${T(best.n)}</b> · ${(r.p[best.k]*100).toFixed(0)}% ${L=='es'?'de confianza':'confidence'}<br><span class="small">${T(best.d)}</span>`;
    document.getElementById('c_bars').innerHTML = cats.map(c=>`<div class="b"><span>${T(c.n)}</span><div><i style="width:${r.p[c.k]*100}%;background:${c.k==best.k?'var(--sena)':'var(--muted)'}"></i></div><span>${(r.p[c.k]*100).toFixed(0)}%</span></div>`).join('');
    document.getElementById('c_words').innerHTML = (L=='es'?'Palabras que el modelo reconoció: ':'Words the model recognised: ') + (r.known.map(w=>`<mark>${w}</mark>`).join(' ')||'—') + (r.p[best.k]<.55?`<br><span class="warnc">${L=='es'?'Confianza baja: un humano debe revisar.':'Low confidence: a human should review.'}</span>`:''); };
  const cnt = () => document.getElementById('c_n').textContent = (L=='es'?'Ejemplos de entrenamiento: ':'Training examples: ')+train.length;
  box.querySelectorAll('[data-cs]').forEach(b=>b.onclick=()=>{document.getElementById('c_in').value=T(C.samples[+b.dataset.cs]); run();});
  document.getElementById('c_go').onclick=run;
  document.getElementById('c_add').onclick=()=>{const t=document.getElementById('c_in').value.trim(); if(!t) return; train.push([t,document.getElementById('c_lab').value]); cnt(); run();};
  cnt();
};

  const G0=D.gap;
  box.innerHTML = `<div class="grid g2"><div>${G0.domains.map((d,i)=>`<div class="card" style="padding:12px;margin-bottom:8px"><b>${T(d.t)}</b><div class="small">${T(d.d)}</div>
    <div class="row"><span class="small" style="width:70px">AS-IS</span><input type="range" min="1" max="5" value="${d.a||2}" data-ga="${i}" style="flex:1;accent-color:#00304D"><span class="small" style="width:70px;text-align:right">TO-BE</span><input type="range" min="1" max="5" value="${d.b||4}" data-gb="${i}" style="flex:1;accent-color:#39A900"></div></div>`).join('')}</div>
    <div><label class="f">${L=='es'?'Brechas por dominio (1 = inicial, 5 = optimizado)':'Gaps by domain (1 = initial, 5 = optimised)'}</label><div id="g_o"></div><div class="out mt" id="g_p"></div></div></div>`;
  const go=()=>{ const r=G0.domains.map((d,i)=>({t:T(d.t),a:+box.querySelector(`[data-ga="${i}"]`).value,b:+box.querySelector(`[data-gb="${i}"]`).value}));
    document.getElementById('g_o').innerHTML=r.map(x=>`<div style="margin:10px 0"><div class="small"><b>${x.t}</b> · AS-IS ${x.a} → TO-BE ${x.b} · ${L=='es'?'brecha':'gap'} <b>${Math.max(0,x.b-x.a)}</b></div>
      <div style="position:relative;height:14px;background:var(--line);border-radius:9px"><i style="position:absolute;left:0;top:0;bottom:0;width:${x.a/5*100}%;background:#00304D;border-radius:9px"></i><i style="position:absolute;left:${x.a/5*100}%;top:0;bottom:0;width:${Math.max(0,x.b-x.a)/5*100}%;background:#39A900;border-radius:0 9px 9px 0"></i></div></div>`).join('');
    const pr=r.filter(x=>x.b>x.a).sort((p,q)=>(q.b-q.a)-(p.b-p.a));
    document.getElementById('g_p').innerHTML=`<b>${L=='es'?'Prioridad sugerida para la hoja de ruta':'Suggested roadmap priority'}</b><ol class="list">${pr.map(x=>`<li>${x.t} (${L=='es'?'brecha':'gap'} ${x.b-x.a})</li>`).join('')||'<li>—</li>'}</ol>`; };
  box.querySelectorAll('input').forEach(x=>x.oninput=go); go();
};

/* ---------- shell ---------- */
function render(){
  document.documentElement.lang = L;
  document.title = T(D.meta.title) + ' · ' + T(D.meta.code);
  document.getElementById('bCode').textContent = T(D.meta.code);
  document.getElementById('bTitle').textContent = T(D.meta.short);
  document.getElementById('tTitle').innerHTML = `${T(D.meta.title)}<small>${T(D.meta.event)}</small>`;
  document.getElementById('sfoot').innerHTML = `${T(D.meta.event)}<br>${T(D.meta.instructor)} · ${T(D.meta.center)}`;
  document.getElementById('nav').innerHTML = SECTIONS.map(([k,ic])=>`<button data-go="${k}" class="${k==current?'on':''} ${seen[k]?'seen':''}">${I(ic)} ${u(k)}<span class="dot"></span></button>`).join('');
  document.getElementById('content').innerHTML = `<section class="pane on">${R[current]()}</section>`;
  const dark = document.documentElement.getAttribute('data-theme')==='dark' || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  document.getElementById('themeBtn').innerHTML = dark? I('sun')+' '+u('light') : I('moon')+' '+u('dark');
  document.getElementById('langBtn').innerHTML = I('globe') + (L=='es'?' English':' Español');
  const n=SECTIONS.length, v=SECTIONS.filter(([k])=>seen[k]).length;
  document.getElementById('pbar').style.width = (v/n*100)+'%';
  document.getElementById('ptxt').textContent = `${Math.round(v/n*100)}% ${u('prog')}`;
  bind();
}
function bind(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{subTab=+b.dataset.sub;render();window.scrollTo(0,0)});
  document.querySelectorAll('[data-sim]').forEach(b=>b.onclick=()=>{simTab=+b.dataset.sim;render()});
  const sb=document.getElementById('simBox'); if(sb) SIM[D.sims[simTab].k](sb);
  document.querySelectorAll('[data-q]').forEach(o=>o.onclick=()=>{const qi=+o.dataset.q, oi=+o.dataset.o; if(quizState[qi]) return; quizState[qi]={c:oi,ok:oi==D.quiz[qi].a}; const y=window.scrollY; render(); window.scrollTo(0,y);});
  const qr=document.getElementById('qreset'); if(qr) qr.onclick=()=>{quizState={};render();};
  document.querySelectorAll('[data-step]').forEach(c=>c.onchange=()=>{stepsDone[c.dataset.step]=c.checked; save('ova_steps_'+D.meta.id,stepsDone); const y=window.scrollY; render(); window.scrollTo(0,y);});
  document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>{const el=document.getElementById('model'+b.dataset.model); el.classList.toggle('hide'); b.textContent=el.classList.contains('hide')?u('show'):u('hide');});
  document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{const ei=+b.dataset.check, e=D.exercises[ei]; let ok=0;
    e.items.forEach((it,ii)=>{const s=document.querySelector(`select[data-ex="${ei}"][data-it="${ii}"]`); const r=document.getElementById(`r${ei}_${ii}`); const good= s.value!=='' && +s.value===it.a; if(good) ok++;
      r.innerHTML = s.value===''?'':(good?`<span class="okc">✓</span>`:`<span class="badc">✗ ${T(e.opts[it.a])}</span>`); document.getElementById(`fb${ei}_${ii}`).classList.remove('hide');});
    document.getElementById('es'+ei).innerHTML=`<b>${ok}/${e.items.length}</b> ${L=='es'?'aciertos':'correct'}`;});
  const gs=document.getElementById('gsearch'); if(gs) gs.oninput=()=>document.getElementById('glist').innerHTML=glo(gs.value);
}
function go(k){ current=k; seen[k]=true; save('ova_seen_'+D.meta.id,seen); render(); window.scrollTo(0,0); }
document.getElementById('langBtn').onclick=()=>{ L = L=='es'?'en':'es'; try{localStorage.setItem('ova_lang',L)}catch(e){} render(); };
document.getElementById('themeBtn').onclick=()=>{ const r=document.documentElement; const dark = r.getAttribute('data-theme')==='dark' || (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  r.setAttribute('data-theme', dark?'light':'dark'); try{localStorage.setItem('ova_theme',dark?'light':'dark')}catch(e){} render(); };
try{ const th=localStorage.getItem('ova_theme'); if(th) document.documentElement.setAttribute('data-theme',th);}catch(e){}
seen.home=true;
function fromHash(){ const h=(location.hash||'').slice(1); if(!h) return false; const m=/^sub(\d+)$/.exec(h); const m2=/^sim(\d+)$/.exec(h);
  if(m){ subTab=Math.min(D.subtopics.length-1,+m[1]-1); current='sub'; }
  else if(m2){ simTab=Math.min(D.sims.length-1,+m2[1]-1); current='sim'; }
  else if(SECTIONS.some(([k])=>k===h)) current=h; else return false;
  seen[current]=true; return true; }
fromHash(); render();
window.addEventListener('hashchange',()=>{ if(fromHash()){ render(); window.scrollTo(0,0);} });
</script>
</body>
